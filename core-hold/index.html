<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>核心守衛 CORE HOLD</title>
<style>
  html,body{margin:0;height:100%;background:#07080f;color-scheme:dark;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff}
  #wrap{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;align-items:center}
  #game{position:relative;overflow:hidden;background:#07080f}
  canvas{display:block;touch-action:none}
  button{font-family:inherit;-webkit-tap-highlight-color:transparent}
  .btn-top{position:absolute;top:14px;width:34px;height:34px;border-radius:8px;
    border:1.5px solid rgba(255,255,255,.22);background:rgba(10,12,24,.6);color:#fff;font:700 14px/1 system-ui;
    display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:5}
  #bMute{right:10px} #bPause{right:50px}

  #hud{position:absolute;left:0;right:0;top:0;z-index:4;pointer-events:none;display:none}
  #hud.on{display:block}
  #xpbar{height:6px;background:rgba(255,255,255,.08)}
  #xpfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#3cf2ff,#4dff9a);box-shadow:0 0 10px #3cf2ff;transition:width .12s}
  #xpbar.flash #xpfill{background:#fff}
  #hrow{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 96px 0 12px;font-variant-numeric:tabular-nums}
  #lvT{font:900 20px system-ui;color:#3cf2ff;min-width:60px}
  #mid{display:flex;flex-direction:column;align-items:center;line-height:1}
  #timeT{font:900 24px system-ui;letter-spacing:1px}
  #killT{font:800 11px system-ui;color:rgba(255,255,255,.5);margin-top:3px}
  #inv{display:flex;flex-direction:column;gap:4px;padding:6px 12px 0}
  #inv .r{display:flex;gap:4px}
  #inv .s{position:relative;width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
  #inv .s.p{width:18px;height:18px}
  #inv svg{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
  #inv .s i{position:absolute;right:-2px;bottom:-3px;font:900 9px system-ui;font-style:normal;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
  #inv .s.evo{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}

  #bOD{position:absolute;right:14px;bottom:16px;z-index:5;--p:0;border:0;background:conic-gradient(#b36bff calc(var(--p)*1%),rgba(255,255,255,.1) 0);border-radius:50%;
    width:58px;height:58px;padding:0;cursor:pointer;display:none}
  #bOD.show{display:block}
  #bOD span{position:absolute;inset:4px;border-radius:50%;background:#0d1024;display:flex;align-items:center;justify-content:center;
    font:italic 900 16px system-ui;color:rgba(255,255,255,.55)}
  #bOD.full span{background:#b36bff;color:#fff;animation:pulse .5s ease-in-out infinite}
  #bOD.on span{background:#fff;color:#b36bff}
  #bOD:active{transform:scale(.92)}

  .ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(7,8,15,.84);z-index:10;text-align:center;padding:0 18px;box-sizing:border-box}
  .ov.on{display:flex}
  .ov h1{margin:0;font-size:44px;font-weight:900;letter-spacing:2px;line-height:1.05;
    background:linear-gradient(90deg,#3cf2ff,#ff3d7f);-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:zoom .45s cubic-bezier(.2,1.6,.4,1) both}
  .ov h2{margin:4px 0 0;font-size:14px;font-weight:800;letter-spacing:6px;color:#3cf2ff;opacity:.85}
  .ov p{margin:6px 0;color:rgba(255,255,255,.7);font-size:14px;line-height:1.6}
  .ov .big{font-size:44px;font-weight:900;color:#fff;margin:6px 0;font-variant-numeric:tabular-nums}
  .go{margin-top:20px;padding:14px 46px;font:900 20px system-ui;letter-spacing:4px;color:#07080f;background:#3cf2ff;
    border:0;border-radius:6px;cursor:pointer;transform:skewX(-10deg);box-shadow:0 0 24px rgba(60,242,255,.5);animation:pulse 1.2s ease-in-out infinite}
  .go:active{transform:skewX(-10deg) scale(.94)}
  .go2{margin-top:12px;padding:10px 28px;font:900 16px system-ui;letter-spacing:2px;color:#ffd23d;background:rgba(255,210,61,.08);
    border:1.5px solid #ffd23d;border-radius:6px;cursor:pointer;transform:skewX(-10deg)}
  .go2:active{transform:skewX(-10deg) scale(.94)}
  .coin{color:#ffd23d;font-weight:900}
  .tips{margin-top:16px;font-size:13px;color:rgba(255,255,255,.62);line-height:1.85;text-align:left}
  .tips b{color:#3cf2ff}
  .ttl{font-size:28px;font-weight:900;letter-spacing:4px;color:#fff;animation:zoom .35s cubic-bezier(.2,1.6,.4,1) both}
  .sub{font-size:13px;color:rgba(255,255,255,.55);margin-top:4px}
  .stats{display:grid;grid-template-columns:auto auto;gap:6px 18px;margin-top:12px;font-size:15px;color:rgba(255,255,255,.75)}
  .stats b{color:#fff;text-align:right;font-variant-numeric:tabular-nums}
  .new{color:#ffb020;font-weight:900;letter-spacing:2px;animation:pulse .6s ease-in-out infinite}

  #cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:370px;margin-top:14px}
  .card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:2px solid var(--c);
    background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.01));color:#fff;text-align:left;cursor:pointer;
    animation:slide .3s cubic-bezier(.2,1.3,.4,1) both;box-shadow:0 0 16px -4px var(--c)}
  .card:active{transform:scale(.96)}
  .card.evo{background:linear-gradient(90deg,rgba(255,225,77,.22),rgba(255,255,255,.02));border-color:#ffe14d;box-shadow:0 0 26px -2px #ffe14d}
  .card svg{width:40px;height:40px;flex:none}
  .card div{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .card b{font-size:17px;font-weight:900;color:var(--c)}
  .card span{font-size:13px;color:rgba(255,255,255,.8)}
  .card small{font-size:11px;color:rgba(255,255,255,.45)}
  .card em{font-style:normal;font-size:11px;font-weight:900;padding:2px 6px;border-radius:4px;background:var(--c);color:#07080f;align-self:flex-start;white-space:nowrap}
  #bReroll{margin-top:14px;padding:8px 20px;border-radius:8px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:800 14px system-ui;cursor:pointer}
  #bReroll:disabled{opacity:.3}

  #shopList{display:flex;flex-direction:column;gap:8px;width:100%;max-width:370px;margin-top:14px;max-height:60vh;overflow:auto}
  .si{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);text-align:left}
  .si div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .si b{font-size:15px}
  .si span{font-size:12px;color:rgba(255,255,255,.6)}
  .pips{display:flex;gap:3px;margin-top:2px}
  .pips i{width:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
  .pips i.on{background:#ffd23d}
  .buy{min-width:74px;height:38px;border-radius:8px;border:0;background:#ffd23d;color:#07080f;font:900 14px system-ui;cursor:pointer}
  .buy:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.35)}
  @keyframes slide{from{transform:translateX(130%) skewX(-14deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes zoom{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
</style>
</head>
<body>

  <div class="ov" id="ovLv">

</div></div>

<script>
(() => {
'use strict';
// ================= utils =================
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const $ = id => document.getElementById(id);
const F = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const wrapAng = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
function segDist2(ax, ay, bx, by, px, py) {
  const abx = bx - ax, aby = by - ay;
  const t = clamp(((px - ax) * abx + (py - ay) * aby) / (abx * abx + aby * aby || 1), 0, 1);
  const cx = ax + abx * t - px, cy = ay + aby * t - py;
  return cx * cx + cy * cy;
}
const fmtT = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ================= canvas =================
const game = $('game'), cv = $('c'), ctx = cv.getContext('2d');
const LW = 420;
let LH = 800, SCALE = 1, CX = 210, CY = 420, dprCap = 1.75;
const CORE_R = 24, SAFE_R = 60;
function resize() {
  const wr = $('wrap');
  const iw = wr.clientWidth || window.innerWidth, ih = wr.clientHeight || window.innerHeight;
  const gw = Math.min(iw, Math.round(ih * 0.62));
  game.style.width = gw + 'px'; game.style.height = ih + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
  cv.width = Math.round(gw * dpr); cv.height = Math.round(ih * dpr);
  cv.style.width = gw + 'px'; cv.style.height = ih + 'px';
  SCALE = cv.width / LW; LH = cv.height / SCALE;
  CX = LW / 2; CY = LH * 0.53;
  initStreaks();
}
window.addEventListener('resize', resize);

// ================= audio =================
let AC = null, master = null, nbuf = null, muted = store.get('ch_muted', false);
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    master = AC.createGain(); master.gain.value = 0.5;
    master.connect(comp); comp.connect(AC.destination);
    nbuf = AC.createBuffer(1, AC.sampleRate * 0.6 | 0, AC.sampleRate);
    const d = nbuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq, type = 'lowpass', q = 1, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.2, dur + 0.02);
}
const lastS = {};
function can(k, gap) { const n = performance.now(); if (n - (lastS[k] || 0) < gap) return false; lastS[k] = n; return true; }
const sfx = {
  gun() { if (!can('g', 45)) return; tone(rand(1100, 1400), 340, 0.05, 'square', 0.025); noise(0.025, 0.04, 5000, 'highpass'); },
  beam() { if (!can('bm', 90)) return; tone(rand(700, 760), 680, 0.09, 'sawtooth', 0.02); },
  hit(big) { if (!can('h', 32)) return; noise(0.045, big ? 0.28 : 0.1, big ? 2200 : 3800, 'bandpass', 1.5); if (big) tone(1900, 900, 0.08, 'triangle', 0.09); },
  kill(sz) {
    if (!can('k', 40)) return;
    noise(0.1 + sz * 0.25, 0.28 + sz * 0.35, 1100 - sz * 600);
    tone(240 - sz * 120, 38, 0.12 + sz * 0.35, 'sine', 0.38 + sz * 0.3);
    const p = 420 * Math.pow(2, Math.min(combo, 24) / 12);
    tone(p, p * 0.5, 0.06, 'square', 0.03);
  },
  boom() { if (!can('b', 60)) return; noise(0.28, 0.4, 700); tone(110, 35, 0.28, 'sine', 0.45); },
  zap() { if (!can('z', 70)) return; tone(rand(1600, 2200), 300, 0.12, 'sawtooth', 0.05); noise(0.12, 0.2, 3500, 'bandpass', 3); },
  frost() { if (!can('f', 120)) return; tone(2400, 1200, 0.2, 'triangle', 0.05); noise(0.2, 0.06, 7000, 'highpass'); },
  rail() { if (!can('r', 80)) return; tone(3000, 200, 0.25, 'sawtooth', 0.08); noise(0.15, 0.3, 2500, 'bandpass', 1); tone(90, 40, 0.25, 'sine', 0.35); },
  launch() { if (!can('l', 80)) return; noise(0.12, 0.12, 2500, 'bandpass', 1); tone(300, 900, 0.12, 'triangle', 0.04); },
  gem() { if (!can('gm', 45)) return; const p = 1200 + Math.min(xp / need, 1) * 1200; tone(p, p * 1.02, 0.04, 'sine', 0.035); },
  core() { noise(0.4, 0.55, 450); tone(140, 30, 0.45, 'sawtooth', 0.25); },
  lvup() { tone(500, 1000, 0.1, 'square', 0.06); tone(750, 1500, 0.1, 'square', 0.06, 0.08); tone(1000, 2000, 0.18, 'square', 0.06, 0.16); },
  pick() { tone(600, 1200, 0.09, 'triangle', 0.14); tone(900, 1800, 0.12, 'triangle', 0.12, 0.06); },
  evo() { tone(300, 1200, 0.5, 'sawtooth', 0.1); tone(450, 1800, 0.5, 'sawtooth', 0.08, 0.1); noise(0.6, 0.3, 2000); },
  od() { tone(160, 1800, 0.55, 'sawtooth', 0.14); noise(0.7, 0.45, 1400); tone(80, 30, 0.8, 'sine', 0.6); },
  boss() { tone(90, 60, 1.0, 'sawtooth', 0.2); tone(92, 61, 1.0, 'sawtooth', 0.2, 0.05); },
  click() { tone(900, 700, 0.04, 'square', 0.04); },
  buy() { tone(1500, 1500, 0.05, 'square', 0.04); tone(2000, 2000, 0.08, 'square', 0.04, 0.05); }
};
function vib(ms) { if (muted || !navigator.vibrate || !can('v', 70)) return; try { navigator.vibrate(ms); } catch (e) {} }

// ================= data =================
const ED = {
  tri:  { r: 10, hp: 14,   sp: 72,  dmg: 4,  xp: 1,   sides: 3,  col: '#ff3d7f', mass: 1 },
  dot:  { r: 6,  hp: 6,    sp: 100, dmg: 2,  xp: 1,   sides: 0,  col: '#ffd23d', mass: 0.6 },
  sq:   { r: 14, hp: 45,   sp: 44,  dmg: 7,  xp: 3,   sides: 4,  col: '#ff7a3d', mass: 2.4 },
  dash: { r: 11, hp: 30,   sp: 50,  dmg: 8,  xp: 3,   sides: -1, col: '#ff9db8', mass: 1.3 },
  pent: { r: 17, hp: 80,   sp: 40,  dmg: 9,  xp: 5,   sides: 5,  col: '#e85dff', mass: 3.2 },
  big:  { r: 24, hp: 420,  sp: 34,  dmg: 15, xp: 20,  sides: 8,  col: '#ff5a5a', mass: 8 },
  boss: { r: 40, hp: 2000, sp: 22,  dmg: 25, xp: 120, sides: 6,  col: '#ff2a4a', mass: 40 }
};
const WD = {
  gun: { name: '主砲', col: '#3cf2ff', sh: 3, evo: 'rate', evoName: '光束砲', evoDesc: '子彈化為一道持續貫穿的光束',
    d: ['自動射擊，按住拖曳可手動瞄準', '傷害 +25%', '改為雙發', '子彈穿透 +1', '三發、傷害提升'],
    s: { dmg: [12, 15, 15, 18, 22], rate: [5, 5.5, 5.7, 6.1, 6.7], shots: [1, 1, 2, 2, 3], pierce: [0, 0, 0, 1, 1] } },
  blades: { name: '環刃', col: '#e8feff', sh: 0, evo: 'shield', evoName: '光環', evoDesc: '刃連成一整圈，碰到就受傷並彈開',
    d: ['2 把旋轉刃環繞核心外圍', '+1 把', '傷害 +40%', '+1 把', '轉速、傷害提升'],
    s: { n: [2, 3, 3, 4, 4], dmg: [12, 12, 17, 17, 22], spin: [3, 3, 3.2, 3.2, 3.8] } },
  frost: { name: '冰霜脈衝', col: '#bdf4ff', sh: 6, evo: 'cd', evoName: '永凍場', evoDesc: '外圍常駐冰場，持續緩速與傷害',
    d: ['定時放出冰環，緩速並傷害', '範圍 +15%', '冷卻 -20%', '傷害 +60%', '緩速更強'],
    s: { cd: [2.6, 2.6, 2.1, 2.1, 2.1], R: [150, 172, 172, 172, 172], dmg: [8, 8, 8, 13, 13], slow: [0.35, 0.35, 0.35, 0.35, 0.55] } },
  drones: { name: '無人機', col: '#4dff9a', sh: 4, evo: 'amount', evoName: '砲台陣', evoDesc: '再加 2 架，射速提升、子彈穿透',
    d: ['無人機在外圍巡邏射擊', '+1 架', '傷害、射速提升', '+1 架', '傷害、射速大幅提升'],
    s: { n: [1, 2, 2, 3, 3], dmg: [7, 7, 10, 10, 14], rate: [2.2, 2.2, 2.6, 2.6, 3.2] } },

    amt: (L('amount') >= 1 ? 1 : 0) + (L('amount') >= 4 ? 1 : 0), cd: 1 - 0.07 * L('cd'), crit: 0.05 + 0.06 * L('crit'),
    spd: 1 + 0.12 * L('speed'), pierce: (L('speed') >= 3 ? 1 : 0) + (L('speed') >= 5 ? 1 : 0),
    regen: 0.4 * L('shield') + 0.3 * meta.regen

  const nm = 100 + 15 * meta.hp + 20 * L('shield');
  if (nm > maxHp) hp += nm - maxHp;

}

function spawn(t, x, y) {

function pickType() {

function addTrauma(a) { trauma = Math.min(1, trauma + a); }

function sparks(x, y, n, col, a0, spread, smin, smax, life = 0.25, w = 2) {
  if (parts.length > 450) return;

}
function shatter(x, y, r, col, n, dx, dy, pow) {

  else if (shards.length > 80) n = Math.ceil(n / 2);

function popText(x, y, txt, size, col) {

// ================= combat =================
const comboMult = () => Math.min(4, 1 + Math.floor(combo / 15) * 0.25);
const odMul = () => odOn ? 2 : 1;

function hitEnemy(e, dmg, dx, dy, kb, o = {}) {
  if (e.dead) return;
  dmg *= M.dmg;
  const crit = o.crit !== false && Math.random() < M.crit + (o.critBonus || 0);
  if (crit) dmg *= 2.5;
  e.hp -= dmg;
  if (e.fcd <= 0) { e.flash = 0.07; e.fcd = 0.14; }
  e.kx += dx * kb / e.mass; e.ky += dy * kb / e.mass;
  if (o.sparks !== 0) sparks(e.x - dx * e.r * 0.6, e.y - dy * e.r * 0.6, crit ? 7 : (o.sparks || 2), crit ? '#ffffff' : (o.col || e.col), Math.atan2(-dy, -dx), 0.9, 180, crit ? 600 : 450, 0.2, crit ? 2.6 : 2);
  if (crit) { popText(e.x, e.y - e.r - 4, Math.round(dmg) + '!', 18, '#ffe14d'); addTrauma(0.06); }
  else if (dmg >= 60) popText(e.x, e.y - e.r - 4, Math.round(dmg), 14, '#ffffff');
  if (o.snd !== false) sfx.hit(crit);
  if (e.hp <= 0) killEnemy(e, dx, dy);
}

function killEnemy(e, dx, dy) {
  e.dead = true; kills++;
  const boss = e.type === 'boss', big = e.r >= 17;
  const sz = boss ? 1 : big ? 0.5 : 0.12;
  shatter(e.x, e.y, e.r, e.col, boss ? 40 : big ? 14 : (e.sides > 0 ? e.sides * 2 : 4), dx, dy, boss ? 1.8 : 1);
  sparks(e.x, e.y, boss ? 60 : big ? 14 : 6, e.col, 0, Math.PI, 150, boss ? 1100 : 600, boss ? 0.6 : 0.25, 2.3);
  ring(e.x, e.y, e.r * 0.5, e.r * (boss ? 6 : 3), boss ? 0.6 : 0.24, e.col, boss ? 10 : 3.5);
  ring(e.x, e.y, 0, e.r * 1.5, 0.08, '#ffffff', 0, true);
  if (boss) {
    freezeFor(0.22); slowT = 0.9; addTrauma(1); screenFlash('#ffffff', 0.9); vib(120);
    ring(e.x, e.y, 0, 700, 0.9, e.col, 16); bossRef = null;
    hp = Math.min(maxHp, hp + maxHp * 0.3);
    banner = { t: 0, text: 'BOSS DOWN', col: '#ffe14d' };
  } else {
    if (big) freezeFor(0.05);
    addTrauma(big ? 0.25 : 0.04); vib(big ? 20 : 6);
  }
  combo++; comboT = 1.6; maxCombo = Math.max(maxCombo, combo);
  if (!odOn) od = Math.min(1, od + (e.xp * 0.004 + 0.004) * comboMult());
  dropGem(e.x, e.y, e.xp);
  sfx.kill(sz);
  if (e.type === 'pent') for (let i = 0; i < 3; i++) {
    const c = spawn('tri', e.x, e.y), a = Math.atan2(e.y - CY, e.x - CX) + (i - 1) * 1.2;
    c.kx = Math.cos(a) * 260; c.ky = Math.sin(a) * 260; c.hp = c.maxHp = c.maxHp * 0.6;
  }
}

function dropGem(x, y, v) {
  if (gems.length > 90) { gems[(Math.random() * gems.length) | 0].v += v; return; }
  const a = rand(0, TAU), s = rand(60, 160);
  gems.push({ x, y, v, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0 });
}

function hurtCore(e) {
  if (iframe > 0) return;
  hp -= e.dmg; iframe = 0.22; coreFlash = 0.25;
  ring(CX, CY, CORE_R, 110, 0.35, '#ff2a4a', 6);
  sparks(e.x, e.y, 14, '#ff2a4a', Math.atan2(e.y - CY, e.x - CX), 1, 150, 500, 0.3, 2.5);
  addTrauma(0.45); screenFlash('#ff2a4a', 0.35); vib(50); sfx.core(); freezeFor(0.06);
  combo = 0; comboT = 0;
  if (hp <= 0) {
    hp = 0; state = 'dying'; dyingT = 1.8; slowT = 1.8; pointer.down = false;
    shatter(CX, CY, 34, '#3cf2ff', 40, 0, 0, 2);
    sparks(CX, CY, 80, '#3cf2ff', 0, Math.PI, 200, 1200, 0.8, 3);
    ring(CX, CY, 10, 700, 1.2, '#3cf2ff', 14);
    addTrauma(1); screenFlash('#ffffff', 1); vib(300);
  }

function explode(x, y, R, dmg, col, kb = 120) {
  ring(x, y, 4, R, 0.22, col, 5);
  ring(x, y, 0, R * 0.65, 0.07, '#ffffff', 0, true);
  sparks(x, y, 8, col, 0, Math.PI, 120, 480, 0.25, 2.2);
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y, d = Math.hypot(dx, dy);
    if (d < R + e.r) hitEnemy(e, dmg, dx / (d || 1), dy / (d || 1), kb, { sparks: 2, snd: false });
  }
  addTrauma(0.06); sfx.boom();
}

function nearest(x, y, maxD = 1e9, filter) {
  let b = null, bd = maxD * maxD;
  for (const e of enemies) {
    if (e.dead || (filter && !filter(e))) continue;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d < bd) { bd = d; b = e; }
  }
  return b;
}
const onScreen = e => e.x > -10 && e.x < LW + 10 && e.y > -10 && e.y < LH + 10;

// ================= weapons =================
function updateWeapons(dt) {
  const om = odMul();
  for (const w of weapons) {
    const s = WD[w.id].s, L = w.lv - 1;
    if (w.id === 'gun') {
      let tx = null, ty = null;
      if (pointer.down) { tx = pointer.x; ty = pointer.y; }
      else {
        const e = nearest(CX, CY, 1e9, onScreen);
        if (e) { const t = Math.hypot(e.x - CX, e.y - CY) / (1300 * M.spd); tx = e.x + (e.vx + e.kx) * t; ty = e.y + (e.vy + e.ky) * t; }
      }
      if (tx === null) { gunBeam = 0; continue; }
      aimAng += wrapAng(Math.atan2(ty - CY, tx - CX) - aimAng) * Math.min(1, 30 * dt);
      if (w.evo) {
        gunBeam = 0.1;
        w.tick -= dt * M.rate * om;
        if (w.tick <= 0) {
          w.tick += 0.07;
          const dmg = s.dmg[4] * s.rate[4] * 2.6 * 0.07;
          const c = Math.cos(aimAng), sn = Math.sin(aimAng), x0 = CX + c * 40, y0 = CY + sn * 40, x1 = CX + c * 900, y1 = CY + sn * 900;
          for (const e of enemies) {
            if (e.dead) continue;
            if (segDist2(x0, y0, x1, y1, e.x, e.y) < (e.r + 7) ** 2) hitEnemy(e, dmg, c, sn, 30, { sparks: 1, snd: false, col: '#3cf2ff' });
          }
          sfx.beam(); recoil = 0.4;
        }
      } else {
        w.cd -= dt * M.rate * om;
        if (w.cd <= 0) {
          w.cd += 1 / s.rate[L]; if (w.cd < 0) w.cd = 0;
          const n = s.shots[L] + M.amt, spr = 0.08;
          for (let i = 0; i < n; i++) {
            const a = aimAng + (i - (n - 1) / 2) * spr + rand(-0.012, 0.012);
            const c = Math.cos(a), sn = Math.sin(a), bx = CX + c * 42, by = CY + sn * 42, v = 1300 * M.spd;
            bullets.push({ x: bx, y: by, px: bx, py: by, vx: c * v, vy: sn * v, v, dmg: s.dmg[L], pierce: s.pierce[L] + M.pierce, hit: null, life: 0.9, col: '#3cf2ff', w: 2.2 });
          }
          recoil = 1; muzzle = 0.045; sfx.gun();
        }
      }
    } else if (w.id === 'blades') {
      w.ang += dt * s.spin[L] * M.rate;
      const R = 88 * M.area;
      if (w.evo) {
        for (const e of enemies) {
          if (e.dead || (e.cds.ring || 0) > T) continue;
          const dx = e.x - CX, dy = e.y - CY, d = Math.hypot(dx, dy) || 1;
          if (Math.abs(d - R) < e.r + 9) { e.cds.ring = T + 0.25; hitEnemy(e, s.dmg[4] * 1.6, dx / d, dy / d, 260, { sparks: 3, col: '#ffffff' }); }
        }
      } else {
        const n = s.n[L] + M.amt;
        for (let i = 0; i < n; i++) {
          const a = w.ang + i * TAU / n, bx = CX + Math.cos(a) * R, by = CY + Math.sin(a) * R;
          for (const e of enemies) {
            if (e.dead || (e.cds.blade || 0) > T) continue;
            if ((e.x - bx) ** 2 + (e.y - by) ** 2 < (e.r + 11) ** 2) {
              e.cds.blade = T + 0.2;
              const dx = e.x - CX, dy = e.y - CY, d = Math.hypot(dx, dy) || 1;
              hitEnemy(e, s.dmg[L], dx / d, dy / d, 160, { sparks: 3, col: '#ffffff' });
            }
          }
        }
      }
    } else if (w.id === 'frost') {
      const R = s.R[L] * M.area;
      if (w.evo) {
        const R2 = R * 1.15;
        for (const e of enemies) {
          if (e.dead) continue;
          const d = Math.hypot(e.x - CX, e.y - CY);
          if (d < R2 + e.r) {
            e.slowT = 0.25; e.slowF = Math.max(e.slowF, 0.55);
            if ((e.cds.frost || 0) <= T) { e.cds.frost = T + 0.5; hitEnemy(e, s.dmg[4] * 0.8, 0, 0, 0, { sparks: 1, snd: false, col: '#bdf4ff' }); }
          }
        }
      } else {
        w.cd -= dt * om;
        if (w.cd <= 0) {
          w.cd = s.cd[L] * M.cd;
          ring(CX, CY, SAFE_R, R, 0.4, '#bdf4ff', 5);
          for (const e of enemies) {
            if (e.dead) continue;
            const dx = e.x - CX, dy = e.y - CY, d = Math.hypot(dx, dy) || 1;
            if (d < R + e.r) { e.slowT = 1.8; e.slowF = Math.max(e.slowF, s.slow[L]); hitEnemy(e, s.dmg[L], dx / d, dy / d, 60, { sparks: 1, snd: false, col: '#bdf4ff' }); }
          }
          sfx.frost();
        }
      }
    } else if (w.id === 'drones') {
      const n = s.n[L] + M.amt + (w.evo ? 2 : 0), rate = s.rate[L] * (w.evo ? 1.5 : 1) * M.rate * om;
      w.ang += dt * 0.5; w.n = n;
      for (let i = 0; i < n; i++) {
        const a = w.ang + i * TAU / n, dx = CX + Math.cos(a) * 142, dy = CY + Math.sin(a) * 142;
        w.dcd[i] = (w.dcd[i] || 0) - dt * rate;
        if (w.dcd[i] <= 0) {
          const e = nearest(dx, dy, 210);
          if (!e) { w.dcd[i] = 0; continue; }
          w.dcd[i] += 1;
          const aa = Math.atan2(e.y - dy, e.x - dx), v = 900 * M.spd;

// ================= update =================
function update(dt, rdt) {
  freezeCD -= rdt;
  const inten = Math.min(1, combo / 50) + (odOn ? 1 : 0);
  for (const s of streaks) {
    s.r -= s.sp * (1 + inten * 2) * (dt || rdt * 0.05);
    if (s.r < 150) resetStreak(s, false);
  }
  coreRot += dt * (odOn ? 4 : 1.2);
  updateFx(dt);
  updateGems(dt);

  if (state === 'dying') { dyingT -= rdt; updateEnemies(dt); if (dyingT <= 0) gameOver(); return; }
  if (state !== 'play') return;

  T += dt; iframe -= dt;
  hp = Math.min(maxHp, hp + M.regen * dt);
  if (enemies.length < 230) {
    spawnAcc += dt * Math.min(12, 1.4 + T / 40 + (T / 120) ** 2);
    while (spawnAcc >= 1) { spawnAcc -= 1; spawn(pickType()); }
  }
  if (T >= nextSurge) {
    nextSurge += 75;
    const n = 12 + Math.floor(T / 15), t = T > 200 ? 'tri' : 'dot';
    for (let i = 0; i < n; i++) { const a = i / n * TAU; spawn(t, LW / 2 + Math.cos(a) * (LW / 2 + 30), LH / 2 + Math.sin(a) * (LH / 2 + 30)); }
    banner = { t: 0, text: '包 圍 !', col: '#ff3d7f' };
  }
  if (T >= nextBoss) {
    nextBoss += 120;
    spawn('boss', LW / 2, -50); bossN++;
    banner = { t: 0, text: 'BOSS', col: '#ff2a4a' }; sfx.boss(); addTrauma(0.5);
  }
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  if (odOn) { odT -= dt; od = Math.max(0, odT / OD_DUR); if (odT <= 0) { odOn = false; od = 0; } }

  updateWeapons(dt);
  updateEnemies(dt);
  updateProjectiles(dt);
}

function updateEnemies(dt) {
  const oS = odOn ? 0.6 : 1;
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt; e.flash -= dt; e.fcd -= dt; e.rot += e.rs * dt; e.hitCD -= dt; e.dcd -= dt;
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowF = 0; }
    const dx = CX - e.x, dy = CY - e.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    let sp = e.sp * (e.slowT > 0 ? 1 - e.slowF : 1) * oS, vx = ux * sp, vy = uy * sp;
    if (e.type === 'tri') {
      const w = Math.sin(e.t * 4 + e.ph) * 0.6;
      vx = (ux - uy * w) * sp; vy = (uy + ux * w) * sp;
    } else if (e.type === 'dash') {
      if (e.mode === 0) { if (d < 240 && e.dcd <= 0) { e.mode = 1; e.st = 0.5; } }
      else if (e.mode === 1) { vx = vy = 0; e.st -= dt; if (e.st <= 0) { e.mode = 2; e.st = 1.2; e.dx = ux; e.dy = uy; } }
      else { vx = e.dx * 400 * oS; vy = e.dy * 400 * oS; e.st -= dt; if (e.st <= 0) { e.mode = 0; e.dcd = 2; } }
    } else if (e.type === 'boss') {
      e.spawnCD -= dt;
      if (e.spawnCD <= 0 && state === 'play') {
        e.spawnCD = e.hp < e.maxHp / 2 ? 1.8 : 2.8;
        for (let i = 0; i < 3; i++) { const c = spawn('tri', e.x, e.y); const a = rand(0, TAU); c.kx = Math.cos(a) * 250; c.ky = Math.sin(a) * 250; }
        ring(e.x, e.y, e.r, e.r * 1.7, 0.25, e.col, 3);
      }
    }
    e.vx = vx; e.vy = vy;
    e.x += (vx + e.kx) * dt; e.y += (vy + e.ky) * dt;
    const kd = Math.exp(-8 * dt); e.kx *= kd; e.ky *= kd;
    const nd = Math.hypot(e.x - CX, e.y - CY) || 1, minD = CORE_R + e.r;
    if (nd < minD) {
      e.x = CX + (e.x - CX) / nd * minD; e.y = CY + (e.y - CY) / nd * minD;
      if (e.hitCD <= 0 && state === 'play') {
        e.hitCD = e.type === 'boss' ? 1.5 : 0.8; hurtCore(e);
        if (e.type === 'dot') { e.dead = true; shatter(e.x, e.y, e.r, e.col, 4, -ux, -uy, 1); continue; }
        const k = 520 / Math.sqrt(e.mass);
        e.kx = -ux * k; e.ky = -uy * k;
        if (e.type === 'dash') { e.mode = 0; e.dcd = 2; }
      }
    }
  }
  enemies = enemies.filter(e => !e.dead);
}

function updateProjectiles(dt) {
  for (const b of bullets) {
    b.px = b.x; b.py = b.y; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of enemies) {
      if (e.dead || (b.hit && b.hit.has(e))) continue;
      if (segDist2(b.px, b.py, b.x, b.y, e.x, e.y) < (e.r + 3) ** 2) {
        hitEnemy(e, b.dmg, b.vx / b.v, b.vy / b.v, 40, { sparks: 2 });
        if (b.pierce-- <= 0) { b.dead = true; break; }
        (b.hit || (b.hit = new Set())).add(e);
      }
    }
    if (b.life <= 0 || b.x < -30 || b.x > LW + 30 || b.y < -30 || b.y > LH + 30) b.dead = true;
  }
  bullets = bullets.filter(b => !b.dead);

  for (const m of missiles) {
    m.t += dt; m.life -= dt;
    if (m.t > 0.28) {
      if (!m.tgt || m.tgt.dead) m.tgt = nearest(m.x, m.y, 1e9, onScreen);
      if (m.tgt) {
        const a = Math.atan2(m.tgt.y - m.y, m.tgt.x - m.x), sp = Math.min(620, 260 + (m.t - 0.28) * 900) * M.spd;
        const ca = Math.atan2(m.vy, m.vx), na = ca + clamp(wrapAng(a - ca), -9 * dt, 9 * dt);
        m.vx = Math.cos(na) * sp; m.vy = Math.sin(na) * sp;
      }
    } else { m.vx *= Math.exp(-2 * dt); m.vy *= Math.exp(-2 * dt); }
    m.x += m.vx * dt; m.y += m.vy * dt;
    let hitE = null;
    for (const e of enemies) if (!e.dead && (e.x - m.x) ** 2 + (e.y - m.y) ** 2 < (e.r + 6) ** 2) { hitE = e; break; }
    if (hitE || m.life <= 0) {
      m.dead = true;
      explode(m.x, m.y, m.R, m.dmg, '#5b8cff');
      if (m.cluster) for (let i = 0; i < 5; i++) { const a = rand(0, TAU), s = rand(120, 220); bomblets.push({ x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: rand(0.22, 0.35), dmg: m.dmg * 0.5, R: m.R * 0.7 }); }
    }
  }
  missiles = missiles.filter(m => !m.dead);
  for (const b of bomblets) { b.t -= dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 0.95; b.vy *= 0.95; if (b.t <= 0) { b.dead = true; explode(b.x, b.y, b.R, b.dmg, '#8fb0ff', 60); } }
  bomblets = bomblets.filter(b => !b.dead);

  for (const m of mines) {
    if (m.ft < 1) { m.ft = Math.min(1, m.ft + dt / 0.25); continue; }
    if (m.boom >= 0) { m.boom -= dt; if (m.boom <= 0) detonate(m); continue; }
    m.arm -= dt;
    if (m.arm > 0) continue;
    for (const e of enemies) if (!e.dead && (e.x - m.x) ** 2 + (e.y - m.y) ** 2 < (e.r + 20) ** 2) { detonate(m); break; }
  }
  mines = mines.filter(m => !m.dead);
}
function detonate(m) {
  if (m.dead) return;
  m.dead = true;
  explode(m.x, m.y, m.R, m.dmg, '#7d9cff', 180);
  addTrauma(0.08);
  if (m.chain) for (const o of mines) if (!o.dead && o.boom < 0 && o.ft >= 1 && (o.x - m.x) ** 2 + (o.y - m.y) ** 2 < 130 * 130) o.boom = 0.09;
}

function updateGems(dt) {
  const tx = clamp(LW * (xp / need), 10, LW - 10);
  for (const g of gems) {
    g.t += dt;
    if (g.t < 0.3) { const k = Math.exp(-6 * dt); g.vx *= k; g.vy *= k; }
    else {
      const dx = tx - g.x, dy = -6 - g.y, d = Math.hypot(dx, dy) || 1, sp = Math.min(1700, 250 + (g.t - 0.3) * 2000);
      let vx = dx / d * sp, vy = dy / d * sp;
      const cx = g.x - CX, cy = g.y - CY, cd = Math.hypot(cx, cy) || 1;
      if (cd < 120) { const p = (120 - cd) / 120 * 900; vx += cx / cd * p; vy += cy / cd * p * 0.3; }
      g.vx = vx; g.vy = vy;
    }
    g.x += g.vx * dt; g.y += g.vy * dt;
    if (g.y < 4) { g.dead = true; gainXp(g.v); }
  }
  gems = gems.filter(g => !g.dead);
}
let xpFlashT = 0;
function gainXp(v) {
  if (state !== 'play' && state !== 'levelup') return;
  xp += v * (1 + 0.08 * meta.xp);
  sfx.gem(); xpFlashT = 0.08;
  while (xp >= need) { xp -= need; lvl++; need = needFor(lvl); pendingLv++; }
  if (pendingLv > 0 && state === 'play') openLevelUp();
}

function activateOD() {
  if (od < 1 || odOn || state !== 'play' || paused) return;
  odOn = true; odT = OD_DUR; od = 1;
  sfx.od(); vib(80); addTrauma(0.8); freezeFor(0.12); screenFlash('#b36bff', 0.5);
  ring(CX, CY, SAFE_R, LH, 0.7, '#b36bff', 14);
  ring(CX, CY, SAFE_R, LH * 0.7, 0.5, '#ffffff', 5);

    const dx = e.x - CX, dy = e.y - CY, d = Math.hypot(dx, dy) || 1;
    hitEnemy(e, 25 * hpScale() ** 0.6, dx / d, dy / d, 700, { sparks: 4, snd: false, crit: false });

function updateFx(dt) {
  for (const p of parts) { const k = Math.exp(-5 * dt); p.vx *= k; p.vy *= k; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const s of shards) { const k = Math.exp(-3 * dt); s.vx *= k; s.vy *= k; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.rs * dt; s.life -= dt; }

  for (const r of rings) r.life -= dt;
  rings = rings.filter(r => r.life > 0);
  for (const b of bolts) b.life -= dt;
  bolts = bolts.filter(b => b.life > 0);
  for (const b of beams) b.life -= dt;
  beams = beams.filter(b => b.life > 0);
  for (const t of texts) { t.y += t.vy * dt; t.vy *= Math.exp(-4 * dt); t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  if (banner) { banner.t += dt; if (banner.t > 1.3) banner = null; }
}

// ================= level up =================
function genChoices() {
  const c = [];
  for (const w of weapons) if (!w.evo && w.lv >= 5 && passives[WD[w.id].evo]) c.push({ k: 'evo', id: w.id, w: 1000 });
  for (const w of weapons) if (w.lv < 5) c.push({ k: 'wup', id: w.id, w: 3 });
  if (weapons.length < 6) for (const id of WORDER) if (!weapons.some(w => w.id === id) && (!WD[id].lock || meta[id])) c.push({ k: 'wnew', id, w: weapons.length < 3 ? 4 : 2 });
  for (const k of pOrder) if (passives[k] < 5) c.push({ k: 'pup', id: k, w: 2 });
  if (pOrder.length < 6) for (const k in PD) if (!passives[k]) c.push({ k: 'pnew', id: k, w: 1.4 });
  const out = [];
  while (out.length < 3 && c.length) {
    const tot = c.reduce((s, o) => s + o.w, 0);
    let r = Math.random() * tot, i = 0;
    for (; i < c.length - 1; i++) { r -= c[i].w; if (r <= 0) break; }
    out.push(c.splice(i, 1)[0]);
  }
  if (!out.length) out.push({ k: 'heal' }, { k: 'coin' });
  return out;
}
function svgIcon(sh, col, ch) {
  if (ch) return `<svg viewBox="-12 -12 24 24"><rect x="-10" y="-10" width="20" height="20" rx="4" fill="${col}22" stroke="${col}" stroke-width="1.6"/><text x="0" y="4.5" text-anchor="middle" font-size="12" font-weight="900" fill="${col}" font-family="system-ui,sans-serif">${ch}</text></svg>`;
  let inner;
  if (sh === 0) inner = `<circle r="8" fill="${col}33" stroke="${col}" stroke-width="2"/>`;
  else {
    const pts = sh === -1 ? [[0, -10], [6, 0], [0, 10], [-6, 0]]
      : Array.from({ length: sh }, (_, i) => { const a = -Math.PI / 2 + i * TAU / sh; return [Math.cos(a) * 9, Math.sin(a) * 9]; });
    inner = `<polygon points="${pts.map(p => p.map(v => v.toFixed(2)).join(',')).join(' ')}" fill="${col}33" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  return `<svg viewBox="-12 -12 24 24">${inner}</svg>`;
}
let lvReady = 0;

    else if (o.k === 'wnew' || o.k === 'wup') {

    } else if (o.k === 'pnew' || o.k === 'pup') {

      col = d.col; name = d.name; desc = d.d; tag = lv ? `Lv.${lv} → ${lv + 1}` : 'NEW'; icon = svgIcon(0, d.col, d.ch);
      sub = '可進化：' + WORDER.filter(k => WD[k].evo === o.id).map(k => WD[k].name).join('、');

    const b = document.createElement('button');
    b.className = 'card' + (o.k === 'evo' ? ' evo' : ''); b.style.setProperty('--c', col); b.style.animationDelay = (i * 0.06) + 's';
    b.innerHTML = `${icon}<div><b>${name}</b><span>${desc}</span>${sub ? `<small>${sub}</small>` : ''}</div><em>${tag}</em>`;
    b.addEventListener('click', () => pickChoice(o));

  $('bReroll').textContent = `重抽（剩 ${rerolls}）`;

function pickChoice(o) {

  if (h !== lastHud || force) {
    lastHud = h;
    $('lvT').textContent = 'Lv.' + lvl; $('timeT').textContent = fmtT(T); $('killT').textContent = kills + ' 擊破';
  }
  const b = $('bOD');
  b.style.setProperty('--p', Math.round(od * 100));
  b.classList.toggle('full', od >= 1 && !odOn); b.classList.toggle('on', odOn);
}

function runCoinsTotal() { return Math.floor(T / 5) + Math.floor(kills / 10) + lvl * 2 + runCoins; }
function gameOver() {
  state = 'over';
  const earned = runCoinsTotal();
  meta.coins += earned; saveMeta();
  const isNew = T > best.time;
  if (isNew) best = { time: T, kills, lv: lvl };
  store.set('ch3_best', best);
  $('goTime').textContent = fmtT(T);
  $('goNew').innerHTML = isNew ? '<div class="new">最長存活紀錄！</div>' : '';
  $('goStats').innerHTML = `<span>等級</span><b>Lv.${lvl}</b><span>擊破數</span><b>${kills}</b><span>最高連擊</span><b>${maxCombo}</b>` +
    `<span>最佳紀錄</span><b>${fmtT(best.time)}</b><span>獲得金幣</span><b class="coin">+${earned}</b>`;
  $('hud').classList.remove('on'); $('bOD').classList.remove('show');
  syncCoins();
  $('ovOver').classList.add('on');
}
function syncCoins() { document.querySelectorAll('.coinT').forEach(e => e.textContent = meta.coins + ' 金幣'); }
function updateBest() { $('bestT').textContent = best.time ? `最佳存活 ${fmtT(best.time)} · Lv.${best.lv}` : ''; }

function startGame() {
  initAudio();
  ['ovTitle', 'ovOver', 'ovShop', 'ovPause'].forEach(id => $(id).classList.remove('on'));
  newGame();
}
let shopFrom = 'ovTitle';
function openShop(from) { shopFrom = from; $(from).classList.remove('on'); renderShop(); $('ovShop').classList.add('on'); sfx.click(); }
function renderShop() {
  syncCoins();
  $('shopList').innerHTML = SHOP.map(it => {
    const lv = meta[it.id] || 0, maxed = lv >= it.max, cost = it.cost * (lv + 1);
    const pips = it.unlock ? '' : `<div class="pips">${Array.from({ length: it.max }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</div>`;
    return `<div class="si"><div><b>${it.name}</b><span>${it.d}</span>${pips}</div>` +
      `<button class="buy" data-id="${it.id}" ${maxed || meta.coins < cost ? 'disabled' : ''}>${maxed ? (it.unlock ? '已解鎖' : 'MAX') : cost}</button></div>`;
  }).join('');
  $('shopList').querySelectorAll('.buy').forEach(b => b.addEventListener('click', () => {
    const it = SHOP.find(s => s.id === b.dataset.id), lv = meta[it.id] || 0, cost = it.cost * (lv + 1);
    if (lv >= it.max || meta.coins < cost) return;
    meta.coins -= cost; meta[it.id] = lv + 1; saveMeta(); sfx.buy(); renderShop();
  }));
}
$('bStart').addEventListener('click', startGame);
$('bAgain').addEventListener('click', startGame);
$('bShop1').addEventListener('click', () => openShop('ovTitle'));
$('bShop2').addEventListener('click', () => openShop('ovOver'));
$('bShopBack').addEventListener('click', () => { $('ovShop').classList.remove('on'); $(shopFrom).classList.add('on'); syncCoins(); updateBest(); sfx.click(); });
$('bPause').addEventListener('click', () => { if (state !== 'play' && state !== 'levelup') return; paused = true; pointer.down = false; $('ovPause').classList.add('on'); });
$('bResume').addEventListener('click', () => { paused = false; $('ovPause').classList.remove('on'); });
$('bQuit').addEventListener('click', () => { paused = false; $('ovPause').classList.remove('on'); $('ovLv').classList.remove('on'); gameOver(); });
$('bOD').addEventListener('click', () => { initAudio(); activateOD(); });
function syncMute() { $('bMute').textContent = muted ? '✕' : '♪'; $('bMute').style.opacity = muted ? .5 : 1; }
$('bMute').addEventListener('click', () => { initAudio(); muted = !muted; store.set('ch_muted', muted); syncMute(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play' && !paused) { paused = true; pointer.down = false; $('ovPause').classList.add('on'); }
});

// ================= input =================
function toLocal(ev) { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * LW, y: (ev.clientY - r.top) / r.height * LH }; }
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault(); initAudio();
  if (state !== 'play' || paused) return;
  const p = toLocal(ev);
  pointer.down = true; pointer.id = ev.pointerId; pointer.x = p.x; pointer.y = p.y;
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
});
cv.addEventListener('pointermove', ev => { if (!pointer.down || ev.pointerId !== pointer.id) return; const p = toLocal(ev); pointer.x = p.x; pointer.y = p.y; });
const up = ev => { if (ev.pointerId === pointer.id) pointer.down = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => { if (e.code === 'Space') activateOD(); });

// ================= loop =================
const prof = { u: 0, r: 0, n: 0 };
let last = performance.now(), hudT = 0, perfAcc = 0, perfN = 0, perfLast = performance.now();
function loop(now) {
  const rdt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) {
    let dt = rdt;
    if (freeze > 0) { freeze -= rdt; dt = 0; }
    else if (slowT > 0) { slowT -= rdt; dt *= 0.3; }
    if (state === 'levelup') dt = 0;
    const u0 = performance.now(); update(dt, rdt); prof.u += performance.now() - u0;
  }
  const r0 = performance.now(); render(paused ? 0 : rdt); prof.r += performance.now() - r0; prof.n++;
  if (state === 'play' && !paused) {
    perfAcc += now - perfLast; perfN++;
    if (perfAcc > 1500) {
      if (perfAcc / perfN > 22 && dprCap > 1) { dprCap = Math.max(1, Math.min(dprCap, window.devicePixelRatio || 1) - 0.35); resize(); }
      perfAcc = 0; perfN = 0;
    }
  } else { perfAcc = 0; perfN = 0; }
  perfLast = now;
  hudT -= rdt;
  if (hudT <= 0 && (state === 'play' || state === 'levelup' || state === 'dying')) { hudT = 0.05; syncHud(); }
  requestAnimationFrame(loop);
}
resize(); syncMute(); updateBest(); syncCoins(); calcMods();
requestAnimationFrame(loop);

window.__CH = {
  get state() { return state; }, get T() { return T; }, set T(v) { T = v; nextBoss = Math.max(nextBoss, v + 1); nextSurge = Math.max(nextSurge, v + 1); },
  get lvl() { return lvl; }, get enemies() { return enemies.length; }, get hp() { return hp; },
  give(id, lv = 5, evo = false) { let w = weapons.find(x => x.id === id); if (!w) { addWeapon(id); w = weapons[weapons.length - 1]; } w.lv = lv; w.evo = evo; calcMods(); updateInv(); },
  passive(id, lv = 5) { if (!passives[id]) pOrder.push(id); passives[id] = lv; calcMods(); updateInv(); },
  xp(v) { gainXp(v); }, god() { maxHp = hp = 1e6; }, die() { iframe = 0; hp = 1; hurtCore({ dmg: 99, x: CX, y: CY - 30 }); },
  setOD() { od = 1; }, meta, get dpr() { return dprCap; }, prof() { const o = { u: (prof.u / prof.n).toFixed(2), r: (prof.r / prof.n).toFixed(2), parts: parts.length, rings: rings.length, shards: shards.length, bullets: bullets.length, missiles: missiles.length, gems: gems.length }; prof.u = prof.r = prof.n = 0; return o; }, many(n) { for (let i = 0; i < n; i++) spawn(pickType()); }, perf: () => { if (state === 'levelup') { state = 'play'; $('ovLv').classList.remove('on'); pendingLv = 0; } const t0 = performance.now(); update(1 / 60, 1 / 60); const t1 = performance.now(); render(1 / 60); return [t1 - t0, performance.now() - t1]; }
};
})();
</script>
