<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080f">
<title>核心守衛 CORE HOLD</title>
<style>
  html,body{margin:0;height:100%;background:#07080f;color-scheme:dark;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff}
  #wrap{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;align-items:center}
  #game{position:relative;overflow:hidden;background:#07080f}
  canvas{display:block;touch-action:none}
  button{font-family:inherit;-webkit-tap-highlight-color:transparent}
  .btn-top{position:absolute;top:10px;width:36px;height:36px;border-radius:8px;
    border:1.5px solid rgba(255,255,255,.25);background:rgba(10,12,24,.6);color:#fff;font:700 15px/1 system-ui;
    display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:5}
  #bMute{right:10px} #bPause{right:52px}

  #bar{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:8px;padding:0 10px;
    box-sizing:border-box;background:linear-gradient(rgba(7,8,15,0),rgba(7,8,15,.94) 35%);z-index:6}
  .res{display:flex;flex-direction:column;line-height:1.05;font-weight:900;min-width:0}
  .res small{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.5);font-weight:800}
  .res b{font-size:22px;font-variant-numeric:tabular-nums;display:inline-block}
  #gold{color:#ffd23d} #lives{color:#ff3d7f}
  .bump{animation:bump .25s cubic-bezier(.2,1.8,.4,1)}
  .sp{flex:1}
  .bb{height:46px;min-width:46px;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:rgba(16,20,40,.9);
    color:#fff;font:900 16px system-ui;padding:0 10px;cursor:pointer}
  .bb:active{transform:scale(.92)}
  #bWave{background:#3cf2ff;color:#07080f;border:0;transform:skewX(-8deg);min-width:100px;box-shadow:0 0 18px rgba(60,242,255,.45)}
  #bWave:active{transform:skewX(-8deg) scale(.93)}
  #bWave:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.55);box-shadow:none}
  #bOD{--p:0;border:0;background:conic-gradient(#b36bff calc(var(--p)*1%),rgba(255,255,255,.1) 0);border-radius:50%;
    width:50px;height:50px;padding:0;position:relative;cursor:pointer}
  #bOD span{position:absolute;inset:4px;border-radius:50%;background:#0d1024;display:flex;align-items:center;justify-content:center;
    font:italic 900 15px system-ui;color:rgba(255,255,255,.6)}
  #bOD.full span{background:#b36bff;color:#fff;animation:pulse .5s ease-in-out infinite}
  #bOD.on span{background:#fff;color:#b36bff}

  #panel{position:absolute;left:8px;right:8px;bottom:70px;z-index:7;background:rgba(12,14,30,.97);border:1.5px solid rgba(60,242,255,.35);
    border-radius:14px;padding:12px;display:none;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #panel.on{display:block;animation:up .2s cubic-bezier(.2,1.3,.4,1)}
  #panel.top{bottom:auto;top:54px}
  .ph{font-size:12px;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.55);margin-bottom:8px;display:flex;justify-content:space-between}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .tb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;border:1.5px solid var(--c);
    background:rgba(255,255,255,.03);color:#fff;cursor:pointer;min-width:0}
  .tb:active{transform:scale(.92)}
  .tb svg{width:30px;height:30px}
  .tb b{font-size:13px;color:var(--c)}
  .tb .d{font-size:10px;color:rgba(255,255,255,.55);white-space:nowrap}
  .tb i{font-style:normal;font-size:13px;font-weight:900;color:#ffd23d}
  .tb.no{opacity:.32}
  .tinfo{display:flex;gap:12px;align-items:center}
  .tinfo svg{width:44px;height:44px;flex:none}
  .tinfo b{font-size:18px;color:var(--c)}
  .tinfo div{display:flex;flex-direction:column;gap:3px;min-width:0}
  .tinfo span{font-size:12px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
  .row{display:flex;gap:8px;margin-top:12px}
  .act{flex:1;height:46px;border-radius:10px;border:0;font:900 16px system-ui;cursor:pointer}
  .act:active{transform:scale(.95)}
  .act.up{background:#3cf2ff;color:#07080f}
  .act.up i{font-style:normal;background:#07080f;color:#ffd23d;border-radius:6px;padding:2px 6px;margin-left:6px;font-size:14px}
  .act.up.no{opacity:.35}
  .act.max{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
  .act.sell{flex:.6;background:rgba(255,61,127,.15);color:#ff3d7f;border:1.5px solid #ff3d7f}

  .ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(7,8,15,.82);z-index:10;text-align:center;padding:0 20px;box-sizing:border-box}
  .ov.on{display:flex}
  .ov h1{margin:0;font-size:44px;font-weight:900;letter-spacing:2px;line-height:1.05;
    background:linear-gradient(90deg,#3cf2ff,#ff3d7f);-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:zoom .45s cubic-bezier(.2,1.6,.4,1) both}
  .ov h2{margin:4px 0 0;font-size:14px;font-weight:800;letter-spacing:8px;color:#3cf2ff;opacity:.85}
  .ov p{margin:6px 0;color:rgba(255,255,255,.7);font-size:14px;line-height:1.6}
  .ov .big{font-size:40px;font-weight:900;color:#fff;margin:6px 0}
  .go{margin-top:22px;padding:14px 46px;font:900 20px system-ui;letter-spacing:4px;color:#07080f;background:#3cf2ff;
    border:0;border-radius:6px;cursor:pointer;transform:skewX(-10deg);box-shadow:0 0 24px rgba(60,242,255,.5);
    animation:pulse 1.2s ease-in-out infinite}
  .go:active{transform:skewX(-10deg) scale(.94)}
  .tips{margin-top:18px;font-size:13px;color:rgba(255,255,255,.62);line-height:1.9;text-align:left}
  .tips b{color:#3cf2ff}
  .ttl{font-size:26px;font-weight:900;letter-spacing:4px;color:#fff;animation:zoom .35s cubic-bezier(.2,1.6,.4,1) both}
  .stats{display:grid;grid-template-columns:auto auto;gap:6px 18px;margin-top:14px;font-size:15px;color:rgba(255,255,255,.75)}
  .stats b{color:#fff;text-align:right}
  .new{color:#ffb020;font-weight:900;letter-spacing:2px;animation:pulse .6s ease-in-out infinite}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes bump{from{transform:scale(1.45)}to{transform:none}}
  @keyframes zoom{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
</style>
</head>
<body>
<div id="wrap"><div id="game">
  <canvas id="c"></canvas>
  <button class="btn-top" id="bPause" aria-label="暫停">❚❚</button>
  <button class="btn-top" id="bMute" aria-label="靜音">♪</button>

  <div id="bar">
    <div class="res"><small>GOLD</small><b id="gold">0</b></div>
    <div class="res"><small>LIFE</small><b id="lives">0</b></div>
    <div class="sp"></div>
    <button class="bb" id="bOD" aria-label="超載"><span>OD</span></button>
    <button class="bb" id="bSpd">×1</button>
    <button class="bb" id="bWave">開戰 ▶</button>
  </div>
  <div id="panel"></div>

  <div class="ov on" id="ovTitle">
    <h1>CORE<br>HOLD</h1>
    <h2>核心守衛</h2>
    <div class="tips">
      ▸ 點地圖上的 <b>⬡ 空位</b>蓋砲台<br>
      ▸ 點砲台可<b>升級</b>或出售（選單開著時間變慢）<br>
      ▸ 手指<b>直接點敵人</b>可以親手打擊<br>
      ▸ 連殺累積能量，滿了按 <b>OD</b> 超載<br>
      ▸ 右下 <b>×1/×2/×3</b> 切換遊戲速度
    </div>
    <button class="go" id="bStart">開 始</button>
    <p id="bestT" style="margin-top:14px"></p>
  </div>

  <div class="ov" id="ovPause">
    <div class="ttl">暫停</div>
    <button class="go" id="bResume">繼 續</button>
  </div>

  <div class="ov" id="ovOver">
    <h1 style="font-size:38px">核心崩潰</h1>
    <div class="big" id="goScore">0</div>
    <div id="goNew"></div>
    <div class="stats" id="goStats"></div>
    <button class="go" id="bAgain">再來一次</button>
  </div>
</div></div>

<script>
(() => {
'use strict';
// ================= utils =================
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const F = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const $ = id => document.getElementById(id);
const wrapAng = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
function segDist2(ax, ay, bx, by, px, py) {
  const abx = bx - ax, aby = by - ay;
  const t = clamp(((px - ax) * abx + (py - ay) * aby) / (abx * abx + aby * aby || 1), 0, 1);
  const cx = ax + abx * t - px, cy = ay + aby * t - py;
  return cx * cx + cy * cy;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ================= canvas / layout =================
const game = $('game'), cv = $('c'), ctx = cv.getContext('2d');
const LW = 420;
let LH = 800, SCALE = 1, FT = 80, FB = 700, CX = 210, CY = 700;
let segs = [], pathLen = 1, roadPath = null, pads = [];
const PAD_R = 20;

function resize() {
  const wr = $('wrap');
  const iw = wr.clientWidth || window.innerWidth, ih = wr.clientHeight || window.innerHeight;
  const gw = Math.min(iw, Math.round(ih * 0.62));
  game.style.width = gw + 'px'; game.style.height = ih + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(gw * dpr); cv.height = Math.round(ih * dpr);
  cv.style.width = gw + 'px'; cv.style.height = ih + 'px';
  SCALE = cv.width / LW; LH = cv.height / SCALE;
  FT = 84; FB = LH - 64 * LW / gw - 34;
  layout();
  initLines();
}
window.addEventListener('resize', resize);

function fy(f) { return FT + f * (FB - FT); }
function layout() {
  const pts = [[70, -40], [70, fy(0.1)], [350, fy(0.1)], [350, fy(0.37)], [70, fy(0.37)],
    [70, fy(0.64)], [350, fy(0.64)], [350, fy(0.88)], [210, fy(0.88)], [210, FB]];
  CX = 210; CY = FB;
  segs = []; let cum = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    const len = Math.hypot(x1 - x0, y1 - y0);
    segs.push({ x0, y0, dx: (x1 - x0) / len, dy: (y1 - y0) / len, len, cum, a: Math.atan2(y1 - y0, x1 - x0) });
    cum += len;
  }
  pathLen = cum;
  roadPath = new Path2D();
  pts.forEach(([x, y], i) => i ? roadPath.lineTo(x, y) : roadPath.moveTo(x, y));
  const P = [];
  for (const f of [0.235, 0.505, 0.76]) for (const x of [125, 185, 245, 305]) P.push([x, fy(f)]);
  P.push([95, fy(0.97)], [325, fy(0.97)]);
  if (!pads.length) pads = P.map(([x, y], i) => ({ i, x, y, tower: null }));
  else pads.forEach((p, i) => { p.x = P[i][0]; p.y = P[i][1]; if (p.tower) { p.tower.x = p.x; p.tower.y = p.y; } });
}
function pathPos(d) {
  d = clamp(d, 0, pathLen);
  let s = segs[segs.length - 1];
  for (const g of segs) if (d <= g.cum + g.len) { s = g; break; }
  const k = d - s.cum;
  return { x: s.x0 + s.dx * k, y: s.y0 + s.dy * k, a: s.a };
}

// ================= audio =================
let AC = null, master = null, nbuf = null, muted = store.get('ch_muted', false);
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    master = AC.createGain(); master.gain.value = 0.55;
    master.connect(comp); comp.connect(AC.destination);
    nbuf = AC.createBuffer(1, AC.sampleRate * 0.6 | 0, AC.sampleRate);
    const d = nbuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq, type = 'lowpass', q = 1, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.2, dur + 0.02);
}
const lastS = {};
function can(k, gap) { const n = performance.now(); if (n - (lastS[k] || 0) < gap) return false; lastS[k] = n; return true; }
const sfx = {
  gun() { if (!can('g', 45)) return; tone(rand(1100, 1400), 340, 0.05, 'square', 0.025); noise(0.025, 0.04, 5000, 'highpass'); },
  cannon() { if (!can('cf', 60)) return; tone(160, 60, 0.15, 'sine', 0.35); noise(0.08, 0.2, 1800); },
  boom() { if (!can('b', 50)) return; noise(0.3, 0.45, 700); tone(110, 35, 0.3, 'sine', 0.55); },
  zap() { if (!can('z', 60)) return; tone(rand(1600, 2200), 300, 0.12, 'sawtooth', 0.06); noise(0.1, 0.15, 3500, 'bandpass', 3); },
  frost() { if (!can('f', 90)) return; tone(2400, 1200, 0.2, 'triangle', 0.05); noise(0.2, 0.06, 7000, 'highpass'); },
  rail() { if (!can('r', 60)) return; tone(3000, 200, 0.25, 'sawtooth', 0.09); noise(0.15, 0.35, 2500, 'bandpass', 1); tone(90, 40, 0.25, 'sine', 0.4); },
  hit(big) { if (!can('h', 30)) return; noise(0.045, big ? 0.3 : 0.12, big ? 2200 : 3800, 'bandpass', 1.5); if (big) tone(1900, 900, 0.08, 'triangle', 0.1); },
  kill(sz) {
    if (!can('k', 35)) return;
    noise(0.1 + sz * 0.25, 0.3 + sz * 0.35, 1100 - sz * 600);
    tone(240 - sz * 120, 38, 0.12 + sz * 0.35, 'sine', 0.4 + sz * 0.3);
    const p = 420 * Math.pow(2, Math.min(combo, 24) / 12);
    tone(p, p * 0.5, 0.07, 'square', 0.04);
  },
  coin() { if (!can('co', 70)) return; tone(1500, 1500, 0.05, 'square', 0.025); tone(2000, 2000, 0.07, 'square', 0.025, 0.05); },
  build() { tone(120, 50, 0.2, 'sine', 0.5); noise(0.15, 0.35, 1500); tone(700, 1400, 0.1, 'square', 0.05, 0.08); },
  upgrade() { tone(500, 1000, 0.1, 'square', 0.06); tone(750, 1500, 0.1, 'square', 0.06, 0.08); tone(1000, 2000, 0.15, 'square', 0.06, 0.16); },
  sell() { tone(900, 300, 0.2, 'triangle', 0.12); noise(0.2, 0.2, 2000); },
  leak() { noise(0.45, 0.6, 450); tone(140, 30, 0.5, 'sawtooth', 0.28); },
  od() { tone(160, 1800, 0.55, 'sawtooth', 0.14); noise(0.7, 0.45, 1400); tone(80, 30, 0.8, 'sine', 0.6); },
  wave() { tone(330, 660, 0.12, 'square', 0.05); tone(495, 990, 0.14, 'square', 0.05, 0.09); },
  boss() { tone(90, 60, 1.0, 'sawtooth', 0.2); tone(92, 61, 1.0, 'sawtooth', 0.2, 0.05); },
  click() { tone(900, 700, 0.04, 'square', 0.04); },
  tap() { noise(0.05, 0.12, 2500, 'bandpass', 2); }
};
function vib(ms) { if (muted || !navigator.vibrate || !can('v', 70)) return; try { navigator.vibrate(ms); } catch (e) {} }

// ================= data =================
const ECOL = { tri: '#ff3d7f', sq: '#ff7a3d', pent: '#e85dff', dot: '#ffd23d', dash: '#ff9db8', boss: '#ff2a4a' };
const EDEF = {
  tri:  { r: 11, hp: 22,   sp: 95,  sides: 3,  gold: 4,   dmg: 1,  mass: 1,   score: 10 },
  sq:   { r: 15, hp: 95,   sp: 55,  sides: 4,  gold: 9,   dmg: 2,  mass: 2.6, score: 25 },
  pent: { r: 18, hp: 160,  sp: 50,  sides: 5,  gold: 12,  dmg: 2,  mass: 3.4, score: 40 },
  dot:  { r: 7,  hp: 12,   sp: 130, sides: 0,  gold: 2,   dmg: 1,  mass: 0.6, score: 5 },
  dash: { r: 12, hp: 65,   sp: 60,  sides: -1, gold: 8,   dmg: 2,  mass: 1.3, score: 30 },
  boss: { r: 36, hp: 2400, sp: 26,  sides: 6,  gold: 150, dmg: 10, mass: 30,  score: 600 }
};
const TT = {
  gun:    { name: '機槍', col: '#3cf2ff', sh: 3,  cost: 50,  range: 112, rate: 6,    dmg: 6,  desc: '高速連射' },
  cannon: { name: '加農', col: '#5b8cff', sh: 4,  cost: 90,  range: 128, rate: 0.75, dmg: 34, splash: 46, desc: '範圍爆炸' },
  tesla:  { name: '電弧', col: '#b36bff', sh: 5,  cost: 110, range: 105, rate: 1.1,  dmg: 22, chain: 3, desc: '連鎖電擊' },
  frost:  { name: '冰霜', col: '#bdf4ff', sh: 0,  cost: 70,  range: 92,  rate: 0.85, dmg: 5,  slow: 0.4, desc: '範圍緩速' },
  rail:   { name: '狙擊', col: '#4dff9a', sh: -1, cost: 140, range: 235, rate: 0.45, dmg: 90, desc: '穿透光束' }
};
const TORDER = ['gun', 'cannon', 'tesla', 'frost', 'rail'];
function tStats(type, lv) {
  const b = TT[type], L = lv - 1;
  return { range: b.range * (1 + 0.1 * L), rate: b.rate * (1 + 0.2 * L), dmg: b.dmg * Math.pow(1.65, L),
    splash: (b.splash || 0) * (1 + 0.15 * L), chain: (b.chain || 0) + L, slow: Math.min(0.7, (b.slow || 0) + 0.1 * L) };
}
const upCost = t => Math.round(TT[t.type].cost * (t.lv === 1 ? 0.85 : 1.35));
const sellVal = t => Math.round(t.spent * 0.7);
const BS = 1250;

// ================= state =================
let state = 'title', paused = false, spd = 1;
let enemies = [], towers = [], bullets = [], shells = [], beams = [], parts = [], shards = [], rings = [], texts = [], bolts = [], lines = [];
let wave = 0, score = 0, shownScore = 0, combo = 0, comboT = 0, comboPop = 0, maxCombo = 0, kills = 0;
let gold = 0, lives = 20, maxLives = 20, od = 0, odOn = false, odT = 0, coreFlash = 0, coreRot = 0;
let spawnQ = [], spawnT = 0, interT = 0, sel = null, flowT = 0;
let freeze = 0, freezeCD = 0, slowT = 0, trauma = 0, flashA = 0, flashC = '#fff', dyingT = 0, banner = null, bossRef = null;
let best = store.get('ch2_best', { score: 0, wave: 0 });
const OD_DUR = 7;

function newGame() {
  enemies = []; towers = []; bullets = []; shells = []; beams = []; parts = []; shards = []; rings = []; texts = []; bolts = [];
  pads.forEach(p => p.tower = null);
  wave = 0; score = 0; shownScore = 0; combo = 0; comboT = 0; maxCombo = 0; kills = 0;
  gold = 170; lives = maxLives = 20; od = 0; odOn = false; odT = 0;
  spawnQ = []; interT = 0; sel = null; freeze = 0; slowT = 0; trauma = 0; flashA = 0; bossRef = null; dyingT = 0;
  state = 'build';
  banner = { t: 0, text: '建造砲台', col: '#3cf2ff' };
  closePanel(); syncBar(true);
}

function buildWave(n) {
  const q = [], count = 8 + n * 3, iv = Math.max(0.32, 1.0 - n * 0.035);
  for (let i = 0; i < count; i++) {
    const r = Math.random(); let t = 'tri';
    if (n >= 2 && r < 0.22) t = 'sq';
    else if (n >= 3 && r < 0.36) t = 'swarm';
    else if (n >= 4 && r < 0.48) t = 'dash';
    else if (n >= 6 && r < 0.58) t = 'pent';
    q.push({ t, d: iv * rand(0.6, 1.4) });
  }
  if (n % 5 === 0) q.splice(Math.floor(count / 2), 0, { t: 'boss', d: 2.5 });
  return q;
}

function startWave() {
  if (state !== 'build') return;
  if (wave > 0 && interT > 0) {
    const bonus = Math.ceil(interT) * 3;
    gold += bonus; popText(LW / 2, LH * 0.47, '提前開戰 +' + bonus, 18, '#ffd23d'); sfx.coin(); bumpGold();
  }
  wave++; spawnQ = buildWave(wave); spawnT = 0.4; interT = 0; state = 'wave';
  const isBoss = wave % 5 === 0;

  isBoss ? sfx.boss() : sfx.wave();
}

function spawn(t, d = 0, lane) {
  if (t === 'swarm') {
    const n = 5 + Math.min(5, wave >> 2);
    for (let i = 0; i < n; i++) spawn('dot', d - i * 16, rand(-11, 11));
    return;
  }
  const b = EDEF[t], w = wave - 1;
  const hpS = 1 + 0.24 * w + 0.028 * w * w;
  const e = {
    type: t, d, lane: lane ?? rand(-7, 7), x: 0, y: -50, a: Math.PI / 2, r: b.r, sides: b.sides, col: ECOL[t],
    hp: b.hp * hpS, maxHp: b.hp * hpS, sp: b.sp * (1 + Math.min(0.4, w * 0.015)), gold: b.gold, dmg: b.dmg, mass: b.mass,
    score: b.score, rot: rand(0, TAU), rs: rand(-3, 3), kb: 0, flash: 0, slowT: 0, slowF: 0, t: 0,

}

function sparks(x, y, n, col, a0, spread, smin, smax, life = 0.25, w = 2) {

}
function shatter(x, y, r, col, n, dx, dy, pow) {

// ================= combat =================
const comboMult = () => Math.min(5, 1 + Math.floor(combo / 10) * 0.25);

function predict(e, t) {
  const sp = e.sp * (e.slowT > 0 ? 1 - e.slowF : 1) * (odOn ? 0.6 : 1);
  const p = pathPos(e.d + sp * t);
  return { x: p.x - Math.sin(p.a) * e.lane, y: p.y + Math.cos(p.a) * e.lane };
}

function towerFire(t, tg) {
  const s = t.s, dm = odOn ? 1.5 : 1;

    const barrels = t.lv >= 3 ? 2 : 1;
    for (let i = 0; i < barrels; i++) {
      const off = barrels > 1 ? (i ? 4 : -4) : 0;
      const bx = mx - sn * off, by = my + c * off, a = t.ang + rand(-0.03, 0.03);
      bullets.push({ x: bx, y: by, px: bx, py: by, vx: Math.cos(a) * BS, vy: Math.sin(a) * BS, dmg: s.dmg * dm, life: s.range * 1.4 / BS, col: t.col });
    }

  } else if (t.type === 'cannon') {
    const d = Math.hypot(tg.x - t.x, tg.y - t.y), T = d / 560 + 0.05;
    const p = predict(tg, T);
    shells.push({ x0: mx, y0: my, x1: p.x, y1: p.y, t: 0, T, dmg: s.dmg * dm, splash: s.splash });
    sparks(mx, my, 6, '#ffffff', t.ang, 0.5, 150, 400, 0.18, 2);
    addTrauma(0.05); sfx.cannon();

      const tx = target.x, ty = target.y;
      hitEnemy(target, dmg, (tx - cur.x) / dd, (ty - cur.y) / dd, 30, { col: '#e6d4ff', num: true, sparks: 5, snd: false });

    for (const e of enemies) {
      if (e.dead) continue;

    let n = 0;
    for (const e of enemies) {
      if (e.dead) continue;
      if (segDist2(mx, my, x1, y1, e.x, e.y) < (e.r + 7) ** 2) {
        hitEnemy(e, s.dmg * dm * (n ? 0.8 : 1), c, sn, 140, { col: '#ffffff', num: true, big: true, sparks: 10, snd: false }); n++;
      }
    }
    sparks(mx, my, 10, '#ffffff', t.ang, 0.35, 300, 900, 0.2, 2.5);
    if (n) freezeFor(0.04);
    addTrauma(0.18); screenFlash('#4dff9a', 0.08); sfx.rail(); vib(15);
  }
}

function explode(x, y, dmg, R) {
  ring(x, y, 6, R, 0.25, '#ffb020', 6);
  ring(x, y, 0, R * 0.7, 0.08, '#fff3c0', 0, true);

  sparks(x, y, 6, '#ffffff', 0, Math.PI, 200, 600, 0.18, 2);
  let n = 0;

    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y, d = Math.hypot(dx, dy);
    if (d < R + e.r) { hitEnemy(e, dmg, dx / (d || 1), dy / (d || 1), 90, { num: true, sparks: 3, snd: false }); n++; }
  }
  addTrauma(n ? 0.16 : 0.08); sfx.boom(); if (n >= 3) freezeFor(0.035);
}

function tapStrike(x, y) {

  let n = 0;
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y, d = Math.hypot(dx, dy);
    if (d < R + e.r) { hitEnemy(e, dmg, dx / (d || 1), dy / (d || 1), 120, { num: true, big: true, sparks: 8, col: '#ffffff', snd: false }); n++; }
  }

function activateOD() {
  if (od < 1 || odOn || (state !== 'wave' && state !== 'build')) return;

  sfx.od(); vib(80); addTrauma(0.8); freezeFor(0.12); screenFlash('#b36bff', 0.55);
  ring(CX, CY, 20, LH * 1.3, 0.8, '#b36bff', 14);

}

// ================= towers / panel =================
function build(pad, type) {
  const b = TT[type];
  if (pad.tower || gold < b.cost) return false;
  gold -= b.cost;
  const t = { type, lv: 1, x: pad.x, y: pad.y, pad, col: b.col, ang: -Math.PI / 2, cd: 0.2, recoil: 0, muzzle: 0, pop: 1, spent: b.cost, s: tStats(type, 1), spin: 0 };
  pad.tower = t; towers.push(t);
  ring(pad.x, pad.y, PAD_R, 70, 0.3, b.col, 5);
  sparks(pad.x, pad.y, 16, b.col, 0, Math.PI, 150, 500, 0.3, 2.5);
  addTrauma(0.25); vib(25); sfx.build(); freezeFor(0.05);
  syncBar(true);
  return true;
}
function upgrade(t) {
  if (t.lv >= 3) return;
  const c = upCost(t);
  if (gold < c) return;
  gold -= c; t.spent += c; t.lv++; t.s = tStats(t.type, t.lv); t.pop = 1;
  ring(t.x, t.y, PAD_R, 80, 0.35, t.col, 6); ring(t.x, t.y, PAD_R, 50, 0.25, '#ffffff', 3);
  sparks(t.x, t.y, 22, t.col, -Math.PI / 2, 1.2, 200, 650, 0.35, 2.5);

}
function sell(t) {

  t.pad.tower = null; towers = towers.filter(o => o !== t);
  sfx.sell(); addTrauma(0.15); syncBar(true);
}

const panel = $('panel');
function svgShape(sh, col, sz = 9) {

  let pts;
  if (sh === -1) pts = [[0, -sz * 1.1], [sz * 0.65, 0], [0, sz * 1.1], [-sz * 0.65, 0]];
  else pts = Array.from({ length: sh }, (_, i) => { const a = -Math.PI / 2 + i * TAU / sh; return [Math.cos(a) * sz, Math.sin(a) * sz]; });
  return `<polygon points="${pts.map(p => p.map(v => v.toFixed(2)).join(',')).join(' ')}" fill="${col}33" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
}
function openPanel(pad) {
  sel = pad; sfx.click();

    panel.querySelectorAll('.tb').forEach(btn => btn.addEventListener('click', () => {
      if (sel && build(sel, btn.dataset.k)) closePanel();

    }));

// ================= bottom bar =================
let lastGold = -1, lastBar = '';
function bumpGold() { const g = $('gold'); g.classList.remove('bump'); void g.offsetWidth; g.classList.add('bump'); }
function syncBar(force) {

  $('lives').textContent = lives;

$('bWave').addEventListener('click', () => { initAudio(); startWave(); });
$('bOD').addEventListener('click', () => { initAudio(); activateOD(); });
$('bSpd').addEventListener('click', () => { spd = spd % 3 + 1; $('bSpd').textContent = '×' + spd; sfx.click(); });

// ================= update =================
function update(dt, rdt) {
  freezeCD -= rdt;
  const inten = Math.min(1, combo / 40) + (odOn ? 1 : 0);
  const lineV = 220 * (1 + inten * 2.5);
  for (const l of lines) {
    l.y += lineV * l.s * (dt || rdt * 0.05);
    if (l.y - l.l * 3 > LH) { l.y = -rand(0, 80); l.x = rand(0, LW); }
  }
  flowT += dt * (state === 'wave' ? 1 : 0.4);
  coreRot += dt * (odOn ? 4 : 1.2);
  updateFx(dt);

  if (state === 'dying') { dyingT -= rdt; updateEnemies(dt); if (dyingT <= 0) gameOver(); return; }
  if (state !== 'wave' && state !== 'build') return;

  if (state === 'wave') {
    if (spawnQ.length) {
      spawnT -= dt;
      if (spawnT <= 0) { const it = spawnQ.shift(); spawn(it.t, 0); spawnT = spawnQ.length ? spawnQ[0].d : 0; }
    } else if (!enemies.length) {
      const bonus = 20 + wave * 5;
      gold += bonus; bumpGold();
      state = 'build'; interT = 12;
      banner = { t: 0, text: 'CLEAR +' + bonus, col: '#4dff9a' }; sfx.wave(); sfx.coin();
    }
  } else if (wave > 0) {
    interT -= dt;
    if (interT <= 0) startWave();
  }

  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  if (odOn) { odT -= dt; od = Math.max(0, odT / OD_DUR); if (odT <= 0) { odOn = false; od = 0; } }

  // towers
  for (const t of towers) {
    t.cd -= dt; t.spin += dt;
    const R = t.s.range;
    let tg = null, bd = -1;
    for (const e of enemies) {
      if (e.dead || e.y < -10) continue;
      if ((e.x - t.x) ** 2 + (e.y - t.y) ** 2 < (R + e.r) ** 2 && e.d > bd) { bd = e.d; tg = e; }
    }
    if (tg && t.type !== 'frost') {
      let ax = tg.x, ay = tg.y;
      if (t.type === 'gun') { const p = predict(tg, Math.hypot(tg.x - t.x, tg.y - t.y) / BS); ax = p.x; ay = p.y; }
      t.ang += wrapAng(Math.atan2(ay - t.y, ax - t.x) - t.ang) * Math.min(1, 26 * dt);
    }
    if (tg && t.cd <= 0) {
      towerFire(t, tg);
      t.cd += 1 / (t.s.rate * (odOn ? 2 : 1));
      if (t.cd < 0) t.cd = 0;
    } else if (!tg) t.cd = Math.max(0, t.cd);
  }

  updateEnemies(dt);

  // bullets
  for (const b of bullets) {
    b.px = b.x; b.py = b.y; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of enemies) {
      if (e.dead) continue;
      if (segDist2(b.px, b.py, b.x, b.y, e.x, e.y) < (e.r + 3) ** 2) {
        hitEnemy(e, b.dmg, b.vx / BS, b.vy / BS, 18, { sparks: 3, shake: 0.012 });
        b.dead = true; break;
      }
    }
    if (b.life <= 0) b.dead = true;
  }
  bullets = bullets.filter(b => !b.dead);
  for (const s of shells) { s.t += dt; if (s.t >= s.T) { s.dead = true; explode(s.x1, s.y1, s.dmg, s.splash); } }
  shells = shells.filter(s => !s.dead);
  enemies = enemies.filter(e => !e.dead);
}

function updateEnemies(dt) {
  const oS = odOn ? 0.6 : 1;
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt; e.flash -= dt; e.rot += e.rs * dt;
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowF = 0; }
    let sp = e.sp * (e.slowT > 0 ? 1 - e.slowF : 1) * oS;
    if (e.type === 'dash') {
      e.dashT -= dt;
      if (e.dashT <= 0) { e.dashing = 0.45; e.dashT = 2.6; }
      if (e.dashing > 0) { e.dashing -= dt; sp *= 5; }
    } else if (e.type === 'boss') {
      e.spawnCD -= dt;
      if (e.spawnCD <= 0 && state === 'wave') {
        e.spawnCD = e.hp < e.maxHp / 2 ? 1.8 : 2.8;
        for (let i = 0; i < 2; i++) spawn('tri', e.d + 20, i ? 10 : -10);
        ring(e.x, e.y, e.r, e.r * 1.6, 0.25, ECOL.boss, 3);
      }
    }
    e.d += (sp - e.kb) * dt;
    e.kb *= Math.exp(-10 * dt);
    if (e.d < 0) e.d = 0;
    const p = pathPos(e.d);
    e.x = p.x - Math.sin(p.a) * e.lane; e.y = p.y + Math.cos(p.a) * e.lane; e.a = p.a;
    e.vx = Math.cos(p.a) * (sp - e.kb); e.vy = Math.sin(p.a) * (sp - e.kb);
    if (e.d >= pathLen && state === 'wave') leak(e);
  }
  enemies = enemies.filter(e => !e.dead);
}

function updateFx(dt) {
  for (const p of parts) { const k = Math.exp(-5 * dt); p.vx *= k; p.vy *= k; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const s of shards) { const k = Math.exp(-3 * dt); s.vx *= k; s.vy *= k; s.vy += 240 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.rs * dt; s.life -= dt; }
  shards = shards.filter(s => s.life > 0);
  for (const r of rings) r.life -= dt;
  rings = rings.filter(r => r.life > 0);
  for (const b of bolts) b.life -= dt;
  bolts = bolts.filter(b => b.life > 0);
  for (const b of beams) b.life -= dt;
  beams = beams.filter(b => b.life > 0);
  for (const t of texts) { t.y += t.vy * dt; t.vy *= Math.exp(-4 * dt); t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  if (banner) { banner.t += dt; if (banner.t > 1.3) banner = null; }
}

// ================= render =================
function initLines() {
  lines = [];
  for (let i = 0; i < 60; i++) lines.push({ x: rand(0, LW), y: rand(-80, LH), l: rand(10, 60), s: rand(0.5, 1.6) });
}
function shapePath(x, y, r, sides, rot) {
  ctx.beginPath();
  if (sides === 0) { ctx.arc(x, y, r, 0, TAU); return; }
  if (sides === -1) {
    const c = Math.cos(rot), s = Math.sin(rot);
    [[r * 1.5, 0], [0, r * 0.75], [-r * 0.9, 0], [0, -r * 0.75]].forEach(([px, py], i) => {
      const X = x + px * c - py * s, Y = y + px * s + py * c; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    });
    ctx.closePath(); return;
  }
  for (let i = 0; i < sides; i++) {
    const a = rot + i * TAU / sides, X = x + Math.cos(a) * r, Y = y + Math.sin(a) * r;
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  }
  ctx.closePath();
}
function glowStroke(col, w) {
  ctx.strokeStyle = col;
  ctx.globalAlpha = 0.22; ctx.lineWidth = w * 3.2; ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = w; ctx.stroke();
}

function drawRoad() {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = odOn ? 'rgba(179,107,255,.35)' : 'rgba(60,242,255,.22)'; ctx.lineWidth = 44; ctx.stroke(roadPath);
  ctx.strokeStyle = '#0c1024'; ctx.lineWidth = 39; ctx.stroke(roadPath);
  const step = 34, off = (flowT * 90 * (state === 'wave' ? spd : 1)) % step;
  ctx.strokeStyle = odOn ? 'rgba(200,150,255,.35)' : 'rgba(60,242,255,.2)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let d = off; d < pathLen; d += step) {
    const p = pathPos(d), c = Math.cos(p.a), s = Math.sin(p.a);
    ctx.moveTo(p.x - c * 3 - s * 6, p.y - s * 3 + c * 6); ctx.lineTo(p.x + c * 4, p.y + s * 4); ctx.lineTo(p.x - c * 3 + s * 6, p.y - s * 3 - c * 6);
  }
  ctx.stroke();
}

function drawPad(p) {
  if (p.tower) return;
  const selected = sel === p;
  shapePath(p.x, p.y, PAD_R, 6, Math.PI / 6);
  ctx.fillStyle = selected ? 'rgba(60,242,255,.18)' : 'rgba(255,255,255,.03)'; ctx.fill();
  ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
  ctx.strokeStyle = selected ? '#3cf2ff' : 'rgba(60,242,255,.35)'; ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = selected ? '#3cf2ff' : 'rgba(60,242,255,.45)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(p.x - 5, p.y); ctx.lineTo(p.x + 5, p.y); ctx.moveTo(p.x, p.y - 5); ctx.lineTo(p.x, p.y + 5); ctx.stroke();
}

function drawTower(t) {
  const b = TT[t.type], pop = t.pop > 0 ? t.pop : 0;
  const sc = 1 + pop * 0.5;
  ctx.save(); ctx.translate(t.x, t.y); ctx.scale(sc, sc);
  shapePath(0, 0, PAD_R, 6, Math.PI / 6);
  ctx.fillStyle = '#0d1126'; ctx.fill(); ctx.strokeStyle = b.col + '66'; ctx.lineWidth = 1.5; ctx.stroke();
  for (let i = 0; i < t.lv; i++) { ctx.fillStyle = b.col; ctx.fillRect(-7 + i * 6, PAD_R - 7, 4, 3); }
  const rec = t.recoil * 5;
  if (t.type === 'frost') {
    const pul = 1 + Math.sin(t.spin * 4) * 0.08;
    ctx.rotate(t.spin * 0.8);
    for (let i = 0; i < 6; i++) { ctx.rotate(TAU / 6); ctx.fillStyle = b.col; ctx.fillRect(3, -1.5, 9 * pul, 3); }
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
  } else if (t.type === 'tesla') {
    shapePath(0, 0, 12, 5, t.spin * 2); ctx.fillStyle = b.col + '33'; ctx.fill(); glowStroke(b.col, 2);
    ctx.beginPath(); ctx.arc(0, 0, 5 + t.recoil * 3, 0, TAU); ctx.fillStyle = t.recoil > 0.2 ? '#ffffff' : b.col; ctx.fill();
  } else {
    ctx.rotate(t.ang);
    if (t.type === 'gun') {
      ctx.fillStyle = b.col;
      if (t.lv >= 3) { ctx.fillRect(2 - rec, -6, 18, 4); ctx.fillRect(2 - rec, 2, 18, 4); }
      else ctx.fillRect(2 - rec, -3, 18 + (t.lv - 1) * 2, 6);
      shapePath(0, 0, 10, 3, 0); ctx.fillStyle = '#0d1126'; ctx.fill(); glowStroke(b.col, 2);
    } else if (t.type === 'cannon') {
      ctx.fillStyle = b.col; ctx.fillRect(-2 - rec * 1.6, -6, 20, 12);
      ctx.fillStyle = '#0d1126'; ctx.fillRect(13 - rec * 1.6, -3, 5, 6);
      shapePath(0, 0, 11, 4, Math.PI / 4); ctx.fillStyle = '#0d1126'; ctx.fill(); glowStroke(b.col, 2);
    } else if (t.type === 'rail') {
      ctx.fillStyle = b.col; ctx.fillRect(-4 - rec * 2, -5, 28, 3); ctx.fillRect(-4 - rec * 2, 2, 28, 3);
      shapePath(0, 0, 9, -1, 0); ctx.fillStyle = '#0d1126'; ctx.fill(); glowStroke(b.col, 2);
    }
    if (t.muzzle > 0 && t.type !== 'rail') {
      ctx.globalCompositeOperation = 'lighter';
      const m = t.muzzle / 0.05, L = 12 + Math.random() * 10, x0 = 20 - rec;
      ctx.fillStyle = `rgba(255,255,230,${m})`;
      ctx.beginPath(); ctx.moveTo(x0, -5 * m); ctx.lineTo(x0 + L, 0); ctx.lineTo(x0, 5 * m); ctx.fill();
      ctx.beginPath(); ctx.arc(x0 + 2, 0, 6 * m, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  ctx.restore();
}

function drawEnemy(e) {
  const fl = e.flash > 0 ? e.flash / 0.07 : 0;
  const sp = Math.hypot(e.vx, e.vy);
  if (sp > 120) {
    ctx.globalAlpha = 0.25; ctx.strokeStyle = e.col; ctx.lineWidth = e.r * 0.9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x - e.vx * 0.1, e.y - e.vy * 0.1); ctx.stroke(); ctx.globalAlpha = 1;
  }
  let x = e.x, y = e.y;
  if (fl > 0) { x += rand(-2, 2); y += rand(-2, 2); }
  const r = e.r * (1 + fl * 0.28);
  const rot = e.type === 'tri' || e.type === 'dash' ? e.a : e.rot;
  shapePath(x, y, r, e.sides, rot);
  ctx.fillStyle = fl > 0 ? '#ffffff' : e.col + '2a'; ctx.fill();
  ctx.lineJoin = 'round';
  glowStroke(fl > 0 ? '#ffffff' : e.slowT > 0 ? '#bdf4ff' : e.col, e.type === 'boss' ? 4 : 2.5);
  if (e.r >= 15) { shapePath(x, y, r * 0.48, e.sides, -rot * 1.6); ctx.lineWidth = 2; ctx.strokeStyle = fl > 0 ? '#fff' : e.col; ctx.stroke(); }
  if (e.type === 'boss') {
    for (let i = 0; i < 4; i++) { const a = e.t * 2 + i * TAU / 4; shapePath(x + Math.cos(a) * (r + 14), y + Math.sin(a) * (r + 14), 5, 4, a); ctx.fillStyle = ECOL.boss; ctx.fill(); }
  } else if (e.hp < e.maxHp) {
    const w = Math.max(16, e.r * 2);
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(e.x - w / 2, e.y - e.r - 8, w, 3);
    ctx.fillStyle = e.col; ctx.fillRect(e.x - w / 2, e.y - e.r - 8, w * Math.max(0, e.hp / e.maxHp), 3);
  }
  if (e.slowT > 0) { ctx.globalAlpha = 0.5; shapePath(x, y, r + 4, e.sides, rot); ctx.strokeStyle = '#bdf4ff'; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1; }
}

function drawCore() {
  const hit = coreFlash > 0, f = lives / maxLives;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(CX, CY, 34, 0, TAU); ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, 34, -Math.PI / 2, -Math.PI / 2 + TAU * f); ctx.strokeStyle = f < 0.3 ? '#ff2a4a' : '#3cf2ff'; ctx.lineWidth = 4; ctx.stroke();
  shapePath(CX, CY, 24, 6, coreRot);
  ctx.fillStyle = hit ? '#ff2a4a' : 'rgba(60,242,255,.14)'; ctx.fill(); glowStroke(hit ? '#ffffff' : '#3cf2ff', 2.5);
  shapePath(CX, CY, 13, 6, -coreRot * 1.5); ctx.strokeStyle = '#3cf2ff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, 6 + Math.sin(coreRot * 3) * 1.2, 0, TAU); ctx.fillStyle = hit ? '#fff' : '#3cf2ff'; ctx.fill();
}

function render(rdt) {
  trauma = Math.max(0, trauma - rdt * 1.6);
  flashA = Math.max(0, flashA - rdt * 3.5);
  coreFlash -= rdt; comboPop = Math.max(0, comboPop - rdt * 7);
  for (const t of towers) { t.recoil = Math.max(0, t.recoil - rdt * 10); t.muzzle -= rdt; t.pop = Math.max(0, t.pop - rdt * 6); }
  shownScore += (score - shownScore) * Math.min(1, rdt * 12);
  if (Math.abs(score - shownScore) < 1) shownScore = score;

  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = odOn ? '#0b0718' : '#07080f'; ctx.fillRect(0, 0, LW, LH);
  const s2 = trauma * trauma;
  ctx.save();
  ctx.translate(LW / 2 + rand(-1, 1) * 14 * s2, LH / 2 + rand(-1, 1) * 14 * s2); ctx.rotate(rand(-1, 1) * 0.03 * s2); ctx.translate(-LW / 2, -LH / 2);

  ctx.strokeStyle = odOn ? 'rgba(179,107,255,.08)' : 'rgba(60,242,255,.045)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= LW; x += 42) { ctx.moveTo(x + 0.5, -40); ctx.lineTo(x + 0.5, LH + 40); }
  for (let y = 0; y < LH + 42; y += 42) { ctx.moveTo(-20, y + 0.5); ctx.lineTo(LW + 20, y + 0.5); }
  ctx.stroke();
  const inten = Math.min(1, combo / 40) + (odOn ? 1 : 0);
  ctx.lineWidth = 1.5; ctx.lineCap = 'butt';
  for (const l of lines) {
    ctx.strokeStyle = odOn ? `rgba(200,140,255,${0.1 + l.s * 0.14})` : `rgba(160,230,255,${0.04 + l.s * 0.08})`;
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y - l.l * (1 + inten * 2.5)); ctx.stroke();
  }

  drawRoad();
  ctx.beginPath(); ctx.arc(70, FT - 30, 15 + Math.sin(flowT * 6) * 3, 0, TAU);
  ctx.strokeStyle = 'rgba(255,42,74,.55)'; ctx.lineWidth = 2; ctx.stroke();

  for (const p of pads) drawPad(p);
  if (sel && sel.tower) {
    ctx.beginPath(); ctx.arc(sel.x, sel.y, sel.tower.s.range, 0, TAU);
    ctx.fillStyle = 'rgba(60,242,255,.06)'; ctx.fill();
    ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(60,242,255,.6)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
  }
  if (state !== 'dying' && state !== 'over') drawCore();

  for (const r of rings) {
    const k = 1 - r.life / r.max, e = 1 - (1 - k) ** 3, rad = r.r + (r.R - r.r) * e;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.globalAlpha = r.life / r.max;
    if (r.fill) { ctx.fillStyle = r.col; ctx.fill(); } else { ctx.strokeStyle = r.col; ctx.lineWidth = r.w * (r.life / r.max) + 0.5; ctx.stroke(); }
  }
  ctx.globalAlpha = 1;

  for (const e of enemies) if (!e.dead) drawEnemy(e);
  for (const t of towers) drawTower(t);

  for (const s of shells) {
    const k = s.t / s.T, x = s.x0 + (s.x1 - s.x0) * k, y = s.y0 + (s.y1 - s.y0) * k, h = Math.sin(Math.PI * k) * 26;
    ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fillStyle = '#000'; ctx.fill(); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(x, y - h, 5 + h * 0.08, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#5b8cff'; ctx.stroke();
  }

  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const b of beams) {
    const a = b.life / b.max;
    ctx.globalAlpha = a; ctx.strokeStyle = b.col; ctx.lineWidth = 12 * a; ctx.beginPath(); ctx.moveTo(b.x0, b.y0); ctx.lineTo(b.x1, b.y1); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3.5 * a + 0.5; ctx.stroke();
  }
  for (const b of bolts) {
    ctx.globalAlpha = b.life / b.max * 0.4; ctx.beginPath(); b.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.strokeStyle = '#b36bff'; ctx.lineWidth = 7; ctx.stroke();
    ctx.globalAlpha = b.life / b.max; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const b of bullets) {
    const tx = b.x - b.vx * 0.018, ty = b.y - b.vy * 0.018;
    ctx.strokeStyle = odOn ? 'rgba(220,160,255,.55)' : 'rgba(60,242,255,.5)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  for (const s of shards) {
    ctx.globalAlpha = Math.min(1, s.life / s.max * 1.5);
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.beginPath(); ctx.moveTo(s.sz, 0); ctx.lineTo(-s.sz * 0.6, s.sz * 0.55); ctx.lineTo(-s.sz * 0.4, -s.sz * 0.6); ctx.closePath();
    ctx.fillStyle = s.col; ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const a = p.life / p.max;
    ctx.globalAlpha = a; ctx.strokeStyle = p.col; ctx.lineWidth = p.w * (0.4 + a * 0.6);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const age = t.max - t.life, sc = age < 0.08 ? 1.7 - age / 0.08 * 0.7 : 1;
    ctx.globalAlpha = Math.min(1, t.life / t.max * 2.5);
    ctx.font = `900 ${Math.round(t.size * sc)}px ${F}`;
    ctx.lineWidth = 4; ctx.strokeStyle = '#07080f'; ctx.strokeText(t.txt, t.x, t.y);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state !== 'title') drawHUD();
  drawBanner();

  if (lives / maxLives <= 0.3 && state === 'wave') {
    const pulse = 0.3 + Math.sin(performance.now() / 160) * 0.12;
    const g = ctx.createRadialGradient(LW / 2, LH / 2, LH * 0.3, LW / 2, LH / 2, LH * 0.75);
    g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, `rgba(255,0,40,${pulse})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  }
  if (odOn) { ctx.strokeStyle = `rgba(179,107,255,${0.5 + Math.sin(performance.now() / 60) * 0.3})`; ctx.lineWidth = 6; ctx.strokeRect(3, 3, LW - 6, LH - 6); }
  if (flashA > 0) { ctx.globalAlpha = flashA * 0.5; ctx.fillStyle = flashC; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = 1; }
}

function drawHUD() {
  const top = 14;
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = `800 11px ${F}`; ctx.fillText('WAVE', 16, top);
  ctx.fillStyle = '#ffffff'; ctx.font = `900 28px ${F}`; ctx.fillText(wave, 16, top + 13);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = `800 11px ${F}`; ctx.fillText('SCORE', LW / 2, top);
  ctx.fillStyle = '#ffffff'; ctx.font = `900 28px ${F}`; ctx.fillText(Math.round(shownScore).toLocaleString(), LW / 2, top + 13);
  if (combo >= 2) {
    const m = comboMult(), col = m >= 3 ? '#ff3d7f' : m >= 2 ? '#ffb020' : m > 1 ? '#4dff9a' : '#3cf2ff';
    ctx.save(); ctx.translate(LW / 2, top + 58);
    const s = 1 + comboPop * 0.45; ctx.scale(s, s); ctx.rotate(-0.08); ctx.textBaseline = 'middle';
    ctx.font = `italic 900 17px ${F}`; ctx.lineWidth = 4; ctx.strokeStyle = '#07080f';
    ctx.strokeText(combo + ' COMBO', 0, 0); ctx.fillStyle = col; ctx.fillText(combo + ' COMBO', 0, 0);
    ctx.font = `900 11px ${F}`; ctx.fillStyle = '#ffffff'; ctx.fillText('×' + m.toFixed(2), 0, 15);
    ctx.restore();
  }
  if (bossRef && !bossRef.dead) {
    const w = LW - 60, y = top + 50;
    ctx.fillStyle = 'rgba(255,42,74,.18)'; ctx.fillRect(30, y, w, 6);
    ctx.fillStyle = ECOL.boss; ctx.fillRect(30, y, w * Math.max(0, bossRef.hp / bossRef.maxHp), 6);
  }
}

function drawBanner() {
  if (!banner) return;
  const t = banner.t;
  let x;
  if (t < 0.18) { const k = t / 0.18; x = LW * 1.6 - LW * 1.1 * (1 - (1 - k) ** 3); }
  else if (t < 1.0) x = LW / 2 - (t - 0.18) * 30;
  else { const k = (t - 1.0) / 0.3; x = LW / 2 - 24.6 - k * k * LW * 1.4; }
  const y = LH * 0.42;
  ctx.save();
  ctx.globalAlpha = 0.9; ctx.fillStyle = banner.col; ctx.fillRect(0, y - 1, LW, 2);
  ctx.globalAlpha = 0.12; ctx.fillRect(0, y - 32, LW, 64); ctx.globalAlpha = 1;
  ctx.translate(x, y); ctx.transform(1, 0, -0.22, 1, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 46px ${F}`;
  ctx.fillStyle = banner.col; ctx.globalAlpha = 0.35; ctx.fillText(banner.text, 12, 0);
  ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff'; ctx.fillText(banner.text, 0, 0);
  ctx.restore();
}

// ================= flow / UI =================
function gameOver() {
  state = 'over';
  const isNew = score > best.score;
  if (isNew) best = { score, wave };
  else if (wave > best.wave) best.wave = wave;
  store.set('ch2_best', best);
  $('goScore').textContent = score.toLocaleString();
  $('goNew').innerHTML = isNew ? '<div class="new">NEW BEST!</div>' : '';
  $('goStats').innerHTML = `<span>撐到第幾波</span><b>${wave}</b><span>擊破數</span><b>${kills}</b><span>砲台數</span><b>${towers.length}</b><span>最高連擊</span><b>${maxCombo}</b><span>最佳分數</span><b>${best.score.toLocaleString()}</b>`;
  $('ovOver').classList.add('on');
  syncBar(true);
}
function updateBest() { $('bestT').textContent = best.score ? `BEST ${best.score.toLocaleString()} · WAVE ${best.wave}` : ''; }
function startGame() { initAudio(); $('ovTitle').classList.remove('on'); $('ovOver').classList.remove('on'); newGame(); }
$('bStart').addEventListener('click', startGame);
$('bAgain').addEventListener('click', startGame);
$('bPause').addEventListener('click', () => { if (state !== 'wave' && state !== 'build') return; paused = true; $('ovPause').classList.add('on'); });
$('bResume').addEventListener('click', () => { paused = false; $('ovPause').classList.remove('on'); });
function syncMute() { $('bMute').textContent = muted ? '✕' : '♪'; $('bMute').style.opacity = muted ? .5 : 1; }
$('bMute').addEventListener('click', () => { initAudio(); muted = !muted; store.set('ch_muted', muted); syncMute(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'wave' || state === 'build') && !paused) { paused = true; $('ovPause').classList.add('on'); }
});

function toLocal(ev) { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * LW, y: (ev.clientY - r.top) / r.height * LH }; }
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault(); initAudio();
  if ((state !== 'wave' && state !== 'build') || paused) return;
  const p = toLocal(ev);
  let hitPad = null, bd = (PAD_R + 10) ** 2;
  for (const pd of pads) { const d = (pd.x - p.x) ** 2 + (pd.y - p.y) ** 2; if (d < bd) { bd = d; hitPad = pd; } }
  if (hitPad) { if (sel === hitPad) closePanel(); else openPanel(hitPad); return; }
  if (sel) { closePanel(); return; }
  tapStrike(p.x, p.y);
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => { if (e.code === 'Space') activateOD(); });

// ================= loop =================
let last = performance.now(), barT = 0;
function loop(now) {
  const rdt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) {
    let dt = rdt;
    if (freeze > 0) { freeze -= rdt; dt = 0; }
    else if (slowT > 0) { slowT -= rdt; dt *= 0.3; }
    if (state === 'wave') dt *= sel ? 0.35 : spd;
    update(dt, rdt);
  }
  render(paused ? 0 : rdt);
  barT -= rdt;
  if (barT <= 0 && state !== 'title') { barT = 0.08; syncBar(); }
  requestAnimationFrame(loop);
}
resize(); syncMute(); updateBest();
requestAnimationFrame(loop);

window.__CH = { get state() { return state; }, get wave() { return wave; }, get enemies() { return enemies.length; },
  get gold() { return gold; }, set gold(v) { gold = v; }, get towers() { return towers.length; }, pads: () => pads.map(p => [p.x, p.y]),
  build: (i, k) => build(pads[i], k), up: i => pads[i].tower && upgrade(pads[i].tower), setOD() { od = 1; },
  die() { lives = 1; leak(spawn('tri', pathLen)); }, get lives() { return lives; } };
})();
</script>
