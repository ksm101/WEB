<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080f">
<title>核心守衛 CORE HOLD</title>
<style>
  html,body{margin:0;height:100%;background:#07080f;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff}
  #wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:center}
  #game{position:relative;overflow:hidden;background:#07080f}
  canvas{display:block;touch-action:none}
  .btn-top{position:absolute;top:calc(10px + env(safe-area-inset-top));width:36px;height:36px;border-radius:8px;
    border:1.5px solid rgba(255,255,255,.25);background:rgba(10,12,24,.6);color:#fff;font:700 15px/1 system-ui;
    display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:5}
  #bMute{right:10px} #bPause{right:52px}
  .ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(7,8,15,.8);z-index:10;text-align:center;padding:0 20px;box-sizing:border-box}
  .ov.on{display:flex}
  .ov h1{margin:0;font-size:44px;font-weight:900;letter-spacing:2px;line-height:1.05;
    background:linear-gradient(90deg,#3cf2ff,#ff3d7f);-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:zoom .45s cubic-bezier(.2,1.6,.4,1) both}
  .ov h2{margin:4px 0 0;font-size:14px;font-weight:800;letter-spacing:8px;color:#3cf2ff;opacity:.85}
  .ov p{margin:6px 0;color:rgba(255,255,255,.7);font-size:14px;line-height:1.6}
  .ov .big{font-size:40px;font-weight:900;color:#fff;margin:6px 0}
  .go{margin-top:22px;padding:14px 46px;font:900 20px system-ui;letter-spacing:4px;color:#07080f;background:#3cf2ff;
    border:0;border-radius:6px;cursor:pointer;transform:skewX(-10deg);box-shadow:0 0 24px rgba(60,242,255,.5);
    animation:pulse 1.2s ease-in-out infinite}
  .go:active{transform:skewX(-10deg) scale(.94)}
  .tips{margin-top:18px;font-size:13px;color:rgba(255,255,255,.6);line-height:1.9;text-align:left}
  .tips b{color:#3cf2ff}
  #cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px;margin-top:16px}
  .card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;border:2px solid var(--c);
    background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.01));color:#fff;text-align:left;cursor:pointer;
    font-family:inherit;animation:slide .3s cubic-bezier(.2,1.3,.4,1) both;box-shadow:0 0 16px -4px var(--c)}
  .card:active{transform:scale(.96)}
  .card svg{width:40px;height:40px;flex:none}
  .card div{flex:1;display:flex;flex-direction:column;gap:3px}
  .card b{font-size:18px;font-weight:900;color:var(--c)}
  .card span{font-size:13px;color:rgba(255,255,255,.75)}
  .card i{font-style:normal;font-size:12px;font-weight:800;color:rgba(255,255,255,.5)}
  .ttl{font-size:26px;font-weight:900;letter-spacing:4px;color:#fff;animation:zoom .35s cubic-bezier(.2,1.6,.4,1) both}
  .sub{font-size:13px;color:rgba(255,255,255,.55);margin-top:4px}
  .stats{display:grid;grid-template-columns:auto auto;gap:6px 18px;margin-top:14px;font-size:15px;color:rgba(255,255,255,.75)}
  .stats b{color:#fff;text-align:right}
  .new{color:#ffb020;font-weight:900;letter-spacing:2px;animation:pulse .6s ease-in-out infinite}
  @keyframes slide{from{transform:translateX(130%) skewX(-14deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes zoom{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
</style>
</head>
<body>
<div id="wrap"><div id="game">
  <canvas id="c"></canvas>
  <button class="btn-top" id="bPause" aria-label="暫停">❚❚</button>
  <button class="btn-top" id="bMute" aria-label="靜音">♪</button>

  <div class="ov on" id="ovTitle">
    <h1>CORE<br>HOLD</h1>
    <h2>核心守衛</h2>
    <div class="tips">
      ▸ 砲台<b>自動射擊</b>最近的敵人<br>
      ▸ <b>按住拖曳</b>可手動瞄準集火<br>
      ▸ 連殺累積 <b>COMBO</b> 倍率與<b>超載</b>能量<br>
      ▸ 能量滿時點右下 <b>OD</b> 釋放超載<br>
      ▸ 每波結束選一項強化
    </div>
    <button class="go" id="bStart">開 始</button>
    <p id="bestT" style="margin-top:14px"></p>
  </div>

  <div class="ov" id="ovUp">
    <div class="ttl" id="upT">WAVE CLEAR</div>
    <div class="sub">選擇一項強化</div>
    <div id="cards"></div>
  </div>

  <div class="ov" id="ovPause">
    <div class="ttl">暫停</div>
    <button class="go" id="bResume">繼 續</button>
  </div>

  <div class="ov" id="ovOver">
    <h1 style="font-size:38px">核心崩潰</h1>
    <div class="big" id="goScore">0</div>
    <div id="goNew"></div>
    <div class="stats" id="goStats"></div>
    <button class="go" id="bAgain">再來一次</button>
  </div>
</div></div>

<script>
(() => {
'use strict';
// ---------- utils ----------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const F = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const $ = id => document.getElementById(id);
const wrapAng = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
function segDist2(ax, ay, bx, by, px, py) {
  const abx = bx - ax, aby = by - ay;
  const t = clamp(((px - ax) * abx + (py - ay) * aby) / (abx * abx + aby * aby || 1), 0, 1);
  const cx = ax + abx * t - px, cy = ay + aby * t - py;
  return cx * cx + cy * cy;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- canvas ----------
const game = $('game'), cv = $('c'), ctx = cv.getContext('2d');
const LW = 420;
let LH = 800, SCALE = 1, CX = 210, CY = 680;
const OD_BTN = { x: 0, y: 0, r: 32 };
function resize() {
  const iw = window.innerWidth, ih = window.innerHeight;
  const gw = Math.min(iw, Math.round(ih * 0.62));
  game.style.width = gw + 'px'; game.style.height = ih + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(gw * dpr); cv.height = Math.round(ih * dpr);
  cv.style.width = gw + 'px'; cv.style.height = ih + 'px';
  SCALE = cv.width / LW; LH = cv.height / SCALE;
  CX = LW / 2; CY = LH - Math.max(120, LH * 0.15);
  OD_BTN.x = LW - 52; OD_BTN.y = LH - 58;
  initLines();
}
window.addEventListener('resize', resize);

// ---------- audio ----------
let AC = null, master = null, nbuf = null, muted = store.get('ch_muted', false);
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    master = AC.createGain(); master.gain.value = 0.55;
    master.connect(comp); comp.connect(AC.destination);
    nbuf = AC.createBuffer(1, AC.sampleRate * 0.6 | 0, AC.sampleRate);
    const d = nbuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq, type = 'lowpass', q = 1, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = nbuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t, Math.random() * 0.2, dur + 0.02);
}
const lastS = {};
function can(k, gap) { const n = performance.now(); if (n - (lastS[k] || 0) < gap) return false; lastS[k] = n; return true; }
const sfx = {
  shoot() { if (!can('s', 38)) return; tone(rand(1050, 1350), 320, 0.055, 'square', 0.03); noise(0.03, 0.05, 5000, 'highpass'); },
  hit(crit) {
    if (!can('h', 28)) return;
    noise(0.045, crit ? 0.32 : 0.15, crit ? 2200 : 3800, 'bandpass', 1.5);
    if (crit) tone(2000, 900, 0.09, 'triangle', 0.12);
  },
  kill(sz) {
    if (!can('k', 30)) return;
    noise(0.1 + sz * 0.25, 0.32 + sz * 0.35, 1100 - sz * 600);
    tone(240 - sz * 120, 38, 0.12 + sz * 0.35, 'sine', 0.45 + sz * 0.3);
    const p = 420 * Math.pow(2, Math.min(combo, 24) / 12);
    tone(p, p * 0.5, 0.07, 'square', 0.045);
  },
  core() { noise(0.45, 0.6, 450); tone(140, 30, 0.5, 'sawtooth', 0.28); },
  od() { tone(160, 1800, 0.55, 'sawtooth', 0.14); noise(0.7, 0.45, 1400); tone(80, 30, 0.8, 'sine', 0.6); },
  pick() { tone(600, 1200, 0.09, 'triangle', 0.14); tone(900, 1800, 0.12, 'triangle', 0.12, 0.06); },
  wave() { tone(330, 660, 0.12, 'square', 0.05); tone(495, 990, 0.14, 'square', 0.05, 0.09); },
  charge() { if (can('c', 120)) tone(260, 1100, 0.5, 'sawtooth', 0.05); },
  boss() { tone(90, 60, 1.0, 'sawtooth', 0.2); tone(92, 61, 1.0, 'sawtooth', 0.2, 0.05); }
};
function vib(ms) {
  if (muted || !navigator.vibrate || !can('v', 70)) return;
  try { navigator.vibrate(ms); } catch (e) {}
}

// ---------- data ----------
const COL = { core: '#3cf2ff', tri: '#ff3d7f', sq: '#ffb020', pent: '#b36bff', dot: '#ff7a3d', dash: '#4dff9a', boss: '#ff2a4a' };
const DEF = {
  tri:  { r: 13, hp: 20,   sp: 125, sides: 3,  score: 10,  dmg: 6,  mass: 1 },
  sq:   { r: 19, hp: 75,   sp: 55,  sides: 4,  score: 25,  dmg: 12, mass: 2.6 },
  pent: { r: 24, hp: 150,  sp: 45,  sides: 5,  score: 40,  dmg: 16, mass: 3.6 },
  dot:  { r: 8,  hp: 10,   sp: 165, sides: 0,  score: 5,   dmg: 3,  mass: 0.6 },
  dash: { r: 14, hp: 45,   sp: 75,  sides: -1, score: 30,  dmg: 14, mass: 1.3 },
  boss: { r: 54, hp: 2600, sp: 22,  sides: 6,  score: 600, dmg: 45, mass: 30 }
};
const BS = 1500;      // bullet speed
const CORE_R = 26;

// ---------- state ----------
let state = 'title', paused = false;
let enemies = [], bullets = [], parts = [], shards = [], rings = [], texts = [], bolts = [], lines = [];
let P = null, lv = {}, wave = 0, score = 0, shownScore = 0, combo = 0, comboT = 0, comboPop = 0, maxCombo = 0, kills = 0;
let od = 0, odOn = false, odT = 0, coreHp = 100, coreMax = 100, coreFlash = 0, spawnQ = [], spawnT = 0, clearT = 0;
let freeze = 0, freezeCD = 0, slowT = 0, trauma = 0, kickX = 0, kickY = 0, flashA = 0, flashC = '#fff';
let aimAng = -Math.PI / 2, recoil = 0, muzzle = 0, fireT = 0, coreRot = 0, bladeA = 0, gridY = 0, dyingT = 0;
let banner = null, best = store.get('ch_best', 0), bossRef = null;
const pointer = { down: false, id: -1, x: 0, y: 0 };

function newGame() {
  P = { rate: 7, dmg: 1, multi: 1, pierce: 0, boom: 0, chain: 0, blades: 0, crit: 0.05, odDur: 6, odGain: 1 };
  lv = {};
  enemies = []; bullets = []; parts = []; shards = []; rings = []; texts = []; bolts = [];
  wave = 0; score = 0; shownScore = 0; combo = 0; comboT = 0; comboPop = 0; maxCombo = 0; kills = 0;
  od = 0; odOn = false; odT = 0; coreMax = 100; coreHp = 100; coreFlash = 0;
  freeze = 0; slowT = 0; trauma = 0; flashA = 0; dyingT = 0; bossRef = null;
  nextWave();
}

function nextWave() {
  wave++;
  spawnQ = buildWave(wave); spawnT = 1.1; clearT = 0;
  const isBoss = wave % 5 === 0;
  banner = { t: 0, text: isBoss ? 'BOSS WAVE' : 'WAVE ' + wave, col: isBoss ? COL.boss : COL.core };
  state = 'play';
  isBoss ? sfx.boss() : sfx.wave();
}

function buildWave(n) {
  const q = [], count = 12 + n * 5;
  const iv = Math.max(0.15, 0.85 - n * 0.05);
  for (let i = 0; i < count; i++) {
    const r = Math.random(); let t = 'tri';
    if (n >= 2 && r < 0.2) t = 'sq';
    else if (n >= 2 && r < 0.34) t = 'swarm';
    else if (n >= 3 && r < 0.46) t = 'dash';
    else if (n >= 4 && r < 0.56) t = 'pent';
    q.push({ t, d: iv * rand(0.5, 1.5) });
  }
  if (n % 5 === 0) q.splice(Math.floor(count / 3), 0, { t: 'boss', d: 2.5 });
  return q;
}

function spawn(t, x, y) {
  if (t === 'swarm') {
    const n = 4 + Math.min(4, wave >> 2);
    for (let i = 0; i < n; i++) spawn('dot', clamp(x + rand(-40, 40), 20, LW - 20), y - rand(0, 60));
    return;
  }
  const d = DEF[t];
  const hpS = 1 + (wave - 1) * 0.2, spS = 1 + Math.min(0.6, (wave - 1) * 0.03);
  const e = {
    type: t, x, y, r: d.r, sides: d.sides, col: COL[t], hp: d.hp * hpS, maxHp: d.hp * hpS, sp: d.sp * spS,
    score: d.score, dmg: d.dmg, mass: d.mass, rot: rand(0, TAU), rs: rand(-3, 3), kx: 0, ky: 0, vx: 0, vy: 0,
    flash: 0, t: 0, ph: rand(0, TAU), st: 0, mode: 0, bladeCD: 0, spawnCD: 2, dead: false
  };
  if (t === 'boss') { e.rs = 0.6; bossRef = e; trauma = Math.min(1, trauma + 0.5); }
  enemies.push(e);
  return e;
}

// ---------- fx ----------
function addTrauma(a) { trauma = Math.min(1, trauma + a); }
function freezeFor(t) {
  if (freezeCD > 0 && t < 0.1) return;
  freeze = Math.max(freeze, t); freezeCD = 0.09;
}
function sparks(x, y, n, col, a0, spread, smin, smax, life = 0.25, w = 2) {
  if (parts.length > 700) return;
  for (let i = 0; i < n; i++) {
    const a = a0 + rand(-spread, spread), s = rand(smin, smax);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.5, life), max: life, col, w });
  }
}
function shatter(x, y, r, col, n, dx, dy, pow) {
  if (shards.length > 300) n = Math.min(n, 3);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(120, 420) * pow;
    shards.push({
      x: x + Math.cos(a) * r * 0.4, y: y + Math.sin(a) * r * 0.4,
      vx: Math.cos(a) * s + dx * 220 * pow, vy: Math.sin(a) * s + dy * 220 * pow,
      rot: rand(0, TAU), rs: rand(-16, 16), life: rand(0.45, 0.9), max: 0.9, sz: r * rand(0.25, 0.55), col
    });
  }
}
function ring(x, y, r, R, life, col, w = 4, fill = false) { rings.push({ x, y, r, R, life, max: life, col, w, fill }); }
function popText(x, y, txt, size, col) {
  if (texts.length > 60) texts.shift();
  texts.push({ x: x + rand(-6, 6), y, vy: -90, txt, size, col, life: 0.5, max: 0.5 });
}
function screenFlash(col, a) { flashC = col; flashA = Math.max(flashA, a); }

// ---------- combat ----------
function comboMult() { return Math.min(5, 1 + Math.floor(combo / 10) * 0.25); }

function hitEnemy(e, dmg, dx, dy, canCrit = true) {
  if (e.dead) return;
  const crit = canCrit && Math.random() < P.crit;
  if (crit) dmg *= 3;
  e.hp -= dmg; e.flash = 0.07;
  const k = (crit ? 280 : 130) / e.mass;
  e.kx += dx * k; e.ky += dy * k;
  const back = Math.atan2(-dy, -dx);
  sparks(e.x - dx * e.r * 0.6, e.y - dy * e.r * 0.6, crit ? 9 : 3, crit ? '#ffffff' : e.col, back, 0.9, 200, crit ? 650 : 480, 0.22, crit ? 3 : 2);
  popText(e.x, e.y - e.r - 4, Math.round(dmg) + (crit ? '!' : ''), crit ? 22 : 14, crit ? '#ffe14d' : '#ffffff');
  addTrauma(crit ? 0.14 : 0.035);
  sfx.hit(crit);
  if (e.hp <= 0) killEnemy(e, dx, dy);
}

function killEnemy(e, dx, dy) {
  e.dead = true; kills++;
  const boss = e.type === 'boss', big = e.r >= 19;
  const sz = boss ? 1 : big ? 0.5 : 0.15;
  const n = boss ? 40 : e.sides > 0 ? e.sides * 3 : 6;
  shatter(e.x, e.y, e.r, e.col, n, dx, dy, boss ? 1.8 : 1);
  sparks(e.x, e.y, boss ? 60 : big ? 18 : 10, e.col, 0, Math.PI, 150, boss ? 1100 : 700, boss ? 0.6 : 0.3, 2.5);
  sparks(e.x, e.y, boss ? 30 : 6, '#ffffff', Math.atan2(dy, dx), 0.5, 300, 900, 0.25, 2);
  ring(e.x, e.y, e.r * 0.5, e.r * (boss ? 6 : 3.4), boss ? 0.6 : 0.28, e.col, boss ? 10 : 5);
  ring(e.x, e.y, 0, e.r * 1.6, 0.09, '#ffffff', 0, true);
  if (boss) {
    freezeFor(0.2); slowT = 0.9; addTrauma(1); screenFlash('#ffffff', 0.9); vib(120);
    ring(e.x, e.y, 0, 600, 0.9, COL.boss, 16);
    bossRef = null;
  } else {
    freezeFor(big ? 0.055 : 0.03); addTrauma(big ? 0.3 : 0.15); vib(big ? 22 : 9);
  }
  combo++; comboT = 1.7; comboPop = 1; maxCombo = Math.max(maxCombo, combo);
  const pts = Math.round(e.score * comboMult());
  score += pts;
  if (big || combo % 10 === 0) popText(e.x, e.y - e.r - 20, '+' + pts, big ? 18 : 15, COL.core);
  if (!odOn) od = Math.min(1, od + e.score / 420 * P.odGain);
  sfx.kill(sz);
  if (e.type === 'pent') {
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + (i - 1) * 1.1 + rand(-0.2, 0.2);
      const c = spawn('tri', e.x, e.y);
      c.kx = Math.cos(a) * 320; c.ky = Math.sin(a) * 320 - 80; c.hp = c.maxHp = c.maxHp * 0.6;
    }
  }
}

function explode(x, y, dmg, src) {
  const R = 26 + P.boom * 14;
  ring(x, y, 4, R, 0.2, '#ffb020', 4);
  ring(x, y, 0, R * 0.6, 0.07, '#fff3c0', 0, true);
  sparks(x, y, 6, '#ffb020', 0, Math.PI, 100, 400, 0.2, 2);
  for (const o of enemies) {
    if (o === src || o.dead) continue;
    const dx = o.x - x, dy = o.y - y, d = Math.hypot(dx, dy);
    if (d < R + o.r) hitEnemy(o, dmg, dx / (d || 1), dy / (d || 1), false);
  }
}

function chainFrom(e, dmg) {
  const hops = 1 + (P.chain >> 1);
  let cur = e; const hit = new Set([e]);
  for (let h = 0; h < hops; h++) {
    let best = null, bd = 170 * 170;
    for (const o of enemies) {
      if (o.dead || hit.has(o)) continue;
      const d = (o.x - cur.x) ** 2 + (o.y - cur.y) ** 2;
      if (d < bd) { bd = d; best = o; }
    }
    if (!best) break;
    const pts = [[cur.x, cur.y]];
    for (let i = 1; i < 6; i++) {
      const t = i / 6;
      pts.push([cur.x + (best.x - cur.x) * t + rand(-12, 12), cur.y + (best.y - cur.y) * t + rand(-12, 12)]);
    }
    pts.push([best.x, best.y]);
    bolts.push({ pts, life: 0.12, max: 0.12 });
    const d = Math.sqrt(bd) || 1;
    hit.add(best);
    hitEnemy(best, dmg, (best.x - cur.x) / d, (best.y - cur.y) / d, false);
    cur = best;
  }
}

function shoot() {
  const n = P.multi, spread = 0.085;
  for (let i = 0; i < n; i++) {
    const a = aimAng + (i - (n - 1) / 2) * spread + rand(-0.012, 0.012);
    const c = Math.cos(a), s = Math.sin(a);
    const bx = CX + c * 36, by = CY + s * 36;
    bullets.push({ x: bx, y: by, px: bx, py: by, vx: c * BS, vy: s * BS, dmg: 10 * P.dmg,
      pierce: P.pierce + (odOn ? 2 : 0), hit: new Set(), life: 0.9, dead: false });
  }
  recoil = 1; muzzle = 0.045;
  kickX -= Math.cos(aimAng) * 2.2; kickY -= Math.sin(aimAng) * 2.2;
  // ejected casing
  const pa = aimAng + Math.PI / 2 * (Math.random() < 0.5 ? 1 : -1);
  if (parts.length < 700) parts.push({ x: CX, y: CY, vx: Math.cos(pa) * rand(80, 160), vy: Math.sin(pa) * rand(80, 160), life: 0.3, max: 0.3, col: '#ffe14d', w: 2 });
  sfx.shoot();
}

function hurtCore(e) {
  e.dead = true;
  coreHp -= e.dmg; coreFlash = 0.25;
  shatter(e.x, e.y, e.r, e.col, 8, 0, -1, 1);
  ring(CX, CY, CORE_R, 140, 0.4, '#ff2a4a', 8);
  sparks(e.x, e.y, 20, '#ff2a4a', 0, Math.PI, 150, 600, 0.35, 3);
  addTrauma(0.65); screenFlash('#ff2a4a', 0.45); vib(60); sfx.core();
  freezeFor(0.08);
  combo = 0; comboT = 0;
  if (e === bossRef) bossRef = null;
  if (coreHp <= 0) {
    coreHp = 0; state = 'dying'; dyingT = 1.8; slowT = 1.8;
    shatter(CX, CY, 40, COL.core, 40, 0, 0, 2);
    sparks(CX, CY, 80, COL.core, 0, Math.PI, 200, 1200, 0.8, 3);
    ring(CX, CY, 10, 700, 1.2, COL.core, 14);
    addTrauma(1); screenFlash('#ffffff', 1); vib(300);
  }
}

function activateOD() {
  if (od < 1 || odOn || state !== 'play') return;
  odOn = true; odT = P.odDur; od = 1;
  sfx.od(); vib(80); addTrauma(0.8); freezeFor(0.12);
  screenFlash('#3cf2ff', 0.6);
  ring(CX, CY, CORE_R, LH * 1.2, 0.7, COL.core, 14);
  ring(CX, CY, CORE_R, LH * 0.8, 0.5, '#ffffff', 6);
  for (const e of enemies) {
    const dx = e.x - CX, dy = e.y - CY, d = Math.hypot(dx, dy) || 1;
    e.kx += dx / d * 900 / e.mass; e.ky += dy / d * 900 / e.mass;
    hitEnemy(e, 30 * P.dmg, dx / d, dy / d, false);
  }
}

// ---------- update ----------
function update(dt, rdt) {
  // ambient
  freezeCD -= rdt;
  const intensity = Math.min(1, combo / 40) + (odOn ? 1 : 0);
  const lineV = 260 * (1 + intensity * 2.5);
  for (const l of lines) {
    l.y += lineV * l.s * (dt || rdt * 0.05);
    if (l.y - l.l * 3 > LH) { l.y = -rand(0, 80); l.x = rand(0, LW); }
  }
  gridY = (gridY + lineV * 0.35 * dt) % 48;
  coreRot += dt * (odOn ? 4 : 1.2);

  updateFx(dt);

  if (state === 'dying') {
    dyingT -= rdt;
    updateEnemies(dt); updateBullets(dt);
    if (dyingT <= 0) gameOver();
    return;
  }
  if (state !== 'play') return;

  // spawn
  if (spawnQ.length) {
    spawnT -= dt;
    if (spawnT <= 0) {
      const it = spawnQ.shift();
      spawn(it.t, rand(30, LW - 30), -30);
      spawnT = spawnQ.length ? spawnQ[0].d : 0;
    }
  } else if (!enemies.length) {
    if (clearT === 0) { banner = { t: 0, text: 'CLEAR', col: '#4dff9a' }; sfx.wave(); }
    clearT += dt;
    if (clearT > 1.1) showUpgrade();
  }

  // combo
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  // overdrive
  if (odOn) { odT -= dt; od = Math.max(0, odT / P.odDur); if (odT <= 0) { odOn = false; od = 0; } }

  // aim + fire
  let tx = null, ty = null;
  if (pointer.down) { tx = pointer.x; ty = pointer.y; }
  else {
    let bestD = 1e12, tgt = null;
    for (const e of enemies) {
      if (e.dead || e.y < -e.r) continue;
      const d = (e.x - CX) ** 2 + (e.y - CY) ** 2;
      if (d < bestD) { bestD = d; tgt = e; }
    }
    if (tgt) {
      const tt = Math.sqrt(bestD) / BS;
      tx = tgt.x + (tgt.vx + tgt.kx) * tt; ty = tgt.y + (tgt.vy + tgt.ky) * tt;
    }
  }
  if (tx !== null) {
    const ta = Math.atan2(ty - CY, tx - CX);
    aimAng += wrapAng(ta - aimAng) * Math.min(1, 32 * dt);
    fireT -= dt;
    if (fireT <= 0) {
      shoot();
      fireT += 1 / (P.rate * (odOn ? 2.5 : 1));
      if (fireT < 0) fireT = 0;
    }
  } else fireT = Math.max(0, fireT - dt);

  updateEnemies(dt);
  updateBullets(dt);

  // blades
  if (P.blades) {
    bladeA += dt * 5.5;
    for (let i = 0; i < P.blades; i++) {
      const a = bladeA + i * TAU / P.blades;
      const bx = CX + Math.cos(a) * 80, by = CY + Math.sin(a) * 80;
      for (const e of enemies) {
        if (e.dead || e.bladeCD > 0) continue;
        if ((e.x - bx) ** 2 + (e.y - by) ** 2 < (e.r + 12) ** 2) {
          e.bladeCD = 0.22;
          const dx = e.x - CX, dy = e.y - CY, d = Math.hypot(dx, dy) || 1;
          hitEnemy(e, 18 * P.dmg, dx / d, dy / d);
        }
      }
    }
  }
}

function updateEnemies(dt) {
  const eS = odOn ? 0.45 : 1;
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt; e.flash -= dt; e.bladeCD -= dt; e.rot += e.rs * dt;
    const dx = CX - e.x, dy = CY - e.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    let vx = ux * e.sp, vy = uy * e.sp;
    if (e.type === 'tri') {
      const w = Math.sin(e.t * 4.5 + e.ph) * 0.75;
      vx = (ux - uy * w) * e.sp; vy = (uy + ux * w) * e.sp;
    } else if (e.type === 'dash') {
      if (e.mode === 0) { if (e.y > LH * 0.28) { e.mode = 1; e.st = 0.6; sfx.charge(); } }
      else if (e.mode === 1) { vx = vy = 0; e.st -= dt; if (e.st <= 0) { e.mode = 2; e.dx = ux; e.dy = uy; } }
      else { vx = e.dx * 640; vy = e.dy * 640; }
    } else if (e.type === 'boss') {
      if (e.y < LH * 0.2) { vx = 0; vy = 60; }
      else { vx = Math.cos(e.t * 0.7) * 40; vy = 7 + (1 - e.hp / e.maxHp) * 6; }
      e.spawnCD -= dt;
      if (e.spawnCD <= 0) {
        e.spawnCD = e.hp < e.maxHp / 2 ? 1.1 : 1.7;
        for (let i = 0; i < 2; i++) {
          const c = spawn('tri', e.x + (i ? 30 : -30), e.y + 20);
          c.kx = (i ? 1 : -1) * 260; c.ky = 120;
        }
        ring(e.x, e.y, e.r, e.r * 1.6, 0.25, COL.boss, 3);
      }
    }
    e.vx = vx * eS; e.vy = vy * eS;
    e.x += (e.vx + e.kx) * dt; e.y += (e.vy + e.ky) * dt;
    const kd = Math.exp(-9 * dt); e.kx *= kd; e.ky *= kd;
    e.x = clamp(e.x, e.r, LW - e.r);
    if (d < e.r + CORE_R && state === 'play') hurtCore(e);
  }
  enemies = enemies.filter(e => !e.dead);
}

function updateBullets(dt) {
  for (const b of bullets) {
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of enemies) {
      if (e.dead || b.hit.has(e)) continue;
      if (segDist2(b.px, b.py, b.x, b.y, e.x, e.y) < (e.r + 3) ** 2) {
        b.hit.add(e);
        const dx = b.vx / BS, dy = b.vy / BS;
        hitEnemy(e, b.dmg, dx, dy);
        if (P.boom) explode(e.x - dx * e.r * 0.5, e.y - dy * e.r * 0.5, b.dmg * 0.55, e);
        if (P.chain && Math.random() < Math.min(0.75, P.chain * 0.15)) chainFrom(e, b.dmg * 0.7);
        if (b.pierce-- <= 0) { b.dead = true; break; }
      }
    }
    if (b.life <= 0 || b.x < -40 || b.x > LW + 40 || b.y < -60 || b.y > LH + 40) b.dead = true;
  }
  bullets = bullets.filter(b => !b.dead);
}

function updateFx(dt) {
  for (const p of parts) {
    const k = Math.exp(-5 * dt);
    p.vx *= k; p.vy *= k; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const s of shards) {
    const k = Math.exp(-3 * dt);
    s.vx *= k; s.vy *= k; s.vy += 260 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.rs * dt; s.life -= dt;
  }
  shards = shards.filter(s => s.life > 0);
  for (const r of rings) r.life -= dt;
  rings = rings.filter(r => r.life > 0);
  for (const b of bolts) b.life -= dt;
  bolts = bolts.filter(b => b.life > 0);
  for (const t of texts) { t.y += t.vy * dt; t.vy *= Math.exp(-4 * dt); t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  if (banner) { banner.t += dt; if (banner.t > 1.3) banner = null; }
}

// ---------- render ----------
function initLines() {
  lines = [];
  for (let i = 0; i < 70; i++) lines.push({ x: rand(0, LW), y: rand(-80, LH), l: rand(10, 60), s: rand(0.5, 1.6) });
}

function shapePath(x, y, r, sides, rot) {
  ctx.beginPath();
  if (sides === 0) { ctx.arc(x, y, r, 0, TAU); return; }
  if (sides === -1) {
    const c = Math.cos(rot), s = Math.sin(rot);
    const pts = [[r * 1.5, 0], [0, r * 0.75], [-r * 0.9, 0], [0, -r * 0.75]];
    pts.forEach(([px, py], i) => {
      const X = x + px * c - py * s, Y = y + px * s + py * c;
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    });
    ctx.closePath(); return;
  }
  for (let i = 0; i < sides; i++) {
    const a = rot + i * TAU / sides, X = x + Math.cos(a) * r, Y = y + Math.sin(a) * r;
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  }
  ctx.closePath();
}

function glowStroke(col, w) {
  ctx.strokeStyle = col;
  ctx.globalAlpha = 0.22; ctx.lineWidth = w * 3.2; ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = w; ctx.stroke();
}

function drawEnemy(e) {
  const fl = e.flash > 0 ? e.flash / 0.07 : 0;
  const sp = Math.hypot(e.vx + e.kx, e.vy + e.ky);
  if (sp > 110) {
    ctx.globalAlpha = 0.22; ctx.strokeStyle = e.col; ctx.lineWidth = e.r * 0.9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(e.x, e.y);
    ctx.lineTo(e.x - (e.vx + e.kx) * 0.09, e.y - (e.vy + e.ky) * 0.09); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  let x = e.x, y = e.y;
  if (e.type === 'dash' && e.mode === 1) {
    x += rand(-2.5, 2.5); y += rand(-2.5, 2.5);
    const blink = (e.t * 14 | 0) % 2;
    ctx.setLineDash([8, 8]); ctx.lineDashOffset = -e.t * 120;
    ctx.strokeStyle = blink ? '#ff2a4a' : COL.dash; ctx.globalAlpha = 0.6; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(CX, CY); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  const r = e.r * (1 + fl * 0.25);
  let rot = e.rot;
  if (e.type === 'tri') rot = Math.atan2(e.vy, e.vx);
  else if (e.type === 'dash') rot = e.mode === 2 ? Math.atan2(e.dy, e.dx) : Math.atan2(CY - e.y, CX - e.x);
  shapePath(x, y, r, e.sides, rot);
  if (fl > 0) { ctx.fillStyle = '#ffffff'; ctx.fill(); }
  else { ctx.fillStyle = e.col + '2a'; ctx.fill(); }
  glowStroke(fl > 0 ? '#ffffff' : e.col, e.type === 'boss' ? 4 : 2.5);
  ctx.lineJoin = 'round';
  if (e.r >= 19) {
    shapePath(x, y, r * 0.48, e.sides, -rot * 1.6);
    ctx.lineWidth = 2; ctx.strokeStyle = fl > 0 ? '#fff' : e.col; ctx.stroke();
  }
  if (e.type === 'boss') {
    for (let i = 0; i < 4; i++) {
      const a = e.t * 2 + i * TAU / 4;
      shapePath(x + Math.cos(a) * (r + 18), y + Math.sin(a) * (r + 18), 6, 4, a);
      ctx.fillStyle = COL.boss; ctx.fill();
    }
  } else if (e.hp < e.maxHp && e.r >= 14) {
    const w = e.r * 2;
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(e.x - w / 2, e.y + e.r + 7, w, 3);
    ctx.fillStyle = e.col; ctx.fillRect(e.x - w / 2, e.y + e.r + 7, w * Math.max(0, e.hp / e.maxHp), 3);
  }
}

function drawCore() {
  const hit = coreFlash > 0;
  // orbit + blades
  if (P && P.blades) {
    ctx.beginPath(); ctx.arc(CX, CY, 80, 0, TAU);
    ctx.strokeStyle = 'rgba(60,242,255,.08)'; ctx.lineWidth = 18; ctx.stroke();
    for (let i = 0; i < P.blades; i++) {
      const a = bladeA + i * TAU / P.blades;
      const bx = CX + Math.cos(a) * 80, by = CY + Math.sin(a) * 80;
      ctx.beginPath(); ctx.arc(CX, CY, 80, a - 0.5, a); ctx.strokeStyle = 'rgba(60,242,255,.35)'; ctx.lineWidth = 3; ctx.stroke();
      shapePath(bx, by, 11, 3, a + Math.PI / 2);
      ctx.fillStyle = '#e8feff'; ctx.fill(); glowStroke(COL.core, 2);
    }
  }
  // hp ring
  const hpf = coreHp / coreMax;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(CX, CY, 46, 0, TAU); ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, 46, -Math.PI / 2, -Math.PI / 2 + TAU * hpf);
  ctx.strokeStyle = hpf < 0.3 ? '#ff2a4a' : COL.core; ctx.lineWidth = 4; ctx.stroke();
  // body
  shapePath(CX, CY, 30, 6, coreRot);
  ctx.fillStyle = hit ? '#ff2a4a' : 'rgba(60,242,255,.12)'; ctx.fill();
  glowStroke(hit ? '#ffffff' : COL.core, 2.5);
  shapePath(CX, CY, 18, 6, -coreRot * 1.5);
  ctx.strokeStyle = COL.core; ctx.lineWidth = 1.5; ctx.stroke();
  // barrel
  ctx.save(); ctx.translate(CX, CY); ctx.rotate(aimAng);
  const rec = recoil * 8;
  ctx.fillStyle = odOn ? '#ffffff' : COL.core;
  ctx.fillRect(6 - rec, -5.5, 32, 11);
  ctx.fillStyle = '#07080f'; ctx.fillRect(28 - rec, -2, 10, 4);
  if (muzzle > 0) {
    ctx.globalCompositeOperation = 'lighter';
    const m = muzzle / 0.045, L = 26 + Math.random() * 14;
    ctx.fillStyle = `rgba(200,255,255,${m})`;
    ctx.beginPath(); ctx.moveTo(38 - rec, -7 * m); ctx.lineTo(38 - rec + L, 0); ctx.lineTo(38 - rec, 7 * m); ctx.fill();
    ctx.beginPath(); ctx.arc(40 - rec, 0, 9 * m, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(CX, CY, 8 + Math.sin(coreRot * 3) * 1.5, 0, TAU);
  ctx.fillStyle = hit ? '#ffffff' : COL.core; ctx.fill();
}

function render(rdt) {
  // timers driven by real time
  trauma = Math.max(0, trauma - rdt * 1.5);
  flashA = Math.max(0, flashA - rdt * 3.5);
  const kk = Math.exp(-22 * rdt); kickX *= kk; kickY *= kk;
  recoil = Math.max(0, recoil - rdt * 12);
  muzzle -= rdt; coreFlash -= rdt;
  comboPop = Math.max(0, comboPop - rdt * 7);
  shownScore += (score - shownScore) * Math.min(1, rdt * 12);
  if (Math.abs(score - shownScore) < 1) shownScore = score;

  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  // background
  ctx.fillStyle = odOn ? '#0b0718' : '#07080f';
  ctx.fillRect(0, 0, LW, LH);

  const s2 = trauma * trauma;
  const ox = rand(-1, 1) * 16 * s2 + kickX, oy = rand(-1, 1) * 16 * s2 + kickY;
  ctx.save();
  ctx.translate(LW / 2 + ox, LH / 2 + oy); ctx.rotate(rand(-1, 1) * 0.035 * s2); ctx.translate(-LW / 2, -LH / 2);

  // grid
  ctx.strokeStyle = odOn ? 'rgba(179,107,255,.09)' : 'rgba(60,242,255,.05)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= LW; x += 48) { ctx.moveTo(x + 0.5, -40); ctx.lineTo(x + 0.5, LH + 40); }
  for (let y = gridY - 48; y < LH + 48; y += 48) { ctx.moveTo(-20, y); ctx.lineTo(LW + 20, y); }
  ctx.stroke();

  // speed lines
  const intensity = Math.min(1, (combo || 0) / 40) + (odOn ? 1 : 0);
  ctx.lineWidth = 1.5; ctx.lineCap = 'butt';
  for (const l of lines) {
    ctx.strokeStyle = odOn ? `rgba(200,140,255,${0.1 + l.s * 0.15})` : `rgba(160,230,255,${0.05 + l.s * 0.1})`;
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y - l.l * (1 + intensity * 2.5)); ctx.stroke();
  }

  // danger line
  ctx.setLineDash([4, 10]);
  ctx.strokeStyle = 'rgba(255,42,74,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, 120, Math.PI, TAU); ctx.stroke();
  ctx.setLineDash([]);

  // rings
  for (const r of rings) {
    const k = 1 - r.life / r.max, e = 1 - (1 - k) * (1 - k) * (1 - k);
    const rad = r.r + (r.R - r.r) * e;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU);
    if (r.fill) { ctx.globalAlpha = r.life / r.max; ctx.fillStyle = r.col; ctx.fill(); }
    else { ctx.globalAlpha = r.life / r.max; ctx.strokeStyle = r.col; ctx.lineWidth = r.w * (r.life / r.max) + 0.5; ctx.stroke(); }
  }
  ctx.globalAlpha = 1;

  // enemies
  ctx.lineJoin = 'round';
  for (const e of enemies) if (!e.dead) drawEnemy(e);

  // bolts
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bolts) {
    ctx.globalAlpha = b.life / b.max;
    ctx.beginPath(); b.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.strokeStyle = '#8fd8ff'; ctx.lineWidth = 6; ctx.globalAlpha *= 0.4; ctx.stroke();
    ctx.globalAlpha = b.life / b.max; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // bullets
  ctx.lineCap = 'round';
  for (const b of bullets) {
    const tx = b.x - b.vx * 0.02, ty = b.y - b.vy * 0.02;
    ctx.strokeStyle = odOn ? 'rgba(220,160,255,.55)' : 'rgba(60,242,255,.5)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  if (state !== 'over' && state !== 'dying') drawCore();

  // shards
  for (const s of shards) {
    ctx.globalAlpha = Math.min(1, s.life / s.max * 1.5);
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.beginPath(); ctx.moveTo(s.sz, 0); ctx.lineTo(-s.sz * 0.6, s.sz * 0.55); ctx.lineTo(-s.sz * 0.4, -s.sz * 0.6); ctx.closePath();
    ctx.fillStyle = s.col; ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // sparks
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const p of parts) {
    const a = p.life / p.max;
    ctx.globalAlpha = a; ctx.strokeStyle = p.col; ctx.lineWidth = p.w * (0.4 + a * 0.6);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // damage text
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const age = t.max - t.life, sc = age < 0.08 ? 1.7 - age / 0.08 * 0.7 : 1;
    ctx.globalAlpha = Math.min(1, t.life / t.max * 2.5);
    ctx.font = `900 ${Math.round(t.size * sc)}px ${F}`;
    ctx.lineWidth = 4; ctx.strokeStyle = '#07080f'; ctx.strokeText(t.txt, t.x, t.y);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state === 'play' || state === 'dying' || state === 'upgrade') drawHUD();
  drawBanner();

  // overlays
  if (P && coreHp / coreMax < 0.3 && state === 'play') {
    const pulse = 0.35 + Math.sin(performance.now() / 160) * 0.15;
    const g = ctx.createRadialGradient(LW / 2, LH / 2, LH * 0.3, LW / 2, LH / 2, LH * 0.75);
    g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, `rgba(255,0,40,${pulse})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  }
  if (odOn) {
    ctx.strokeStyle = `rgba(179,107,255,${0.5 + Math.sin(performance.now() / 60) * 0.3})`;
    ctx.lineWidth = 6; ctx.strokeRect(3, 3, LW - 6, LH - 6);
  }
  if (flashA > 0) { ctx.globalAlpha = flashA * 0.55; ctx.fillStyle = flashC; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = 1; }
}

function drawHUD() {
  const top = 16;
  ctx.textBaseline = 'top';
  // wave
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = `800 11px ${F}`; ctx.fillText('WAVE', 16, top);
  ctx.fillStyle = '#ffffff'; ctx.font = `900 28px ${F}`; ctx.fillText(wave, 16, top + 13);
  // score
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = `800 11px ${F}`; ctx.fillText('SCORE', LW / 2, top);
  ctx.fillStyle = '#ffffff'; ctx.font = `900 30px ${F}`; ctx.fillText(Math.round(shownScore).toLocaleString(), LW / 2, top + 13);
  // combo
  if (combo >= 2) {
    const m = comboMult();
    const col = m >= 3 ? '#ff3d7f' : m >= 2 ? '#ffb020' : m > 1 ? '#4dff9a' : '#3cf2ff';
    ctx.save(); ctx.translate(LW / 2, top + 66);
    const s = 1 + comboPop * 0.45; ctx.scale(s, s); ctx.rotate(-0.06);
    ctx.textBaseline = 'middle';
    ctx.font = `italic 900 26px ${F}`;
    ctx.lineWidth = 5; ctx.strokeStyle = '#07080f'; ctx.strokeText(combo + ' COMBO', 0, 0);
    ctx.fillStyle = col; ctx.fillText(combo + ' COMBO', 0, 0);
    ctx.font = `900 13px ${F}`; ctx.fillStyle = '#ffffff'; ctx.fillText('×' + m.toFixed(2), 0, 22);
    ctx.restore();
    ctx.fillStyle = col; ctx.fillRect(LW / 2 - 50, top + 98, 100 * clamp(comboT / 1.7, 0, 1), 3);
  }
  // boss bar
  if (bossRef && !bossRef.dead) {
    const w = LW - 60, y = top + 110;
    ctx.fillStyle = 'rgba(255,42,74,.18)'; ctx.fillRect(30, y, w, 8);
    ctx.fillStyle = COL.boss; ctx.fillRect(30, y, w * Math.max(0, bossRef.hp / bossRef.maxHp), 8);
    ctx.fillStyle = '#ffffff'; ctx.font = `900 11px ${F}`; ctx.textAlign = 'left'; ctx.fillText('HEXA CORE', 30, y + 12);
  }
  // wave progress
  if (spawnQ) {
    const total = 12 + wave * 5 + (wave % 5 === 0 ? 1 : 0);
    const left = spawnQ.length + enemies.length;
    ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(16, top + 48, 60, 3);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(16, top + 48, 60 * clamp(1 - left / total, 0, 1), 3);
  }
  // core hp text
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = `800 11px ${F}`; ctx.fillStyle = coreHp / coreMax < 0.3 ? '#ff2a4a' : 'rgba(255,255,255,.6)';
  ctx.fillText(Math.ceil(coreHp) + ' / ' + coreMax, CX, CY + 54);
  // OD button
  const { x, y, r } = OD_BTN, full = od >= 1 && !odOn;
  const t = performance.now() / 1000;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = full ? `rgba(179,107,255,${0.35 + Math.sin(t * 10) * 0.15})` : 'rgba(255,255,255,.05)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * od);
  ctx.strokeStyle = odOn ? '#ffffff' : '#b36bff'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  if (full) { ctx.beginPath(); ctx.arc(x, y, r + 6 + (t * 30 % 12), 0, TAU); ctx.strokeStyle = 'rgba(179,107,255,.5)'; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.textBaseline = 'middle';
  ctx.fillStyle = full || odOn ? '#ffffff' : 'rgba(255,255,255,.45)';
  ctx.font = `italic 900 18px ${F}`; ctx.fillText('OD', x, y - 2);
  ctx.font = `800 9px ${F}`; ctx.fillText(odOn ? odT.toFixed(1) + 's' : Math.floor(od * 100) + '%', x, y + 14);
}

function drawBanner() {
  if (!banner) return;
  const t = banner.t;
  let x;
  if (t < 0.18) { const k = t / 0.18; x = LW * 1.6 - (LW * 1.1) * (1 - (1 - k) ** 3); }
  else if (t < 1.0) x = LW / 2 - (t - 0.18) * 30;
  else { const k = (t - 1.0) / 0.3; x = LW / 2 - 24.6 - k * k * LW * 1.4; }
  const y = LH * 0.38;
  ctx.save();
  // streak band
  ctx.globalAlpha = 0.9; ctx.fillStyle = banner.col;
  ctx.fillRect(0, y - 1, LW, 2);
  ctx.globalAlpha = 0.12; ctx.fillRect(0, y - 34, LW, 68);
  ctx.globalAlpha = 1;
  ctx.translate(x, y); ctx.transform(1, 0, -0.22, 1, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 54px ${F}`;
  ctx.fillStyle = banner.col; ctx.globalAlpha = 0.35; ctx.fillText(banner.text, 14, 0);
  ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff'; ctx.fillText(banner.text, 0, 0);
  ctx.restore();
}

// ---------- UI ----------
const UPS = [
  { id: 'rate',   name: '急速射擊', desc: '射速 +25%',                 col: '#3cf2ff', sh: 3,  apply: () => P.rate *= 1.25 },
  { id: 'dmg',    name: '重型彈頭', desc: '傷害 +30%',                 col: '#ffb020', sh: 4,  apply: () => P.dmg *= 1.3 },
  { id: 'multi',  name: '散射',     desc: '子彈 +1 道',                col: '#4dff9a', sh: 3,  max: 6, apply: () => P.multi++ },
  { id: 'pierce', name: '穿甲',     desc: '子彈可多穿透 1 個敵人',     col: '#ffffff', sh: -1, max: 5, apply: () => P.pierce++ },
  { id: 'boom',   name: '爆裂彈',   desc: '命中時引發小爆炸，範圍提升', col: '#ff7a3d', sh: 0,  max: 5, apply: () => P.boom++ },
  { id: 'chain',  name: '連鎖電弧', desc: '命中時 +15% 機率電擊彈跳',   col: '#8fd8ff', sh: 5,  max: 5, apply: () => P.chain++ },
  { id: 'blades', name: '環刃',     desc: '核心外圍 +1 把旋轉刃',       col: '#3cf2ff', sh: 3,  max: 6, apply: () => P.blades++ },
  { id: 'crit',   name: '致命一擊', desc: '暴擊率 +12%（3 倍傷害）',    col: '#ffe14d', sh: 4,  max: 5, apply: () => P.crit += 0.12 },
  { id: 'heal',   name: '核心修復', desc: '上限 +15，並回復 40% 生命',  col: '#ff3d7f', sh: 6,  apply: () => { coreMax += 15; coreHp = Math.min(coreMax, coreHp + coreMax * 0.4); } },
  { id: 'od',     name: '超載電容', desc: '超載 +2 秒，充能 +25%',      col: '#b36bff', sh: 6,  max: 4, apply: () => { P.odDur += 2; P.odGain *= 1.25; } }
];
function svgShape(sh, col) {
  if (sh === 0) return `<circle r="8" fill="${col}33" stroke="${col}" stroke-width="2"/>`;
  let pts;
  if (sh === -1) pts = [[0, -10], [6, 0], [0, 10], [-6, 0]];
  else pts = Array.from({ length: sh }, (_, i) => { const a = -Math.PI / 2 + i * TAU / sh; return [Math.cos(a) * 9, Math.sin(a) * 9]; });
  return `<polygon points="${pts.map(p => p.map(v => v.toFixed(2)).join(',')).join(' ')}" fill="${col}33" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
}
let upReady = 0;
function showUpgrade() {
  state = 'upgrade'; pointer.down = false; bullets = [];
  const pool = UPS.filter(u => !u.max || (lv[u.id] || 0) < u.max);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const picks = pool.slice(0, 3);
  const box = $('cards'); box.innerHTML = '';
  $('upT').textContent = 'WAVE ' + wave + ' CLEAR';
  picks.forEach((u, i) => {
    const b = document.createElement('button');
    b.className = 'card'; b.style.setProperty('--c', u.col); b.style.animationDelay = (i * 0.07) + 's';
    b.innerHTML = `<svg viewBox="-12 -12 24 24">${svgShape(u.sh, u.col)}</svg><div><b>${u.name}</b><span>${u.desc}</span></div><i>Lv.${(lv[u.id] || 0) + 1}</i>`;
    b.addEventListener('click', () => {
      if (state !== 'upgrade' || performance.now() < upReady) return;
      u.apply(); lv[u.id] = (lv[u.id] || 0) + 1;
      sfx.pick(); $('ovUp').classList.remove('on');
      nextWave();
    });
    box.appendChild(b);
  });
  upReady = performance.now() + 350;
  $('ovUp').classList.add('on');
}

function gameOver() {
  state = 'over';
  const isNew = score > best;
  if (isNew) { best = score; store.set('ch_best', best); }
  $('goScore').textContent = score.toLocaleString();
  $('goNew').innerHTML = isNew ? '<div class="new">NEW BEST!</div>' : '';
  $('goStats').innerHTML = `<span>到達波數</span><b>${wave}</b><span>擊破數</span><b>${kills}</b><span>最高連擊</span><b>${maxCombo}</b><span>最佳分數</span><b>${best.toLocaleString()}</b>`;
  $('ovOver').classList.add('on');
}

function updateBest() { $('bestT').textContent = best ? 'BEST ' + best.toLocaleString() : ''; }

function startGame() {
  initAudio();
  $('ovTitle').classList.remove('on'); $('ovOver').classList.remove('on');
  newGame();
}
$('bStart').addEventListener('click', startGame);
$('bAgain').addEventListener('click', startGame);
$('bPause').addEventListener('click', () => {
  if (state !== 'play' && state !== 'upgrade') return;
  paused = true; pointer.down = false; $('ovPause').classList.add('on');
});
$('bResume').addEventListener('click', () => { paused = false; $('ovPause').classList.remove('on'); });
function syncMute() { $('bMute').textContent = muted ? '✕' : '♪'; $('bMute').style.opacity = muted ? .5 : 1; }
$('bMute').addEventListener('click', () => { initAudio(); muted = !muted; store.set('ch_muted', muted); syncMute(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play' && !paused) { paused = true; pointer.down = false; $('ovPause').classList.add('on'); }
});

// ---------- input ----------
function toLocal(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * LW, y: (ev.clientY - r.top) / r.height * LH };
}
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault(); initAudio();
  if (state !== 'play' || paused) return;
  const p = toLocal(ev);
  if (Math.hypot(p.x - OD_BTN.x, p.y - OD_BTN.y) < OD_BTN.r + 14) { activateOD(); return; }
  pointer.down = true; pointer.id = ev.pointerId; pointer.x = p.x; pointer.y = p.y;
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
});
cv.addEventListener('pointermove', ev => {
  if (!pointer.down || ev.pointerId !== pointer.id) return;
  const p = toLocal(ev); pointer.x = p.x; pointer.y = p.y;
});
const up = ev => { if (ev.pointerId === pointer.id) pointer.down = false; };
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => { if (e.code === 'Space') activateOD(); });

// ---------- loop ----------
let last = performance.now();
function loop(now) {
  const rdt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) {
    let dt = rdt;
    if (freeze > 0) { freeze -= rdt; dt = 0; }
    else if (slowT > 0) { slowT -= rdt; dt *= 0.3; }
    update(dt, rdt);
  }
  render(paused ? 0 : rdt);
  requestAnimationFrame(loop);
}
resize(); syncMute(); updateBest();
requestAnimationFrame(loop);

// test hook
window.__CH = { get state() { return state; }, get enemies() { return enemies.length; }, get wave() { return wave; },
  get score() { return score; }, setOD() { od = 1; }, die() { coreHp = 1; hurtCore(spawn('sq', CX, CY - 10)); }, get boss() { return !!bossRef; }, showUpgrade, skip() { spawnQ = []; enemies = []; } };
})();
</script>
</body>
