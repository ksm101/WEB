<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>燼潮 沉鐘塔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one portrait screen. Battlefield fills the top, a thumb deck (drag to move + four seals) sits below. */
:root{
  color-scheme:dark;
  --ink:#0a161b; --deep:#10252d; --slate:#1a3540; --line:#2f525e; --glow:#1f4450;
  --foam:#dcefe9; --mute:#8db0ac;
  --ember:#ff8243; --brass:#e3bd6a; --danger:#ff4f64; --heal:#62d99a; --tank:#74abff; --hex:#b193ff; --rust:#b9552f;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-num:"Chakra Petch",ui-monospace,"SF Mono",monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--foam);font-family:var(--f-body);font-size:14px;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--ink)}

/* ---------- HUD ---------- */
#hud{padding-block:8px 6px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:6px;background:var(--deep);border-bottom:1px solid var(--line)}
.hud-top{display:flex;align-items:center;gap:10px}
#quit{min-width:44px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--mute);font-size:12px}
.dungeon{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.dungeon b{font-family:var(--f-display);font-size:16px;letter-spacing:.08em}
.dungeon span{font-size:11px;color:var(--mute)}
#pips{display:flex;gap:6px;align-items:center;margin-left:auto}
#pips i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);display:block}
#pips i.boss{border-radius:1px;transform:rotate(45deg);width:9px;height:9px}
#pips i.now{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,130,67,.22)}
#pips i.done{background:var(--brass);border-color:var(--brass)}
#timer{font-family:var(--f-num);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;min-width:108px;text-align:right}
#timer small{font-size:12px;color:var(--mute);font-weight:500}
#timer.late{color:var(--danger)}
#timebar{height:3px;background:var(--slate);border-radius:2px;overflow:hidden}
#timebar i{display:block;height:100%;width:0;background:var(--brass)}
#timebar.late i{background:var(--danger)}
#party{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pf{position:relative;display:flex;flex-direction:column;gap:4px;padding:5px 6px 6px;border:1px solid var(--line);border-radius:6px;background:var(--slate);text-align:left;min-width:0}
.pf.me{border-color:var(--brass)}
.pf.down{opacity:.45}
.pf.low .hp i{background:var(--danger)}
.pf .nm{display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;overflow:hidden}
.pf .nm em{font-style:normal;font-family:var(--f-display);font-weight:900;font-size:12px}
.pf .nm span{overflow:hidden;text-overflow:ellipsis}
.pf .nm u{margin-left:auto;text-decoration:none;font-family:var(--f-num);font-size:9px;letter-spacing:.06em;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 3px}
.pf.me .nm u{color:var(--brass);border-color:var(--brass)}
.pf .hp{height:6px;border-radius:3px;background:var(--ink);overflow:hidden}
.pf .hp i{display:block;height:100%;width:100%;background:var(--heal)}

/* ---------- Stage ---------- */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#bossbar{position:absolute;top:8px;left:var(--gl);right:var(--gr);display:flex;flex-direction:column;gap:3px;pointer-events:none}
#bossbar .bn{display:flex;justify-content:space-between;font-size:12px;text-shadow:0 1px 2px var(--ink)}
#bossbar .bn b{font-family:var(--f-display);letter-spacing:.06em}
#bossbar .bn span{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--mute)}
#bossbar .bh{height:9px;border:1px solid var(--rust);border-radius:2px;background:rgba(10,22,27,.8);overflow:hidden}
#bossbar .bh i{display:block;height:100%;background:var(--rust)}
#bosscast{height:16px;border:1px solid var(--line);border-radius:2px;background:rgba(10,22,27,.85);overflow:hidden;position:relative;font-size:11px}
#bosscast i{position:absolute;inset:0 auto 0 0;background:var(--line)}
#bosscast.kick{border-color:var(--brass)}
#bosscast.kick i{background:var(--brass)}
#bosscast span{position:relative;display:block;text-align:center;line-height:14px;font-weight:700;color:var(--foam);text-shadow:0 1px 2px var(--ink)}
#bosscast.kick span{color:var(--ink);text-shadow:none}
#banner{position:absolute;left:var(--gl);right:var(--gr);top:26%;text-align:center;font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.12em;
  color:var(--brass);text-shadow:0 2px 0 var(--ink),0 0 18px rgba(10,22,27,.9);pointer-events:none;transition:opacity .3s}
#banner.off{opacity:0}

/* ---------- Thumb deck ---------- */
#deck{position:relative;height:clamp(196px,34%,280px);background:var(--deep);border-top:1px solid var(--line);padding-left:var(--gl);padding-right:var(--gr);touch-action:none}
#stick-hint{position:absolute;left:var(--gl);bottom:18px;margin:0;font-size:12px;color:var(--mute);pointer-events:none;max-width:120px;line-height:1.5}
#stick-base{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:1.5px solid var(--line);background:rgba(26,53,64,.6);pointer-events:none}
#stick-nub{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--foam);opacity:.85}
#skills{position:absolute;right:var(--gr);bottom:14px;width:200px;height:200px;pointer-events:none}
.sk{position:absolute;pointer-events:auto;width:60px;height:60px;border-radius:50%;border:2px solid var(--line);background:var(--slate);color:var(--foam);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;overflow:hidden;touch-action:none}
.sk b{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.05}
.sk small{font-size:9px;color:var(--mute);line-height:1.1}
.sk::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(6,14,18,.82) calc(var(--cd,0)*1turn),transparent 0);pointer-events:none}
.sk .cdn{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--foam);pointer-events:none}
.sk.main{width:88px;height:88px;right:0;bottom:0;border-color:var(--ember)}
.sk.main b{font-size:34px;color:var(--ember)}
.sk.main small{font-size:11px}
.sk.s1{left:18px;top:122px}
.sk.s2{left:48px;top:48px}
.sk.s3{left:122px;top:18px}
.sk.alert{border-color:var(--brass);box-shadow:0 0 0 4px rgba(227,189,106,.35);animation:pulse .5s ease-in-out infinite alternate}
.sk.alert b{color:var(--brass)}
.sk.ult.ready{border-color:var(--brass);box-shadow:0 0 14px rgba(227,189,106,.6)}
.sk.ult.ready b{color:var(--brass)}
.sk:active{transform:scale(.94)}
.sk.cool b,.sk.cool small{opacity:.25}
@keyframes pulse{to{box-shadow:0 0 0 9px rgba(227,189,106,.12)}}
@media (prefers-reduced-motion:reduce){.sk.alert{animation:none}#banner{transition:none}}

/* ---------- Overlays ---------- */
.overlay{position:absolute;inset:0;z-index:5;overflow-y:auto;touch-action:pan-y;background:radial-gradient(130% 55% at 50% 0%,var(--glow) 0%,var(--ink) 72%)}
.wrap{min-height:100%;box-sizing:border-box;padding-block:22px 20px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--mute);margin:0}
h1{font-family:var(--f-display);font-weight:900;font-size:68px;line-height:1;margin:2px 0 0;letter-spacing:.06em;color:var(--ember);text-wrap:balance}
h2{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1.1;margin:0;letter-spacing:.08em;text-wrap:balance}
.lore{margin:0;color:var(--mute);line-height:1.7;max-width:30em}
.run{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.run b{font-family:var(--f-display);font-size:20px;letter-spacing:.08em}
.run span{color:var(--brass);font-family:var(--f-num);font-weight:700}
.run small{margin-left:auto;color:var(--mute);font-family:var(--f-num)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--deep)}
.card b{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1.1}
.card span{font-size:14px;font-weight:700}
.card small{font-size:11px;color:var(--mute)}
.card[aria-pressed="true"]{border-color:var(--brass);background:var(--slate)}
.kit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.kit li{display:grid;grid-template-columns:30px 5em minmax(0,1fr);gap:8px;align-items:baseline}
.kit em{font-style:normal;font-family:var(--f-display);font-weight:900;font-size:18px;color:var(--brass);text-align:center}
.kit b{font-size:13px}
.kit span{font-size:12px;color:var(--mute);line-height:1.5}
.gear{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin:0}
.gear b{font-family:var(--f-num);color:var(--foam)}
.cta{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.btn{height:54px;border-radius:8px;border:0;background:var(--ember);color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.2em}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--foam);height:46px;font-size:15px}
.note{margin:0;font-size:11px;color:var(--mute);text-align:center;line-height:1.6}
.how{margin:0;padding:10px 12px;border-left:2px solid var(--brass);background:var(--deep);font-size:12px;line-height:1.8;color:var(--foam)}
.clock{font-family:var(--f-num);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.verdict{margin:0;font-size:14px}
.verdict.good{color:var(--brass)} .verdict.bad{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0}
.stats div{background:var(--deep);padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.stats dt{font-size:11px;color:var(--mute)}
.stats dd{margin:0;font-family:var(--f-num);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.loot{border:1.5px solid var(--brass);border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:12px;background:var(--deep)}
.loot .il{font-family:var(--f-num);font-weight:700;font-size:30px;color:var(--brass)}
.loot div{display:flex;flex-direction:column;gap:2px;min-width:0}
.loot b{font-family:var(--f-display);font-size:16px}
.loot small{font-size:12px;color:var(--mute)}
</style>

<div id="app">
  <header id="hud">
    <div class="hud-top">
      <button id="quit" type="button">離開</button>
      <div class="dungeon"><b>沉鐘塔</b><span id="lvl">第 1 層</span></div>
      <div id="pips" aria-hidden="true"><i></i><i></i><i></i><i class="boss"></i></div>
      <div id="timer">0:00 <small>/ 3:00</small></div>
    </div>
    <div id="timebar"><i></i></div>
    <div id="party"></div>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="bossbar" hidden>
      <div class="bn"><b id="bossname"></b><span id="bosspct"></span></div>
      <div class="bh"><i id="bosshp"></i></div>
      <div id="bosscast" hidden><i></i><span></span></div>
    </div>
    <div id="banner" class="off" aria-live="polite"></div>
  </main>

  <footer id="deck">
    <p id="stick-hint">在這一區拖曳就能移動</p>
    <div id="stick-base" hidden><div id="stick-nub"></div></div>
    <div id="skills"></div>
  </footer>

  <section id="menu" class="overlay">
    <div class="wrap">
      <div>
        <p class="eyebrow">三分鐘副本 · 原型</p>
        <h1>燼潮</h1>
      </div>
      <p class="lore">鐘聲沉入海底那天，潮水開始生鏽。四個人、一座塔、三分鐘。</p>
      <div class="run"><b>沉鐘塔</b><span id="m-lvl">第 1 層</span><small id="m-best"></small></div>
      <div class="cards" id="cards"></div>
      <ul class="kit" id="kit"></ul>
      <p class="how">拖曳移動，角色會自動普攻。<br>地上出現紅色範圍就離開。<br>敵人讀條變成金色時按「斷」。</p>
      <p class="gear" id="gear"></p>
      <div class="cta">
        <button class="btn" id="go" type="button">進入副本</button>
        <p class="note">其餘三名隊友由 AI 補位，不用等人。</p>
      </div>
    </div>
  </section>

  <section id="result" class="overlay" hidden>
    <div class="wrap" id="result-body"></div>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const norm = a => Math.atan2(Math.sin(a), Math.cos(a));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

const qs = new URLSearchParams(location.search);
const AUTO = qs.has('auto');                       // debug: an AI plays the player's slot
const SPEED = clamp(+qs.get('speed') || 1, 1, 40); // debug: fast-forward the simulation
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
const C = { ink: tok('--ink'), deep: tok('--deep'), slate: tok('--slate'), line: tok('--line'), glow: tok('--glow'), foam: tok('--foam'),
  mute: tok('--mute'), ember: tok('--ember'), brass: tok('--brass'), danger: tok('--danger'), heal: tok('--heal'), tank: tok('--tank'),
  hex: tok('--hex'), rust: tok('--rust') };
const F = { display: tok('--f-display'), num: tok('--f-num') };

/* ================= Data ================= */
const TIME_LIMIT = 180;
const CLASSES = {
  tank: { name: '盾衛', role: '坦克', mark: '盾', color: C.tank, hp: 1500, atk: 30, aspd: 0.9, range: 14, speed: 92, threat: 8, ultK: 14,
    skills: [
      { id: 'taunt', seal: '嘲', name: '嘲諷擊', cd: 6, desc: '重擊目標，並強迫它攻擊你 4 秒' },
      { id: 'wall', seal: '牆', name: '盾牆', cd: 14, desc: '4 秒內受到的傷害降低 60%' },
      { id: 'kick', seal: '斷', name: '盾擊', cd: 10, desc: '打斷身邊敵人的金色讀條' },
      { id: 'tankUlt', seal: '鐵', name: '鐵潮', ult: true, desc: '全場敵人轉向你，全隊獲得護盾' } ] },
  heal: { name: '潮語者', role: '治療', mark: '潮', color: C.heal, hp: 900, atk: 16, aspd: 1.0, range: 180, speed: 98, threat: 1, ultK: 8,
    skills: [
      { id: 'mend', seal: '泉', name: '湧泉', cd: 2.2, desc: '治療血量最低的隊友，點隊友血條可以指定' },
      { id: 'ring', seal: '環', name: '潮環', cd: 9, desc: '治療你身邊的所有隊友' },
      { id: 'kick', seal: '斷', name: '鹽封', cd: 12, desc: '打斷敵人的金色讀條' },
      { id: 'healUlt', seal: '漲', name: '漲潮', ult: true, desc: '全隊回復一半血量，並救起倒地的隊友' } ] },
  dps: { name: '燼矢', role: '輸出', mark: '矢', color: C.ember, hp: 950, atk: 44, aspd: 0.7, range: 190, speed: 104, threat: 1, ultK: 36,
    skills: [
      { id: 'blast', seal: '爆', name: '爆燃箭', cd: 4, desc: '對目標造成大量傷害' },
      { id: 'roll', seal: '滾', name: '翻滾', cd: 6, desc: '朝移動方向翻滾，翻滾中不會受傷' },
      { id: 'kick', seal: '斷', name: '斷法箭', cd: 10, desc: '打斷敵人的金色讀條' },
      { id: 'dpsUlt', seal: '雨', name: '燼雨', ult: true, desc: '在目標腳下降下 4 秒火雨' } ] }
};
const ENEMY = {
  grunt: { name: '鏽蝕水鬼', hp: 1000, dmg: 34, aspd: 1.3, range: 8, speed: 70, r: 13 },
  caster: { name: '鹽咒祭司', hp: 800, dmg: 150, aspd: 0, range: 165, speed: 60, r: 12 },
  boss: { name: '鏽潮看守者 莫葛', hp: 27000, dmg: 80, aspd: 1.5, range: 10, speed: 58, r: 28 }
};
const WAVES = [ [['grunt', 3]], [['grunt', 2], ['caster', 1]], [['grunt', 2], ['caster', 2]], [['boss', 1]] ];
const BOT_NAMES = { tank: '柯爾', heal: '蜜拉', dps: ['阿燼', '小霧'] };
const SLOTS = { w: ['武器', ['鏽潮錨刃', '沉鐘之舌', '霧燈長弓']], a: ['護甲', ['看守者鍊甲', '鹽殼護肩', '潮紋斗篷']], t: ['飾品', ['霧燈碎片', '潮鳴鐘錘', '生鏽的羅盤']] };

/* ================= Save ================= */
const SAVE_KEY = 'embertide.v1';
const save = { lvl: 1, cls: 'dps', gear: { w: 10, a: 10, t: 10 }, best: {}, runs: 0 };
function loadSave() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s === 'object') Object.assign(save, s); } catch (e) {} }
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const avgIlvl = () => Math.round((save.gear.w + save.gear.a + save.gear.t) / 3);

/* ================= Canvas ================= */
const W = 360; let H = 480, scale = 1, dpr = 1, offX = 0;
const cv = $('#cv'), ctx = cv.getContext('2d');
let floor = null;
function resize() {
  const st = $('#stage'), cw = st.clientWidth, ch = st.clientHeight;
  if (!cw || !ch) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  scale = cw / W; H = ch / scale;
  if (H < 380) { H = 380; scale = ch / H; }
  offX = (cw - W * scale) / 2;
  paintFloor();
}
function paintFloor() {
  floor = document.createElement('canvas');
  floor.width = Math.round(W * scale * dpr); floor.height = Math.round(H * scale * dpr);
  const c = floor.getContext('2d'); c.scale(scale * dpr, scale * dpr);
  const g = c.createRadialGradient(W / 2, H * .5, 20, W / 2, H * .5, H * .75);
  g.addColorStop(0, C.glow); g.addColorStop(1, C.ink);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.strokeStyle = C.foam; c.globalAlpha = .045; c.lineWidth = 1;
  for (let x = 20; x < W; x += 40) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (let y = 20; y < H; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  // the sunken bell, seen from above

    b.setAttribute('aria-label', `${a.name} ${a.def.role}`);
    b.addEventListener('pointerdown', ev => { ev.preventDefault(); if (G && G.player && G.player.cls === 'heal') input.healOn = a; });
    party.appendChild(b); frames.push({ a, el: b, hp: b.querySelector('.hp i') });
  });
  const box = $('#skills'); box.innerHTML = ''; skBtns = [];
  const posCls = ['main', 's1', 's2', 's3'];
  G.player.def.skills.forEach((sk, i) => {

    b.innerHTML = `<b>${sk.seal}</b><small>${sk.name}</small><span class="cdn"></span>`;

    b.addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); lastPD = performance.now(); input.cast[i] = true; });

function hud() {

  $('#gear').innerHTML = `<span>裝等 <b>${avgIlvl()}</b></span><span>武器 <b>${save.gear.w}</b></span><span>護甲 <b>${save.gear.a}</b></span><span>飾品 <b>${save.gear.t}</b></span><span>通關 <b>${save.runs}</b> 次</span>`;
}
function showMenu() { G = null; chosen = save.cls; renderMenu(); $('#result').hidden = true; $('#menu').hidden = false; $('#bossbar').hidden = true; $('#banner').classList.add('off'); }
function start(cls) { save.cls = cls; writeSave(); $('#menu').hidden = true; $('#result').hidden = true; resize(); newRun(cls); }
function showResult(r) {
  const s = G.stats, body = $('#result-body');
  const verdict = !r.win ? '<p class="verdict bad">隊伍全滅，這一層還沒過。</p>'
    : r.onTime ? `<p class="verdict good">三分鐘內通關，下一場升到第 ${save.lvl} 層。</p>`
    : '<p class="verdict">通關了，但超過三分鐘，層數不變。</p>';
  const loot = r.loot ? `<div class="loot"><span class="il">${r.loot.il}</span><div><b>${r.loot.name}</b><small>${r.loot.slot}　${r.loot.up ? `比身上的 ${r.loot.old} 好，已經換上` : `身上的 ${r.loot.old} 比較好，已分解`}</small></div></div>` : '';
  body.innerHTML = `
    <div><p class="eyebrow">沉鐘塔 · 第 ${G.lvl} 層</p><h2>${r.win ? '通關' : '滅團'}</h2></div>
    <div><div class="clock">${fmt(r.t)}</div>${verdict}</div>
    <dl class="stats">
      <div><dt>你造成的傷害</dt><dd>${Math.round(s.dmg).toLocaleString()}</dd></div>
      <div><dt>你的治療量</dt><dd>${Math.round(s.heal).toLocaleString()}</dd></div>
      <div><dt>成功打斷</dt><dd>${s.kicks}</dd></div>
      <div><dt>踩到紅圈</dt><dd>${s.hits}</dd></div>
    </dl>
    ${loot}
    <div class="cta">
      <button class="btn" id="again" type="button">${r.win ? '再來一場' : '再試一次'}</button>
      <button class="btn ghost" id="swap" type="button">換職業</button>
    </div>`;
  $('#again').addEventListener('click', () => start(save.cls));
  $('#swap').addEventListener('click', showMenu);
  $('#result').hidden = false;
}

/* ================= Input ================= */
const deck = $('#deck'), base = $('#stick-base'), nub = $('#stick-nub');
let stickId = null, sox = 0, soy = 0;
deck.addEventListener('pointerdown', ev => {
  if (stickId !== null || ev.target.closest('.sk')) return;
  ev.preventDefault(); stickId = ev.pointerId; try { deck.setPointerCapture(stickId); } catch (e) {}
  const r = deck.getBoundingClientRect(); sox = ev.clientX; soy = ev.clientY;
  base.style.left = (sox - r.left) + 'px'; base.style.top = (soy - r.top) + 'px'; base.hidden = false; nub.style.transform = ''; $('#stick-hint').hidden = true;
});
deck.addEventListener('pointermove', ev => {
  if (ev.pointerId !== stickId) return;
  let dx = ev.clientX - sox, dy = ev.clientY - soy; const m = Math.hypot(dx, dy), R = 44;
  if (m > R) { dx = dx / m * R; dy = dy / m * R; }
  nub.style.transform = `translate(${dx}px,${dy}px)`;
  if (m < 7) { input.mx = 0; input.my = 0; } else { input.mx = dx / R; input.my = dy / R; }
});
const stickEnd = ev => { if (ev.pointerId !== stickId) return; stickId = null; input.mx = 0; input.my = 0; base.hidden = true; };
deck.addEventListener('pointerup', stickEnd); deck.addEventListener('pointercancel', stickEnd);
cv.addEventListener('pointerdown', ev => {
  if (!G || !G.player || !G.player.alive) return;
  const r = cv.getBoundingClientRect(), p = { x: (ev.clientX - r.left - offX) / scale, y: (ev.clientY - r.top) / scale };
  let best = null, bd = 40; for (const e of G.enemies) { const d = dist(p, e) - e.r; if (d < bd) { bd = d; best = e; } }
  if (best) G.player.target = best;
});
addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase(); keys.add(k);
  const i = ['j', 'k', 'l', ';'].indexOf(k), n = ['1', '2', '3', '4'].indexOf(k);
  if (G && (i >= 0 || n >= 0)) input.cast[i >= 0 ? i : n] = true;
});
addEventListener('keyup', ev => keys.delete(ev.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
addEventListener('contextmenu', ev => ev.preventDefault());
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('#stage'));
$('#go').addEventListener('click', () => start(chosen));
let quitArm = 0;
$('#quit').addEventListener('click', () => {
  const q = $('#quit');
  if (performance.now() - quitArm < 2500) { q.textContent = '離開'; quitArm = 0; showMenu(); return; }
  quitArm = performance.now(); q.textContent = '再按一次'; setTimeout(() => { q.textContent = '離開'; }, 2500);
});

/* ================= Loop ================= */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (G && !document.hidden) { if (SPEED > 1) { for (let i = 0; i < SPEED && G.state !== 'over'; i++) step(1 / 60); } else step(dt); hud(); }
  render();
}
function boot(data) {
  loadSave(); if (data && data.save) Object.assign(save, data.save);
  chosen = save.cls in CLASSES ? save.cls : 'dps';
  resize(); renderMenu(); requestAnimationFrame(frame);
}
window.__game = { get G() { return G; }, save, start, showMenu };
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ save }));
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data || {});
})();
</script>
