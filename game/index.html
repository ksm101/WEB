<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>燼潮 沉鐘塔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one portrait screen. Battlefield fills the top, a thumb deck (drag to move + four seals) sits below. */
:root{
  color-scheme:dark;
  --ink:#0a161b; --deep:#10252d; --slate:#1a3540; --line:#2f525e; --glow:#1f4450;
  --foam:#dcefe9; --mute:#8db0ac;
  --ember:#ff8243; --brass:#e3bd6a; --danger:#ff4f64; --heal:#62d99a; --tank:#74abff; --hex:#b193ff; --rust:#b9552f;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-num:"Chakra Petch",ui-monospace,"SF Mono",monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--foam);font-family:var(--f-body);font-size:14px;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--ink)}

/* ---------- HUD ---------- */
#hud{padding-block:8px 6px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:6px;background:var(--deep);border-bottom:1px solid var(--line)}
.hud-top{display:flex;align-items:center;gap:10px}
#quit{min-width:44px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--mute);font-size:12px}
.dungeon{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.dungeon b{font-family:var(--f-display);font-size:16px;letter-spacing:.08em}
.dungeon span{font-size:11px;color:var(--mute)}
#pips{display:flex;gap:6px;align-items:center;margin-left:auto}
#pips i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);display:block}
#pips i.boss{border-radius:1px;transform:rotate(45deg);width:9px;height:9px}
#pips i.now{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,130,67,.22)}
#pips i.done{background:var(--brass);border-color:var(--brass)}
#timer{font-family:var(--f-num);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;min-width:108px;text-align:right}
#timer small{font-size:12px;color:var(--mute);font-weight:500}
#timer.late{color:var(--danger)}
#timebar{height:3px;background:var(--slate);border-radius:2px;overflow:hidden}
#timebar i{display:block;height:100%;width:0;background:var(--brass)}
#timebar.late i{background:var(--danger)}
#party{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pf{position:relative;display:flex;flex-direction:column;gap:4px;padding:5px 6px 6px;border:1px solid var(--line);border-radius:6px;background:var(--slate);text-align:left;min-width:0}
.pf.me{border-color:var(--brass)}
.pf.down{opacity:.45}
.pf.low .hp i{background:var(--danger)}
.pf .nm{display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;overflow:hidden}
.pf .nm em{font-style:normal;font-family:var(--f-display);font-weight:900;font-size:12px}
.pf .nm span{overflow:hidden;text-overflow:ellipsis}
.pf .nm u{margin-left:auto;text-decoration:none;font-size:9px;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 3px}
.pf.me .nm u,.pf.live .nm u{color:var(--brass);border-color:var(--brass)}
.pf .hp{height:6px;border-radius:3px;background:var(--ink);overflow:hidden}
.pf .hp i{display:block;height:100%;width:100%;background:var(--heal)}

/* ---------- Stage ---------- */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#bossbar{position:absolute;top:8px;left:var(--gl);right:var(--gr);display:flex;flex-direction:column;gap:3px;pointer-events:none}
#bossbar .bn{display:flex;justify-content:space-between;font-size:12px;text-shadow:0 1px 2px var(--ink)}
#bossbar .bn b{font-family:var(--f-display);letter-spacing:.06em}
#bossbar .bn span{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--mute)}
#bossbar .bh{height:9px;border:1px solid var(--rust);border-radius:2px;background:rgba(10,22,27,.8);overflow:hidden}
#bossbar .bh i{display:block;height:100%;background:var(--rust)}
#bosscast{height:16px;border:1px solid var(--line);border-radius:2px;background:rgba(10,22,27,.85);overflow:hidden;position:relative;font-size:11px}
#bosscast i{position:absolute;inset:0 auto 0 0;background:var(--line)}
#bosscast.kick{border-color:var(--brass)}
#bosscast.kick i{background:var(--brass)}
#bosscast span{position:relative;display:block;text-align:center;line-height:14px;font-weight:700;color:var(--foam);text-shadow:0 1px 2px var(--ink)}
#bosscast.kick span{color:var(--ink);text-shadow:none}
#banner{position:absolute;left:var(--gl);right:var(--gr);top:26%;text-align:center;font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.12em;
  color:var(--brass);text-shadow:0 2px 0 var(--ink),0 0 18px rgba(10,22,27,.9);pointer-events:none;transition:opacity .3s}
#banner.off{opacity:0}

/* ---------- Thumb deck ---------- */
#deck{position:relative;height:clamp(196px,34%,280px);background:var(--deep);border-top:1px solid var(--line);padding-left:var(--gl);padding-right:var(--gr);touch-action:none}
#stick-hint{position:absolute;left:var(--gl);bottom:18px;margin:0;font-size:12px;color:var(--mute);pointer-events:none;max-width:120px;line-height:1.5}
#stick-base{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:1.5px solid var(--line);background:rgba(26,53,64,.6);pointer-events:none}
#stick-nub{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--foam);opacity:.85}
#skills{position:absolute;right:var(--gr);bottom:14px;width:200px;height:200px;pointer-events:none}
.sk{position:absolute;pointer-events:auto;width:60px;height:60px;border-radius:50%;border:2px solid var(--line);background:var(--slate);color:var(--foam);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;overflow:hidden;touch-action:none}
.sk b{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.05}
.sk small{font-size:9px;color:var(--mute);line-height:1.1}
.sk::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(6,14,18,.82) calc(var(--cd,0)*1turn),transparent 0);pointer-events:none}
.sk .cdn{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--foam);pointer-events:none}
.sk.main{width:88px;height:88px;right:0;bottom:0;border-color:var(--ember)}
.sk.main b{font-size:34px;color:var(--ember)}
.sk.main small{font-size:11px}
.sk.s1{left:18px;top:122px}
.sk.s2{left:48px;top:48px}
.sk.s3{left:122px;top:18px}
.sk.alert{border-color:var(--brass);box-shadow:0 0 0 4px rgba(227,189,106,.35);animation:pulse .5s ease-in-out infinite alternate}
.sk.alert b{color:var(--brass)}
.sk.ult.ready{border-color:var(--brass);box-shadow:0 0 14px rgba(227,189,106,.6)}
.sk.ult.ready b{color:var(--brass)}
.sk:active{transform:scale(.94)}
.sk.cool b,.sk.cool small{opacity:.25}
@keyframes pulse{to{box-shadow:0 0 0 9px rgba(227,189,106,.12)}}
@media (prefers-reduced-motion:reduce){.sk.alert{animation:none}#banner{transition:none}}

/* ---------- Overlays ---------- */
.overlay{position:absolute;inset:0;z-index:5;overflow-y:auto;touch-action:pan-y;background:radial-gradient(130% 55% at 50% 0%,var(--glow) 0%,var(--ink) 72%)}
.wrap{min-height:100%;box-sizing:border-box;padding-block:22px 20px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--mute);margin:0}
h1{font-family:var(--f-display);font-weight:900;font-size:68px;line-height:1;margin:2px 0 0;letter-spacing:.06em;color:var(--ember);text-wrap:balance}
h2{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1.1;margin:0;letter-spacing:.08em;text-wrap:balance}
.lore{margin:0;color:var(--mute);line-height:1.7;max-width:30em}
.run{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.run b{font-family:var(--f-display);font-size:20px;letter-spacing:.08em}
.run span{color:var(--brass);font-family:var(--f-num);font-weight:700}
.run small{margin-left:auto;color:var(--mute);font-family:var(--f-num)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--deep)}
.card b{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1.1}
.card span{font-size:14px;font-weight:700}
.card small{font-size:11px;color:var(--mute)}
.card[aria-pressed="true"]{border-color:var(--brass);background:var(--slate)}
.kit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.kit li{display:grid;grid-template-columns:30px 5em minmax(0,1fr);gap:8px;align-items:baseline}
.kit em{font-style:normal;font-family:var(--f-display);font-weight:900;font-size:18px;color:var(--brass);text-align:center}
.kit b{font-size:13px}
.kit span{font-size:12px;color:var(--mute);line-height:1.5}
.gear{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin:0}
.gear b{font-family:var(--f-num);color:var(--foam)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mute)}
.fields input{font:inherit;font-size:16px;color:var(--foam);background:var(--deep);border:1.5px solid var(--line);border-radius:8px;height:44px;padding:0 10px;min-width:0;
  user-select:text;-webkit-user-select:text;touch-action:auto}
.fields input::placeholder{color:var(--mute);opacity:.7;font-size:13px}
.cta{margin-top:auto;display:flex;flex-direction:column;gap:8px}
#menu .cta{position:sticky;bottom:0;margin-inline:-4px;padding:14px 4px 0;background:linear-gradient(to bottom,transparent,var(--ink) 22%)}
.btn{height:54px;border-radius:8px;border:0;background:var(--ember);color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.2em}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--foam);height:46px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.note{margin:0;font-size:11px;color:var(--mute);text-align:center;line-height:1.6}
.note.warn{color:var(--danger);font-size:13px}
.how{margin:0;padding:10px 12px;border-left:2px solid var(--brass);background:var(--deep);font-size:12px;line-height:1.8;color:var(--foam)}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slots li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--deep)}
.slots li.me{border-color:var(--brass)}
.slots em{font-style:normal;font-family:var(--f-display);font-weight:900;font-size:24px;text-align:center}
.slots b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slots li.open b{color:var(--mute);font-weight:400}
.slots small{font-size:11px;color:var(--mute)}
.slots li.ok small{color:var(--brass)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.chip{position:relative;flex:none;height:40px;min-width:60px;padding:0 14px;border:1.5px solid var(--line);border-radius:20px;background:var(--deep);color:var(--foam);font-size:13px}
.chip b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;box-sizing:border-box;padding:0 4px;border-radius:9px;background:var(--ember);color:var(--ink);font-family:var(--f-num);font-size:11px;line-height:18px;text-align:center}
.overlay.top{z-index:7}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.questline{display:flex;align-items:baseline;gap:10px;width:100%;box-sizing:border-box;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--deep);text-align:left;font-size:13px}
.questline span{flex:none;color:var(--brass);font-size:11px;letter-spacing:.16em}
.questline b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.questline i{flex:none;font-style:normal;font-family:var(--f-num);color:var(--mute)}
.questline.ready{border-color:var(--brass)}
.questline.ready i{color:var(--brass);font-family:var(--f-body);font-weight:700}
#bag-body,#so-body,#quests-body{display:flex;flex-direction:column;gap:14px}
.recipes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.recipes li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--deep)}
.recipes .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.recipes b{font-size:15px}
.recipes small{font-size:12px;color:var(--mute);line-height:1.5}
.recipes .cost{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--foam)}
.recipes .cost .lack{color:var(--danger)}
.sk.pot{left:var(--gl);top:12px;width:54px;height:54px;border-color:var(--heal)}
.sk.pot b{font-size:20px;color:var(--heal)}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{margin:6px 0 0;font-size:12px;letter-spacing:.16em;color:var(--mute);font-weight:400}
.group .note{text-align:left}
.slots .acts{display:flex;align-items:center;gap:6px}
.mini{height:36px;padding:0 12px;border-radius:6px;border:1.5px solid var(--line);background:transparent;color:var(--foam);font-size:13px;white-space:nowrap}
.mini.go{background:var(--ember);border-color:var(--ember);color:var(--ink);font-weight:700}
.mini:disabled{opacity:.45}
.fields.one{grid-template-columns:minmax(0,1fr)}
#toast{position:absolute;z-index:9;left:var(--gl);right:var(--gr);top:10px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--brass);border-radius:8px;background:var(--slate);font-size:13px;line-height:1.5}
#toast-msg{flex:1;min-width:0}
#toast-btns{display:flex;gap:6px;flex:none}
.clock{font-family:var(--f-num);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.verdict{margin:0;font-size:14px}
.verdict.good{color:var(--brass)} .verdict.bad{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0}
.stats div{background:var(--deep);padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.stats dt{font-size:11px;color:var(--mute)}
.stats dd{margin:0;font-family:var(--f-num);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.loot{border:1.5px solid var(--brass);border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:12px;background:var(--deep)}
.loot .il{font-family:var(--f-num);font-weight:700;font-size:30px;color:var(--brass)}
.loot div{display:flex;flex-direction:column;gap:2px;min-width:0}
.loot b{font-family:var(--f-display);font-size:16px}
.loot small{font-size:12px;color:var(--mute)}
</style>

<div id="app">
  <header id="hud">
    <div class="hud-top">
      <button id="quit" type="button">離開</button>
      <div class="dungeon"><b>沉鐘塔</b><span id="lvl">第 1 層</span></div>
      <div id="pips" aria-hidden="true"><i></i><i></i><i></i><i class="boss"></i></div>
      <div id="timer">0:00 <small>/ 3:00</small></div>
    </div>
    <div id="timebar"><i></i></div>
    <div id="party"></div>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="bossbar" hidden>
      <div class="bn"><b id="bossname"></b><span id="bosspct"></span></div>
      <div class="bh"><i id="bosshp"></i></div>
      <div id="bosscast" hidden><i></i><span></span></div>
    </div>
    <div id="banner" class="off" aria-live="polite"></div>
  </main>

  <footer id="deck">
    <p id="stick-hint">在這一區拖曳就能移動</p>
    <div id="stick-base" hidden><div id="stick-nub"></div></div>
    <button class="sk pot" id="pot" type="button" aria-label="潮息藥水：回復血量，每場限用一瓶" hidden><b>藥</b><small>藥水</small></button>
    <div id="skills"></div>
  </footer>

  <section id="menu" class="overlay">
    <div class="wrap">
      <div><p class="eyebrow">三分鐘副本 · 原型</p><h1>燼潮</h1></div>
      <div class="chips">
        <button class="chip" id="quests-btn" type="button">任務<b id="q-badge" hidden></b></button>
        <button class="chip" id="bag-btn" type="button">背包</button>
        <button class="chip" id="friends-btn" type="button" hidden>好友<b id="fr-badge" hidden></b></button>
      </div>
      <p class="lore">鐘聲沉入海底那天，潮水開始生鏽。四個人、一座塔、三分鐘。</p>
      <div class="run"><b>沉鐘塔</b><span id="m-lvl">第 1 層</span><small id="m-best"></small></div>
      <button class="questline" id="m-quest" type="button"></button>
      <div class="cards" id="cards"></div>
      <ul class="kit" id="kit"></ul>
      <p class="how" id="how">拖曳移動，角色會自動普攻。<br>地上出現紅色範圍就離開。<br>敵人讀條變成金色時按「斷」。</p>
      <p class="gear" id="gear"></p>
      <div class="fields" id="fields" hidden>
        <label for="nick">暱稱<input id="nick" type="text" maxlength="8" autocomplete="off" spellcheck="false"></label>
        <label for="room">房號（和朋友輸入同一組）<input id="room" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="留空就隨機配對"></label>
      </div>
      <div class="cta">
        <button class="btn" id="go-online" type="button" hidden>線上配對</button>
        <button class="btn" id="go" type="button">單人開始</button>
        <p class="note" id="note"></p>
      </div>
    </div>
  </section>

  <section id="lobby" class="overlay" hidden>
    <div class="wrap">
      <div><p class="eyebrow">線上配對</p><h2 id="lb-title">連線中</h2></div>
      <p class="lore" id="lb-info"></p>
      <ul class="slots" id="lb-slots"></ul>
      <div class="fields one" id="lb-linkbox" hidden><label for="lb-url">邀請連結（朋友點開就會進這個房間）<input id="lb-url" type="text" readonly></label></div>
      <div class="cta">
        <button class="btn" id="lb-ready" type="button" hidden>開始</button>
        <button class="btn ghost" id="lb-link" type="button" hidden>複製邀請連結</button>
        <button class="btn ghost" id="lb-friends" type="button" hidden>邀請好友</button>
        <button class="btn ghost" id="lb-cancel" type="button">取消</button>
      </div>
    </div>
  </section>

  <section id="result" class="overlay" hidden>
    <div class="wrap" id="result-body"></div>
  </section>

  <section id="social" class="overlay top" hidden>
    <div class="wrap">
      <div class="head">
        <div><p class="eyebrow">一起打副本的人</p><h2>好友</h2></div>
        <button class="chip" id="so-close" type="button">關閉</button>
      </div>

<script src="sim.js"></script>
<script>
(() => {
'use strict';
const S = window.Sim, { W, H, TIME_LIMIT, CLASSES, ENEMY, SPOTS } = S;
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);

const qs = new URLSearchParams(location.search);

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const css = getComputedStyle(document.documentElement);

/* ================= Save =================

const inviteRoom = cleanCode(qs.get('room'));   // opened from a friend's invite link
/* Run a change to the save and report which quests it finished. */

/* ================= Canvas ================= */

const cv = $('#cv'), ctx = cv.getContext('2d');

  for (let x = 20; x < W; x += 40) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (let y = 20; y < H; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }

/* everything the player does goes through here, so solo and online behave the same */
function act(o) {

}

/* ================= Online ================= */

}

/* Your own character moves the moment you drag, without waiting for the server; it is then eased toward

function toast(msg, acts, ms) {
  const t = $('#toast'), box = $('#toast-btns'); $('#toast-msg').textContent = msg; box.textContent = '';
  for (const [label, fn] of acts || []) { const b = el('button', 'mini' + (fn ? ' go' : ''), label); b.type = 'button'; b.addEventListener('click', () => { t.hidden = true; if (fn) fn(); }); box.appendChild(b); }
  t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, ms || 3500);
}

/* ---------- friends ---------- */
function openSocial() {
  $('#social').hidden = false; send({ t: 'social' }); renderSocial();
  clearInterval(net.socialT); net.socialT = setInterval(() => { if ($('#social').hidden) clearInterval(net.socialT); else send({ t: 'social' }); }, 5000);
}
function closeSocial() { $('#social').hidden = true; clearInterval(net.socialT); }
function invite(id) {
  if (mode === 'lobby' && net.lobby && net.lobby.code) return send({ t: 'invite', id });
  if (mode === 'lobby') return toast('隨機配對的房間不能邀請。先取消，再從好友名單邀請。', [], 4500);
  let code = ''; for (let i = 0; i < 4; i++) code += pick('ABCDEFGHJKLMNPQRSTUVWXYZ23456789'.split(''));
  net.pendingInvite = id; closeSocial(); chosen = save.cls; goOnline(code);   // open a room first, the invite goes out once it exists
}
function renderSocial() {
  const s = net.social, n = s ? s.inbox.length : 0, badge = $('#fr-badge'); badge.hidden = !n; badge.textContent = n;
  if ($('#social').hidden) return;
  const body = $('#so-body'); body.textContent = ''; if (!s) return;
  const STATE = { off: '離線', on: '在線上', lobby: '在房間裡', run: '副本中' };
  group(body, '想加你的人', s.inbox.map(f => row('＋', C.brass, f.name, '', [['接受', () => send({ t: 'friend', id: f.id }), 'go'], ['略過', () => send({ t: 'ignore', id: f.id })]])));
  group(body, '好友', s.friends.map(f => {
    const acts = []; if (f.mutual && (f.state === 'on' || f.state === 'lobby')) acts.push(['邀請', () => invite(f.id), 'go']);
    acts.push(['移除', () => send({ t: 'friend', id: f.id, on: false }), 'sure']);
    return row('●', f.mutual && f.state !== 'off' ? C.heal : C.line, f.name, f.mutual ? STATE[f.state] : '等對方加你', acts);
  }), '還沒有好友。打一場線上副本，就能在結算畫面把隊友加進來。');
  group(body, '最近隊友', s.recent.map(r => row(CLASSES[r.cls].mark, C[CLASSES[r.cls].color], r.name, r.friend ? '已在名單' : '', r.friend ? [] : [['加好友', () => send({ t: 'friend', id: r.id }), 'go']])),
    '線上副本裡遇到的玩家會列在這裡。');
}

/* ---------- bag and workshop ---------- */
function openBag() { $('#bag').hidden = false; renderBag(); }
function renderBag() {
  if ($('#bag').hidden) return;
  const body = $('#bag-body'), inv = save.inv, waiting = online && !net.authed; body.textContent = '';
  const dl = el('dl', 'stats');
  for (const [k, v] of [[S.MATS.scrap, inv.scrap], [S.MATS.salt, inv.salt], [S.MATS.shard, inv.shard], ['潮息藥水', `${inv.potion} / ${S.POTION_CAP}`]]) { const d = el('div'); d.append(el('dt', '', k), el('dd', '', v)); dl.appendChild(d); }
  body.append(dl, el('p', 'lore', `材料從副本掉落，三分鐘內通關一定有沉鐘碎片。淬鍊的上限跟著層數走，第 ${save.lvl} 層是裝等 ${S.gearCap(save.lvl)}。`));
  for (const [title, kind] of [['鍛造　直接做一件', 'forge'], ['淬鍊　把身上的往上推', 'temper'], ['消耗品', 'potion']]) {
    const g = el('div', 'group'), ul = el('ul', 'recipes'); g.append(el('h3', '', title), ul);
    for (const rc of S.RECIPES.filter(r => r.kind === kind)) {
      const info = S.recipeInfo(save, rc), li = el('li'), left = el('div', 'info'), cost = el('span', 'cost');
      for (const k of Object.keys(rc.cost)) cost.appendChild(el('span', inv[k] < rc.cost[k] ? 'lack' : '', `${S.MATS[k]} ${inv[k]}/${rc.cost[k]}`));
      left.append(el('b', '', rc.name), el('small', '', info.can || info.why === '材料不夠' ? info.result : info.why), cost);
      const b = el('button', 'mini go', '製作'); b.type = 'button'; b.id = 'craft-' + rc.id; b.disabled = !info.can || waiting;
      b.addEventListener('click', () => { b.disabled = true; doCraft(rc.id); });
      li.append(left, b); ul.appendChild(li);
    }
    body.appendChild(g);
  }
}
function doCraft(id) {
  if (online) return send({ t: 'craft', id });        // the server owns the bag
  let r; const done = newlyDone(() => { r = S.craft(save, id); if (r.ok) S.questEvent(save, { type: 'craft', kind: r.kind }, Date.now()); });
  writeSave(); toast(r.msg + (done.length ? `任務完成：${done.join('、')}。` : ''), [], done.length ? 4500 : 3000); renderBag(); renderMenu();
}

/* ---------- quests ---------- */
function openQuests() { $('#quests').hidden = false; renderQuests(); }
function renderQuests() {
  const ql = S.questList(save, Date.now(), online), ready = ql.items.filter(x => x.ready).length, badge = $('#q-badge');
  badge.hidden = !ready; badge.textContent = ready;
  const main = ql.items.find(x => x.group === 'main'), line = $('#m-quest'); line.textContent = ''; line.classList.toggle('ready', !!(main && main.ready));
  line.append(el('span', '', '主線'), el('b', '', main ? `${main.title}　${main.goal}` : '主線暫時到這裡，之後會再加'), el('i', '', main ? (main.ready ? '可領獎' : `${main.have} / ${main.need}`) : ''));
  if ($('#quests').hidden) return;
  const body = $('#quests-body'), waiting = online && !net.authed; body.textContent = '';
  for (const [key, title] of [['main', `主線　已完成 ${ql.mainDone} / ${ql.mainTotal}`], ['week', '本週　每週一重置'], ['side', '支線']]) {
    const rows = ql.items.filter(x => x.group === key), g = el('div', 'group'), ul = el('ul', 'recipes'); g.appendChild(el('h3', '', title));
    if (!rows.length) { if (key !== 'main') continue; g.appendChild(el('p', 'note', '主線暫時到這裡，之後會再加。')); body.appendChild(g); continue; }
    for (const it of rows) {
      const li = el('li'), left = el('div', 'info'), meta = el('span', 'cost');
      meta.append(el('span', '', `進度 ${it.have}/${it.need}`), el('span', '', `獎勵　${it.reward}`));
      left.append(el('b', '', it.title), el('small', '', it.goal), meta);
      const b = el('button', 'mini' + (it.ready ? ' go' : ''), it.claimed ? '已領' : it.ready ? '領取' : '進行中'); b.type = 'button'; b.id = 'claim-' + it.id; b.disabled = !it.ready || waiting;
      b.addEventListener('click', () => { b.disabled = true; doClaim(it.id); });
      li.append(left, b); ul.appendChild(li);
    }
    g.appendChild(ul); body.appendChild(g);
  }
}
function doClaim(id) {
  if (online) return send({ t: 'claim', id });        // the server hands out rewards
  const r = S.questClaim(save, id, Date.now()); writeSave(); toast(r.msg, [], 3500); renderBag(); renderMenu();
}

function showResult(r, s, loot, lvl, more) {
  const body = $('#result-body'); body.textContent = '';
  const head = el('div'); head.append(el('p', 'eyebrow', `沉鐘塔 · 第 ${lvl} 層`), el('h2', '', r.win ? '通關' : '滅團'));
  const time = el('div'); time.append(el('div', 'clock', fmt(r.t)),
    !r.win ? el('p', 'verdict bad', '隊伍全滅，這一層還沒過。')
      : r.onTime ? el('p', 'verdict good', save.lvl > lvl ? `三分鐘內通關，你的層數升到第 ${save.lvl} 層。` : '三分鐘內通關。')
      : el('p', 'verdict', '通關了，但超過三分鐘，層數不變。'));
  const dl = el('dl', 'stats');
  for (const [k, v] of [['你造成的傷害', Math.round(s.dmg).toLocaleString()], ['你的治療量', Math.round(s.heal).toLocaleString()], ['成功打斷', s.kicks], ['踩到紅圈', s.hits]]) { const d = el('div'); d.append(el('dt', '', k), el('dd', '', v)); dl.appendChild(d); }
  body.append(head, time, dl);
  if (more.note) body.appendChild(el('p', 'note warn', more.note));
  if (loot) { const box = el('div', 'loot'), inner = el('div'); inner.append(el('b', '', loot.name), el('small', '', `${loot.slot}　${loot.up ? `比身上的 ${loot.old} 好，已經換上` : `身上的 ${loot.old} 比較好，已分解`}`)); box.append(el('span', 'il', loot.il), inner); body.appendChild(box); }
  if (more.mats) {
    const line = el('p', 'gear'); line.appendChild(el('span', '', '材料'));
    for (const k of Object.keys(more.mats)) if (more.mats[k] > 0) { const sp = el('span', '', S.MATS[k] + ' '); sp.append(el('b', '', '+' + more.mats[k])); line.appendChild(sp); }
    body.appendChild(line);
  }
  if (more.quests && more.quests.length) body.appendChild(el('p', 'verdict good', `任務完成：${more.quests.join('、')}。回主選單的「任務」領獎。`));
  const mates = more.mates || [], team = mates.length > 0 && !!more.again;
  group(body, '這場的隊友', mates.map(f => row(CLASSES[f.cls].mark, C[CLASSES[f.cls].color], String(f.name), f.friend ? '已在名單' : '',
    f.friend ? [] : [['加好友', b => { send({ t: 'friend', id: f.id }); b.textContent = '已送出'; }, 'go']])));
  const cta = el('div', 'cta'), again = el('button', 'btn', team ? '原隊再來一場' : r.win ? '再來一場' : '再試一次'), swap = el('button', 'btn ghost', '換職業');
  again.type = swap.type = 'button'; again.id = 'again'; swap.id = 'swap';
  again.addEventListener('click', () => { if (lastMode !== 'online') return startSolo(save.cls); chosen = save.cls; goOnline(team ? String(more.again) : undefined); });
  swap.addEventListener('click', () => showMenu());
  cta.append(again, swap); body.appendChild(cta);
  $('#result').hidden = false;
}

/* ================= Input ================= */
const deck = $('#deck'), base = $('#stick-base'), nub = $('#stick-nub');
let stickId = null, sox = 0, soy = 0;
deck.addEventListener('pointerdown', ev => {
  if (stickId !== null || ev.target.closest('.sk')) return;
  ev.preventDefault(); stickId = ev.pointerId; try { deck.setPointerCapture(stickId); } catch (e) {}
  const r = deck.getBoundingClientRect(); sox = ev.clientX; soy = ev.clientY;
  base.style.left = (sox - r.left) + 'px'; base.style.top = (soy - r.top) + 'px'; base.hidden = false; nub.style.transform = ''; $('#stick-hint').hidden = true;
});
deck.addEventListener('pointermove', ev => {
  if (ev.pointerId !== stickId) return;
  let dx = ev.clientX - sox, dy = ev.clientY - soy; const m = Math.hypot(dx, dy), R = 44;
  if (m > R) { dx = dx / m * R; dy = dy / m * R; }
  nub.style.transform = `translate(${dx}px,${dy}px)`;
  if (m < 7) { stick.x = 0; stick.y = 0; } else { stick.x = dx / R; stick.y = dy / R; }
});
const stickEnd = ev => { if (ev.pointerId !== stickId) return; stickId = null; stick.x = 0; stick.y = 0; base.hidden = true; };
deck.addEventListener('pointerup', stickEnd); deck.addEventListener('pointercancel', stickEnd);
cv.addEventListener('pointerdown', ev => {
  if (!V || !V.me || !V.me.alive) return;
  const r = cv.getBoundingClientRect(), p = { x: (ev.clientX - r.left - offX) / scale, y: (ev.clientY - r.top - offY) / scale };
  let best = null, bd = 40; for (const e of V.enemies) { const d = dist(p, e) - e.r; if (d < bd) { bd = d; best = e; } }
  if (best) act({ g: best.id });
});
addEventListener('keydown', ev => {
  if (ev.target && ev.target.tagName === 'INPUT') return;
  const k = ev.key.toLowerCase(); keys.add(k);
  const i = ['j', 'k', 'l', ';'].indexOf(k), n = ['1', '2', '3', '4'].indexOf(k);
  if (V && (i >= 0 || n >= 0)) act({ c: i >= 0 ? i : n });
  if (V && (k === 'h' || k === '5')) act({ p: 1 });
});
addEventListener('keyup', ev => keys.delete(ev.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
addEventListener('contextmenu', ev => { if (!(ev.target && ev.target.tagName === 'INPUT')) ev.preventDefault(); });
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('#stage'));
$('#go').addEventListener('click', () => startSolo(chosen));
$('#go-online').addEventListener('click', goOnline);
$('#lb-ready').addEventListener('click', () => send({ t: 'ready' }));
$('#lb-cancel').addEventListener('click', () => toMenu());
$('#lb-link').addEventListener('click', () => {
  const inp = $('#lb-url'), manual = () => { inp.focus(); inp.select(); toast('自動複製沒成功，長按上面的連結來複製。', [], 4000); };
  try { navigator.clipboard.writeText(inp.value).then(() => toast('已複製邀請連結，貼給朋友就能進來。', [], 3000), manual); } catch (e) { manual(); }
});
$('#lb-friends').addEventListener('click', openSocial);
$('#friends-btn').addEventListener('click', openSocial);
$('#so-close').addEventListener('click', closeSocial);
$('#bag-btn').addEventListener('click', openBag);
$('#quests-btn').addEventListener('click', openQuests);
$('#m-quest').addEventListener('click', openQuests);
$('#quests-close').addEventListener('click', () => { $('#quests').hidden = true; });
$('#bag-close').addEventListener('click', () => { $('#bag').hidden = true; });
$('#pot').addEventListener('pointerdown', ev => { ev.preventDefault(); ev.stopPropagation(); act({ p: 1 }); });
$('#room').addEventListener('input', () => renderMenu());
let quitArm = 0;
$('#quit').addEventListener('click', () => {
  const q = $('#quit');
  if (performance.now() - quitArm < 2500) { q.textContent = '離開'; quitArm = 0; toMenu(); return; }
  quitArm = performance.now(); q.textContent = '再按一次'; setTimeout(() => { q.textContent = '離開'; }, 2500);
});

/* ================= Loop ================= */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts; clock += dt;
  if (V && !document.hidden && (mode === 'solo' || mode === 'online')) {
    pushMove(ts);
    if (mode === 'solo') {
      if (SPEED > 1) { for (let i = 0; i < SPEED && G.state !== 'over'; i++) S.step(G, 1 / 60); } else S.step(G, dt);
      const evs = G.events; G.events = []; for (const o of evs) handleEvent(o);
      if (G.state === 'over' && !G.result.shown) { G.result.shown = true; conclude(G.result, V.me.stats); }
    } else { buildView(ts); predictMe(dt, ts); }
    updFx(dt); hud();
  }
  render(dt);
}
function boot(data) {
  loadSave(); if (data && data.save) Object.assign(save, data.save);
  if (inviteRoom) save.room = inviteRoom;
  resize(); showMenu(''); probe(); requestAnimationFrame(frame);
}
window.__game = { get V() { return V; }, get G() { return G; }, get mode() { return mode; }, net, save, startSolo, showMenu, send };
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ save }));
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data || {});
})();
</script>
